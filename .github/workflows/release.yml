# Draft: needs secrets.DEPLOY_HOOK_SECRET and vars.DEPLOY_HOOK_URL (vars.DEMO_URL optional). See docs/adr/0006.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fpirim/fikopar

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy demo (signed hook)
    runs-on: ubuntu-latest
    needs: image
    if: vars.DEPLOY_HOOK_URL != ''
    environment:
      name: demo
      url: ${{ vars.DEMO_URL || 'https://fikopar.fpirim.me' }}
    env:
      HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
      HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
      DIGEST: ${{ needs.image.outputs.digest }}
      VERSION: ${{ needs.image.outputs.version }}
      DEMO_URL: ${{ vars.DEMO_URL || 'https://fikopar.fpirim.me' }}
    steps:
      - name: Notify deploy hook
        run: |
          set -euo pipefail
          [ -n "$HOOK_SECRET" ] || { echo "::error::DEPLOY_HOOK_SECRET missing"; exit 1; }
          body=$(jq -cn --arg image "$IMAGE" --arg digest "$DIGEST" --arg version "$VERSION" \
            '{image: $image, digest: $digest, version: $version}')
          ts=$(date +%s)
          # timestamp is signed too so a captured request can't be replayed
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | awk '{print $NF}')
          curl -fsS --max-time 30 -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Fikopar-Timestamp: $ts" \
            -H "X-Fikopar-Signature: sha256=$sig" \
            --data "$body"
      - name: Wait for new version on /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 5 "$DEMO_URL/healthz" | jq -r .version || true)
            echo "attempt $i: live version=${got:-?} want=$VERSION"
            [ "$got" = "$VERSION" ] && exit 0
            sleep 6
          done
          echo "::error::Demo did not report version $VERSION in time"; exit 1
