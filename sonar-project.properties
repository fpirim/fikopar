sonar.organization=fpirim
sonar.projectKey=fpirim_fikopar
sonar.projectName=fikopar

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=legacy/**,**/node_modules/**,**/dist/**,frontend/coverage/**,backend/bin/**,backend/migrations/**,**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,frontend/e2e/**

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,frontend/coverage-e2e/lcov.info

sonar.sourceEncoding=UTF-8
