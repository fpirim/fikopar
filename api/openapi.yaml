              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/movements:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockMovements
      summary: Append-only movements from documents, counts and transfers
      parameters:
        - { name: partId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Movements, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/transfers:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Stock]
      operationId: transferStock
      summary: Move stock between the company's depots (paired OUT/IN movements)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransfer' }
      responses:
        '201':
          description: Paired movements
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/stock/counts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockCounts
      summary: Stock counts (sayım)
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Stock]
      operationId: openStockCount
      summary: Open a count for a depot, year and optional shelf range
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountOpen' }
      responses:
        '201': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/stock/counts/{countId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    get:
      tags: [Stock]
      operationId: getStockCount
      summary: Count with lines and differences
      responses:
        '200': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    put:
      tags: [Stock]
      operationId: upsertStockCountLines
      summary: Record counted quantities (by part and shelf) while the count is OPEN
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/StockCountLineWrite' } }
      responses:
        '200': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/orgs/{orgId}/stock/counts/{countId}/finalize:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: finalizeStockCount
      summary: OPEN → FINALIZED; differences become ADJUST movements
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/orgs/{orgId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Read-only, append-only audit trail (admin)
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrgId:
      name: orgId
      in: path
      required: true
      description: Tenant. Caller must be a member (or admin).
      schema: { type: integer, minimum: 1 }
    DepotIdQuery:
      name: depotId
      in: query
      description: Restrict to one depot; omitted means all depots of the company.
      schema: { type: integer }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: integer }
    PartId:
      name: partId
      in: path
      required: true
      schema: { type: integer }
    CountId:
      name: countId
      in: path
      required: true
      schema: { type: integer }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: integer }
    Filename:
      name: filename
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous `nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID. Unique per (org, key) for 24 h. Same key + same body replays the stored
        response; same key + different body → 422 ERR_IDEMPOTENCY_KEY_REUSED; in-flight → 409 ERR_IDEMPOTENCY_IN_PROGRESS.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (`"<version>"`) from the last read. Missing → 428, stale → 412.
      schema: { type: string, examples: ['"3"'] }

  headers:
    ETag:
      description: Current aggregate version, quoted.
      schema: { type: string }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3 }
    AvatarUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [avatar]
            properties:
              avatar: { type: string, contentMediaType: application/octet-stream }

  responses:
    BadRequest:
      description: Invalid input (ERR_INVALID_REQUEST, ERR_INVALID_ID, field validation codes)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid token or credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not a member of the organization or missing role (ERR_FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (ERR_*_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Uniqueness or state conflict (ERR_*_EXISTS, ERR_INVALID_STATE_TRANSITION, ERR_IDEMPOTENCY_IN_PROGRESS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match does not match current version (ERR_VERSION_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match header missing (ERR_PRECONDITION_REQUIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Business rule violated (ERR_ENTRY_UNBALANCED, ERR_INSUFFICIENT_STOCK, ERR_IDEMPOTENCY_KEY_REUSED, …)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkCode:
      description: Success notification code (OK_USER_DELETED, OK_ORG_DELETED, OK_SICIL_DELETED)
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, pattern: '^OK_[A-Z_]+$' }
    Image:
      description: Uploaded image file
      content:
        image/*:
          schema: { type: string, contentMediaType: application/octet-stream }
    UserResponse:
      description: User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    OrganizationResponse:
      description: Organization
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Organization' }
    AccountResponse:
      description: Ledger account
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }
    JournalEntryResponse:
      description: Journal entry with postings
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JournalEntry' }
    PartResponse:
      description: Part
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Part' }
    DocumentResponse:
      description: Document
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Document' }
    ReceiptResponse:
      description: Receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    StockCountResponse:
      description: Stock count
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StockCount' }
    InstrumentResponse:
      description: Instrument
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Instrument' }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string, description: Developer-facing detail; never shown to end users }
        field: { type: string, description: Offending field for validation errors }
        traceId: { type: string, description: Request ID (X-Request-Id) }
    ErrorCode:
      type: string
      description: Language-agnostic code; translated by the client. The first group exists today.
      enum:
        - ERR_INVALID_REQUEST
        - ERR_INVALID_ID
        - ERR_USER_NOT_FOUND
        - ERR_ORG_NOT_FOUND
        - ERR_INVALID_CREDENTIALS
        - ERR_TOKEN_GENERATION
        - ERR_NO_FILE_UPLOADED
        - ERR_FILE_TOO_LARGE
        - ERR_FILE_OPEN
        - ERR_MISSING_TOKEN
        - ERR_INVALID_TOKEN_FORMAT
        - ERR_INVALID_TOKEN
        - ERR_UNAUTHORIZED
        - ERR_FORBIDDEN
        - ERR_SLUG_INVALID
        - ERR_SLUG_EXISTS
        - ERR_EMAIL_EXISTS
        - ERR_CANNOT_DELETE_SELF
        - ERR_CANNOT_DELETE_LAST_ADMIN
        - ERR_HESAP_NO_REQUIRED
        - ERR_HESAP_ADI_REQUIRED
        - ERR_HESAP_NO_EXISTS
        - ERR_SICIL_NOT_FOUND
        - ERR_INVALID_SICIL_TIPI
        - ERR_INVALID_TELEFON_TIPI
        - ERR_TELEFON_NUMARA_REQUIRED
        - ERR_INVALID_ISKONTO
        - ERR_INTERNAL
        - ERR_PRECONDITION_REQUIRED
        - ERR_VERSION_CONFLICT
        - ERR_IDEMPOTENCY_KEY_REQUIRED
        - ERR_IDEMPOTENCY_KEY_REUSED
        - ERR_IDEMPOTENCY_IN_PROGRESS
        - ERR_INVALID_STATE_TRANSITION
        - ERR_DEPOT_NOT_FOUND
        - ERR_DEPOT_REQUIRED
        - ERR_NUMBER_SERIES_BACKWARDS
        - ERR_ACCOUNT_NOT_FOUND
        - ERR_ACCOUNT_CODE_EXISTS
        - ERR_ACCOUNT_INACTIVE
        - ERR_CURRENCY_MISMATCH
        - ERR_ENTRY_NOT_FOUND
        - ERR_ENTRY_UNBALANCED
        - ERR_ENTRY_TOO_FEW_LINES
        - ERR_ENTRY_ALREADY_REVERSED
        - ERR_ENTRY_OWNED_BY_SOURCE
        - ERR_ALREADY_CARRIED_FORWARD
        - ERR_INVALID_AMOUNT
        - ERR_PART_NOT_FOUND
        - ERR_PART_CODE_EXISTS
        - ERR_PRICE_LIST_NOT_FOUND
        - ERR_INSUFFICIENT_STOCK
        - ERR_STOCK_COUNT_NOT_OPEN
        - ERR_DOCUMENT_NOT_FOUND
        - ERR_DOCUMENT_EMPTY
        - ERR_DOCUMENT_NOT_DRAFT
        - ERR_LINKED_DOCUMENT_INVALID
        - ERR_CREDIT_LIMIT_EXCEEDED
        - ERR_INSTRUMENT_NOT_FOUND
        - ERR_INSTRUMENT_DUPLICATE
        - ERR_DUE_BEFORE_ISSUE
        - ERR_RECEIPT_NOT_FOUND
        - ERR_RECEIPT_ALREADY_VOIDED
        - ERR_RECEIPT_OWNED_BY_INSTRUMENT

    Money:
      type: string
      description: Decimal amount with two fraction digits, never a JSON number.
      pattern: '^-?\d{1,16}\.\d{2}$'
      examples: ['1250.00']
    Money4:
      type: string
      description: Unit price with up to four fraction digits.
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.3456']
    Quantity:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.5']
    Percent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,4})?$'
      examples: ['18']
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      default: TRY

    GridRequest:
      type: object
      description: AG-Grid server-side row model request (existing).
      properties:
        startRow: { type: integer, minimum: 0 }
        endRow: { type: integer, minimum: 0 }
        sortModel:
          type: array
          items:
            type: object
            properties:
              colId: { type: string }
              sort: { type: string, enum: [asc, desc] }
        filterModel:
          type: object
          additionalProperties:
            type: object
            properties:
              filterType: { type: string }
              type:
                type: string
                enum: [contains, notContains, equals, notEqual, startsWith, endsWith, blank, notBlank]
              filter: { type: string }
              filterTo: { type: string }
        search: { type: string, description: Free-text OR ILIKE across searchable columns }
    GridResponse:
      type: object
      required: [rows, totalCount]
      properties:
        rows: { type: array, items: {} }
        totalCount: { type: integer, format: int64 }

    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationWrite:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        logo_url: { type: [string, 'null'] }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserWrite:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organization_ids: { type: array, items: { type: integer } }

    SicilTipi: { type: string, enum: [FIRMA, MUSTERI, BANKA], description: 'Supplier (firma) / customer / bank' }
    TelefonTipi: { type: string, enum: [CEP, EV, IS, FAKS, DIGER], description: 'Mobile / home / work / fax / other' }
    SicilTelefon:
      type: object
      required: [tipi, numara]
      properties:
        id: { type: integer, readOnly: true }
        sicil_id: { type: integer, readOnly: true }
        tipi: { $ref: '#/components/schemas/TelefonTipi' }
        numara: { type: string }
    Sicil:
      type: object
      description: Account card (sicil) of a trading partner.
      required: [id, organization_id, hesap_no, hesap_adi, sicil_tipi]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        hesap_no: { type: string, maxLength: 64 }
        hesap_adi: { type: string, maxLength: 255 }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string, description: Payment term (days) }
        iskonto: { type: number, description: Default discount percent (legacy field; kept numeric for compatibility) }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
        credit_limit: { $ref: '#/components/schemas/Money', description: Planned }
        contacts:
          description: Planned; contact people with their own phones and emails
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              role: { type: string }
              phone: { type: string }
              email: { type: string, format: email }
        emails: { type: array, items: { type: string, format: email }, description: Planned }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SicilCreate:
      type: object
      required: [organization_id, hesap_no, hesap_adi]
      properties:
        organization_id: { type: integer }
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
    SicilUpdate:
      type: object
      description: Partial update; unknown fields are ignored, organization_id cannot change.
      properties:
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }

    Depot:
      type: object
      description: Physical warehouse. Documents, number series, statements and stock are per depot.
      required: [code, name]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string, examples: ['1'] }
        name: { type: string }
        vatRate: { $ref: '#/components/schemas/Percent' }
        allowNegativeStock: { type: boolean, default: false }
        version: { type: integer, readOnly: true }
    NumberSeries:
      type: object
      description: 'Rendered as prefix + year + depot code + zero-padded counter, e.g. TAH20261000042. Allocated with UPDATE … RETURNING on this row, never max()+1.'
      required: [id, kind, depotId, year, prefix, width, nextValue, version]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/NumberSeriesKind' }
        depotId: { type: integer }
        year: { type: integer }
        prefix: { type: string, examples: [DZ, TAH, TED, AC, AS, BC, BS] }
        width: { type: integer }
        nextValue: { type: integer, minimum: 1 }
        version: { type: integer }
    NumberSeriesKind:
      type: string
      enum: [DOCUMENT, COLLECTION_RECEIPT, PAYMENT_RECEIPT, RECEIVABLE_CHEQUE, RECEIVABLE_NOTE, PAYABLE_CHEQUE, PAYABLE_NOTE, STOCK_COUNT]

    AccountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
    Side: { type: string, enum: [DEBIT, CREDIT] }
    SourceType: { type: string, enum: [manual, document, receipt, instrument, opening, reversal, legacy_import] }
    Account:
      type: object
      required: [id, orgId, code, name, type, currency, normalSide, isActive, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        code: { type: string, examples: ['120.00042'] }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        normalSide: { $ref: '#/components/schemas/Side' }
        sicilId: { type: [integer, 'null'], description: 'Set for current (cari) accounts of customers, suppliers and banks' }
        currency: { $ref: '#/components/schemas/Currency' }
        isActive: { type: boolean }
        version: { type: integer }
    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, pattern: '^[0-9]{3}(\.[0-9A-Za-z-]+)*$' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        sicilId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
    AccountPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        nextCursor: { type: [string, 'null'] }
    BalanceRow:
      type: object
      required: [accountId, debitTotal, creditTotal, balance]
      properties:
        accountId: { type: integer }
        accountCode: { type: string }
        accountName: { type: string }
        sicilId: { type: [integer, 'null'] }
        depotId: { type: [integer, 'null'], description: Null when summed over depots }
        debitTotal: { $ref: '#/components/schemas/Money' }
        creditTotal: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money', description: 'debitTotal − creditTotal' }
    BalancesReport:
      type: object
      required: [asOf, rows, totalDebit, totalCredit]
      properties:
        asOf: { type: string, format: date, description: Inclusive }
        depotId: { type: [integer, 'null'] }
        rows: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
    OpeningBalance:
      type: object
      required: [accountId, depotId, year, debit, credit, journalEntryId]
      properties:
        accountId: { type: integer }
        depotId: { type: integer }
        year: { type: integer, description: Calendar year of the opening date (1 January) }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        journalEntryId: { type: integer }
        source: { type: string, enum: [CARRY_FORWARD, LEGACY_IMPORT] }
    PostingInput:
      type: object
      required: [accountId, side, amount]
      properties:
        accountId: { type: integer }
        side: { $ref: '#/components/schemas/Side' }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        memo: { type: string }
    Posting:
      allOf:
        - $ref: '#/components/schemas/PostingInput'
        - type: object
          required: [id, lineNo, currency]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            currency: { $ref: '#/components/schemas/Currency' }
    JournalEntryCreate:
      type: object
      required: [depotId, entryDate, description, lines]
      properties:
        depotId: { type: integer }
        entryDate: { type: string, format: date }
        description: { type: string }
        lines: { type: array, minItems: 2, items: { $ref: '#/components/schemas/PostingInput' } }
    JournalEntry:
      type: object
      required: [id, orgId, depotId, entryNo, entryDate, description, sourceType, postings, createdAt]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        depotId: { type: integer }
        entryNo: { type: string }
        entryDate: { type: string, format: date }
        description: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: [string, 'null'] }
        reversesEntryId: { type: [integer, 'null'] }
        reversedByEntryId: { type: [integer, 'null'] }
        postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
    JournalEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
        nextCursor: { type: [string, 'null'] }
    StatementLine:
      type: object
      required: [entryDate, description, debit, credit, runningBalance]
      properties:
        entryId: { type: [integer, 'null'], description: Null on the brought-forward row }
        entryDate: { type: string, format: date }
        depotId: { type: [integer, 'null'] }
        documentNo: { type: [string, 'null'] }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        dueDate: { type: [string, 'null'], format: date }
        description: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
    Statement:
      type: object
      required: [accountId, from, to, broughtForward, lines, depotTotals, closingBalance]
      properties:
        accountId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        broughtForward: { $ref: '#/components/schemas/StatementLine' }
        lines: { type: array, items: { $ref: '#/components/schemas/StatementLine' } }
        depotTotals:
          type: array
          items:
            type: object
            required: [depotId, debit, credit, balance]
            properties:
              depotId: { type: integer }
              debit: { $ref: '#/components/schemas/Money' }
              credit: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }

    DocumentType:
      type: string
      description: 'Waybills move stock only; price-difference invoices post to the ledger only.'
      enum:
        - SALES_INVOICE
        - SALES_INVOICE_WITH_WAYBILL
        - SALES_WAYBILL
        - PURCHASE_INVOICE
        - PURCHASE_INVOICE_WITH_WAYBILL
        - PURCHASE_WAYBILL
        - SALES_RETURN_INVOICE
        - SALES_RETURN_WAYBILL
        - PURCHASE_RETURN_INVOICE
        - PURCHASE_RETURN_WAYBILL
        - SALES_PRICE_DIFFERENCE
        - PURCHASE_PRICE_DIFFERENCE
    DocumentStatus: { type: string, enum: [DRAFT, POSTED, CANCELLED] }
    DocumentLineWrite:
      type: object
      required: [partId, qty, unitPrice]
      properties:
        partId: { type: integer }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitPrice: { $ref: '#/components/schemas/Money4' }
        discount1Pct: { $ref: '#/components/schemas/Percent' }
        discount2Pct: { $ref: '#/components/schemas/Percent' }
        vatPct: { $ref: '#/components/schemas/Percent' }
    DocumentLine:
      allOf:
        - $ref: '#/components/schemas/DocumentLineWrite'
        - type: object
          required: [id, lineNo, netAmount, vatAmount, lineTotal]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            netAmount: { $ref: '#/components/schemas/Money' }
            vatAmount: { $ref: '#/components/schemas/Money' }
            lineTotal: { $ref: '#/components/schemas/Money' }
    DocumentWrite:
      type: object
      required: [type, depotId, sicilId, documentDate, lines]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        depotId: { type: integer }
        sicilId: { type: integer }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        linkedDocumentId: { type: [integer, 'null'], description: 'Invoice for an earlier waybill, or the original of a return' }
        description: { type: string }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentLineWrite' } }
    Document:
      type: object
      required: [id, orgId, type, status, depotId, sicilId, documentDate, currency, subtotal, discountTotal, vatTotal, grandTotal, lines, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        documentNo: { type: [string, 'null'], description: Allocated on post }
        type: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        depotId: { type: integer }
        sicilId: { type: integer }
        documentDate: { type: string, format: date }
        dueDate: { type: [string, 'null'], format: date }
        linkedDocumentId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        vatTotal: { $ref: '#/components/schemas/Money' }
        grandTotal: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
        journalEntryId: { type: [integer, 'null'] }
        postedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        version: { type: integer }

    PaymentMethod: { type: string, enum: [CASH, BANK_TRANSFER, INSTRUMENT] }
    ReceiptCreate:
      type: object
      required: [kind, depotId, sicilId, date, method, amount]
      properties:
        kind: { type: string, enum: [COLLECTION, PAYMENT], description: 'tahsilat / tediye' }
        depotId: { type: integer }
        sicilId: { type: integer }
        date: { type: string, format: date }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        bankAccountId: { type: integer, description: Required for BANK_TRANSFER }
        description: { type: string }
    Receipt:
      allOf:
        - $ref: '#/components/schemas/ReceiptCreate'
        - type: object
          required: [id, orgId, receiptNo, journalEntryId, origin]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            receiptNo: { type: string, examples: [TAH20261000042] }
            origin: { type: string, enum: [MANUAL, INSTRUMENT], description: INSTRUMENT receipts are read-only; change them through the instrument }
            instrumentId: { type: [integer, 'null'] }
            journalEntryId: { type: integer }
            voidedByEntryId: { type: [integer, 'null'] }
    CashBookLine:
      type: object
      required: [date, description, income, expense, runningBalance]
      properties:
        date: { type: string, format: date }
        receiptId: { type: [integer, 'null'] }
        receiptNo: { type: [string, 'null'] }
        sicilId: { type: [integer, 'null'] }
        description: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
    CashBook:
      type: object
      required: [depotId, from, to, broughtForward, lines, closingBalance]
      properties:
        depotId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        broughtForward: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { $ref: '#/components/schemas/CashBookLine' } }
        closingBalance: { $ref: '#/components/schemas/Money' }

    InstrumentType:
      type: string
      enum: [RECEIVABLE_CHEQUE, RECEIVABLE_NOTE, PAYABLE_CHEQUE, PAYABLE_NOTE]
      description: 'alacak çeki, alacak senedi, borç çeki, borç senedi'
    InstrumentStatus:
      type: string
      enum: [PORTFOLIO, DEPOSITED, COLLECTED, ENDORSED, PROTESTED, RETURNED, ISSUED, PAID]
    InstrumentCreate:
      type: object
      required: [type, depotId, sicilId, serialNo, amount, issueDate, dueDate]
      properties:
        type: { $ref: '#/components/schemas/InstrumentType' }
        depotId: { type: integer }
        sicilId: { type: integer, description: 'Customer it was received from, or supplier it was issued to' }
        serialNo: { type: string, maxLength: 20 }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        drawerName: { type: string }
        drawerTaxNo: { type: string }
        bankName: { type: string }
        bankBranch: { type: string }
        bankCity: { type: string }
        accountNo: { type: string }
    Instrument:
      allOf:
        - $ref: '#/components/schemas/InstrumentCreate'
        - type: object
          required: [id, orgId, instrumentNo, status, receiptId, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            instrumentNo: { type: string, examples: [AC20261000007] }
            status: { $ref: '#/components/schemas/InstrumentStatus' }
            receiptId: { type: integer, description: Receipt issued at registration }
            version: { type: integer }
    InstrumentOperation:
      type: object
      required: [action, date]
      properties:
        action: { type: string, enum: [DEPOSIT_TO_BANK, COLLECT_AT_BANK, COLLECT_BY_HAND, ENDORSE, PROTEST, RETURN, PAY] }
        date: { type: string, format: date }
        endorseeSicilId: { type: integer, description: Required for ENDORSE }
        bankAccountId: { type: integer, description: Required for DEPOSIT_TO_BANK and COLLECT_AT_BANK }
        note: { type: string }
    InstrumentEvent:
      type: object
      required: [seq, action, toStatus, occurredAt]
      properties:
        seq: { type: integer }
        action: { type: string }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/InstrumentStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/InstrumentStatus' }
        occurredAt: { type: string, format: date-time }
        counterpartySicilId: { type: [integer, 'null'] }
        receiptId: { type: [integer, 'null'] }
        journalEntryId: { type: [integer, 'null'] }
        actorUserId: { type: integer }
        note: { type: [string, 'null'] }

    PartCode:
      type: object
      required: [kind, code]
      properties:
        kind: { type: string, enum: [MANUFACTURER, OEM, EQUIVALENT] }
        code: { type: string, maxLength: 40 }
        equivalentPartId: { type: [integer, 'null'], description: For EQUIVALENT codes (muadil) }
    PartWrite:
      type: object
      required: [catalogNo, stockNo, name]
      properties:
        catalogNo: { type: integer, description: Legacy KATNO }
        stockNo: { type: string, maxLength: 15, description: Legacy STNO }
        name: { type: string }
        type: { type: string }
        brand: { type: string }
        unit: { type: string, default: PCS }
        minQty: { $ref: '#/components/schemas/Quantity' }
        maxQty: { $ref: '#/components/schemas/Quantity' }
        packageQty: { type: integer, minimum: 1 }
        vatPct: { $ref: '#/components/schemas/Percent' }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' } }
    Part:
      allOf:
        - $ref: '#/components/schemas/PartWrite'
        - type: object
          required: [id, orgId, isActive, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            isActive: { type: boolean }
            listPrice: { $ref: '#/components/schemas/Money4', description: Current price in the default sales list }
            onHand: { $ref: '#/components/schemas/Quantity', description: Sum over depots }
            version: { type: integer }
    PriceList:
      type: object
      required: [code, name, kind]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [SALES, SUPPLIER] }
        supplierSicilId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        isDefault: { type: boolean }
    Price:
      type: object
      required: [priceListId, partId, price, validFrom]
      properties:
        priceListId: { type: integer }
        partId: { type: integer }
        price: { $ref: '#/components/schemas/Money4' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date, description: Derived from the next price }
        createdBy: { type: integer }
    StockLevel:
      type: object
      required: [partId, depotId, onHand]
      properties:
        partId: { type: integer }
        depotId: { type: integer }
        onHand: { $ref: '#/components/schemas/Quantity' }
        belowMin: { type: boolean }
    MovementKind: { type: string, enum: [IN, OUT, ADJUST_IN, ADJUST_OUT, TRANSFER_IN, TRANSFER_OUT] }
    StockMovement:
      type: object
      required: [id, partId, depotId, kind, qty, occurredAt, sourceType]
      properties:
        id: { type: integer }
        partId: { type: integer }
        depotId: { type: integer }
        kind: { $ref: '#/components/schemas/MovementKind' }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitCost: { $ref: '#/components/schemas/Money4' }
        sourceType: { type: string, enum: [document, stock_count, transfer, legacy_import] }
        sourceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    StockTransfer:
      type: object
      required: [partId, fromDepotId, toDepotId, qty]
      properties:
        partId: { type: integer }
        fromDepotId: { type: integer }
        toDepotId: { type: integer }
        qty: { $ref: '#/components/schemas/Quantity' }
        note: { type: string }
    StockCountOpen:
      type: object
      required: [depotId, year]
      properties:
        depotId: { type: integer }
        year: { type: integer }
        shelfFrom: { type: string }
        shelfTo: { type: string }
    StockCountLineWrite:
      type: object
      required: [partId, countedQty]
      properties:
        partId: { type: integer }
        shelf: { type: string }
        countedQty: { $ref: '#/components/schemas/Quantity' }
    StockCount:
      allOf:
        - $ref: '#/components/schemas/StockCountOpen'
        - type: object
          required: [id, countNo, status, version]
          properties:
            id: { type: integer }
            countNo: { type: string }
            status: { type: string, enum: [OPEN, FINALIZED, CANCELLED] }
            lines:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/StockCountLineWrite'
                  - type: object
                    properties:
                      systemQty: { $ref: '#/components/schemas/Quantity' }
                      difference: { type: string, pattern: '^-?\d{1,14}(\.\d{1,4})?$' }
            finalizedAt: { type: [string, 'null'], format: date-time }
            version: { type: integer }

    AuditEvent:
      type: object
      required: [id, orgId, occurredAt, action, entityType, entityId]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [integer, 'null'] }
        actorIp: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        action: { type: string, examples: [document.posted, sicil.updated] }
        entityType: { type: string }
        entityId: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
