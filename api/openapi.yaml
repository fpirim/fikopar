openapi: 3.1.0
info:
  title: fikopar API
  version: 0.1.0-draft
  summary: B2B trade, ledger and instrument management for a spare-parts distributor.
  description: |
    **DRAFT / provisional.** Revised against the live JHipster (v2) inventory; see `docs/domain-model.md`.
    `Identity`, `Users`, `Admin`, `Sicil`, `Uploads` and `Health` exist today. `Ledger`, `Documents`,
    `Receipts`, `Instruments`, `Catalog`, `Stock` and `Audit` are planned.

    Conventions
    - **Errors** are language-agnostic: `{"code": "ERR_…"}` plus optional `detail`, `field`, `traceId`.
      The frontend translates `code`. Success notifications use `{"code": "OK_…"}`.
    - **Security**: there is no self-registration; users are created by an admin. Every data endpoint
      requires a token and membership of the organization (company) in the path, otherwise
      `403 ERR_FORBIDDEN`; the `user` role never sees other companies' data.
    - **Tenancy**: new endpoints are scoped by path `/api/orgs/{orgId}/…`; most also carry a depot.
    - **Dates**: date ranges are inclusive on both ends; years are calendar years.
    - **Exports**: reports and printable documents honour `Accept: application/pdf` or the XLSX media type.
    - **Money** is a decimal string (`"1250.00"`), never a JSON number.
    - **Idempotency**: unsafe POSTs in new contexts require `Idempotency-Key`. A replay with the same key
      and body returns the original response with `Idempotent-Replayed: true`.
    - **Optimistic locking**: responses carry `ETag: "<version>"`; updates and state transitions
      require `If-Match` (`428` if missing, `412` if stale).
    - **Pagination**: grid endpoints use the AG-Grid server-side model (`startRow/endRow`), list
      endpoints use keyset `limit` + `cursor`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://fikopar.example.com
    description: Example deployment
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness, version and metrics
  - name: Identity
    description: Authentication
  - name: Users
    description: Current user profile
  - name: Uploads
    description: Public avatar and logo files
  - name: Sicil
    description: Account cards of trading partners (exists)
  - name: Admin
    description: User and organization administration (exists)
  - name: Ledger
    description: Double-entry ledger (accounts, journal entries, balances)
  - name: Catalog
    description: Parts, OEM/equivalent codes, price lists with history
  - name: Stock
    description: Depots, movements, transfers, counts, levels
  - name: Documents
    description: Invoices, waybills, returns, price-difference invoices; number series
  - name: Instruments
    description: Cheques and promissory notes (çek/senet)
  - name: Receipts
    description: Collection and payment receipts (makbuz) and the cash book
  - name: Audit
    description: Append-only audit trail

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and build version
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ['1.4.0'] }
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Prometheus metrics (restricted at the proxy in production)
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  /api/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: Exchange email + password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/uploads/avatars/{filename}:
    get:
      tags: [Uploads]
      operationId: getAvatar
      summary: Get avatar
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/uploads/logos/{filename}:
    get:
      tags: [Uploads]
      operationId: getLogo
      summary: Get logo
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get me
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Users]
      operationId: updateMe
      summary: Update me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, description: Omit to keep the current password }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/me/avatar:
    post:
      tags: [Users]
      operationId: uploadMyAvatar
      summary: Upload my avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      operationId: deleteMyAvatar
      summary: Delete my avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/sicil/grid:
    post:
      tags: [Sicil]
      operationId: gridSicil
      summary: Server-side grid of account cards for one organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  required: [organization_id]
                  properties:
                    organization_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Sicil' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/sicil:
    post:
      tags: [Sicil]
      operationId: createSicil
      summary: Create sicil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sicil/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sicil]
      operationId: getSicil
      summary: Get sicil
      responses:
        '200':
          description: Account card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sicil]
      operationId: updateSicil
      summary: Partial update (whitelisted fields); `telefonlar`, when present, replaces all phones
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilUpdate' }
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Sicil]
      operationId: deleteSicil
      summary: Delete sicil
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List users
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/grid:
    post:
      tags: [Admin]
      operationId: adminGridUsers
      summary: Grid users
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: Delete user
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/avatar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadUserAvatar
      summary: Upload user avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUserAvatar
      summary: Delete user avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations:
    get:
      tags: [Admin]
      operationId: adminListOrganizations
      summary: List organizations
      responses:
        '200':
          description: All organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateOrganization
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/organizations/grid:
    post:
      tags: [Admin]
      operationId: adminGridOrganizations
      summary: Grid organizations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateOrganization
      summary: Update organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganization
      summary: Delete organization
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations/{id}/logo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadOrganizationLogo
      summary: Upload organization logo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganizationLogo
      summary: Delete organization logo
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/depots:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listDepots
      summary: Depots (physical warehouses) of the company
      responses:
        '200':
          description: Depots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Depot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Stock]
      operationId: createDepot
      summary: Create a depot (admin)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Depot' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Depot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orgs/{orgId}/number-series:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Documents]
      operationId: listNumberSeries
      summary: Number series per document kind, depot and year
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Series with the next value
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NumberSeries' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/number-series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: seriesId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Documents]
      operationId: updateNumberSeries
      summary: Change prefix or width (admin); the counter only moves forward
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix: { type: string, pattern: '^[A-Z]{1,4}$' }
                width: { type: integer, minimum: 4, maximum: 10 }
                nextValue: { type: integer, description: May only increase }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/ledger/accounts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AccountType' } }
        - { name: sicilId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ledger]
      operationId: createAccount
      summary: Create account
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201': { $ref: '#/components/responses/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccount
      summary: Get account
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Ledger]
      operationId: updateAccount
      summary: Rename or deactivate an account (code, type and currency are immutable)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}/statement:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccountStatement
      summary: Statement (ekstre) with brought-forward row, running balance and per-depot totals
      description: '`from` and `to` are inclusive. Excel or PDF via the Accept header.'
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/balances:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: getBalances
      summary: Account balances as of a date (cari toplam), end date inclusive
      parameters:
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: sicilTipi, in: query, schema: { $ref: '#/components/schemas/SicilTipi' } }
        - { name: nonZeroOnly, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Balances; Excel or PDF via Accept
          content:
            application/json:
