  /api/orgs/{orgId}/instruments/{instrumentId}/operations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/InstrumentId'
    post:
      tags: [Instruments]
      operationId: operateInstrument
      summary: Deposit to bank, collect (fully or partly), bounce, endorse, protest, return, pay
      description: |
        Illegal transitions return 409 ERR_INVALID_STATE_TRANSITION. Money-moving operations issue a receipt and
        ledger entry. Collect actions take `amount` (default: remaining); less than remaining gives
        PARTIALLY_COLLECTED, more returns 422 ERR_AMOUNT_EXCEEDS_REMAINING.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentOperation' }
      responses:
        '200': { $ref: '#/components/responses/InstrumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/catalog/catalogs:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: listCatalogs
      summary: Catalogs (price lists), by code
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Catalogs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Catalog' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      operationId: createCatalog
      summary: Create catalog
      description: 409 ERR_CATALOG_CODE_EXISTS; 422 ERR_SICIL_NOT_FOUND (`supplierSicilId`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogWrite' }
      responses:
        '201': { $ref: '#/components/responses/CatalogResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/catalog/catalogs/{catalogId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CatalogId'
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get catalog
      responses:
        '200': { $ref: '#/components/responses/CatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: updateCatalog
      summary: Update name, supplier and active flag; `code` is fixed (422 ERR_CATALOG_CODE_IMMUTABLE)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogWrite' }
      responses:
        '200': { $ref: '#/components/responses/CatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/catalogs/{catalogId}/prices:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CatalogId'
    get:
      tags: [Catalog]
      operationId: listPrices
      summary: The catalog as a price list on a date (one row per active part, by stock no)
      parameters:
        - { name: validOn, in: query, schema: { type: string, format: date }, description: Defaults to today }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Prices; `price` null for a part without a price on that date
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Catalog]
      operationId: setPrices
      summary: New list prices for several parts of this catalog from one date; earlier prices stay in history
      description: |
        All or nothing. Same rules as `setPartPrice` per item. 422 ERR_PART_NOT_IN_CATALOG (`items[i].partId`),
        409 ERR_PRICE_EXISTS when a part already has a different price on `validFrom` (an equal price is a no-op).
        One `PriceChanged` per inserted price.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validFrom, items]
              properties:
                validFrom: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [partId, price]
                    properties:
                      partId: { type: integer }
                      price: { $ref: '#/components/schemas/Money4' }
      responses:
        '201':
          description: Inserted prices (no-ops left out)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Price' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/catalog/parts/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: gridParts
      summary: Parts & stock grid (floating filters, sort, infinite paging); XLSX via Accept, CSV in the client
      description: |
        Column ids and filter types: `PartColId`. `search` is OR over stockNo, name, brand and every code (normalized).
        The `codes` filter matches any code of the part, normalized. Stock columns (onHand, reserved, available)
        are for `depotId`, or summed over depots when it is null; minQty, maxQty and shelf need a `depotId` and are
        null without one. With `depotId` null each row also has `stockByDepot` (every depot of the company, depot code
        order, zeros included); it is omitted with a `depotId` and has no column ids (no filter or sort).
        `stock=IN_STOCK` = available > 0 in the scope. `unfilteredCount` = parts in the scope (`catalogId`,
        `includeInactive`) before column filters, `search` and `stock`. Default sort `stockNo` asc, then
        `catalogCode`. `totals` has onHand, reserved and available. XLSX carries every filtered row (at most 100 000)
        with the same columns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartGridRequest' }
      responses:
        '200':
          description: One page of parts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/PartRow' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/search:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: searchCatalog
      summary: Part picker (F2 on an invoice line, typing in a line)
      description: |
        The whole `q`, normalized (Turkish letters folded to ASCII, upper case, only 0-9 A-Z), is matched against stock no and every code
        (MANUFACTURER, OEM, ALT, EQUIVALENT): rank 1 exact, 2 prefix, 3 substring (normalized `q` of 3+ characters).
        Rank 4 (words): `q` is split on spaces and every word must occur in the name (case- and
        Turkish-letter-insensitive: ç ğ ı ö ş ü match c g i o s u) or, normalized, as a substring of the stock no or any code; `pump 37` finds a
        pump named "Hydraulic pump" with code `HP-3712`. A rank-4 hit has `matchKind` NAME and `matchedCode` the
        first code (stock no, then MANUFACTURER, OEM, ALT, EQUIVALENT) a word occurs in, or null. A word without
        letters or digits matches the name only; a `q` without any skips ranks 1–3. Order: rank, then stock no,
        then catalog code. Inactive parts are left out.
        Each hit has on hand and available for every depot of the company (zero rows included) and the list price of
        its catalog valid on `date`.

        Paging: `limit` + opaque `cursor` over the ranked list. `total` counts matches up to 1000 (`totalCapped`).
        Performance: p95 under 100 ms at 50 000 parts, 200 000 codes and 2 depots. Candidates come from the
        btree prefix indexes (`parts.stock_no_norm`, `part_codes.normalized_code`, `text_pattern_ops`) and the
        trigram indexes; price (`price_on`) and stock levels are joined for the page only.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
        - { name: catalogId, in: query, schema: { type: integer }, description: Only this catalog }
        - { name: date, in: query, schema: { type: string, format: date }, description: Price date; defaults to today }
        - { name: inStockDepotId, in: query, schema: { type: integer }, description: Only parts with available > 0 in this depot }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts/resolve:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: resolvePartCodes
      summary: Resolve many codes at once (invoice CSV import); unknown or ambiguous codes are reported per row
      description: Exact normalized match on stock no and codes only (rank 1 of `searchCatalog`); inactive parts are left out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                depotId: { type: integer, description: Adds on-hand for this depot }
      responses:
        '200':
          description: One result per input code, same order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code: { type: string }
                    status: { type: string, enum: [FOUND, NOT_FOUND, AMBIGUOUS] }
                    part: { $ref: '#/components/schemas/CatalogHit' }
                    candidates: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: createPart
      summary: Create part in a catalog, optionally with its first list price
      description: |
        409 ERR_PART_CODE_EXISTS when the stock no exists in the catalog; 422 ERR_CATALOG_NOT_FOUND (`catalogId`),
        ERR_PART_NOT_FOUND / ERR_DUPLICATE_LINE (`codes[i].equivalentPartId`, a second link to the same part),
        ERR_DUPLICATE_LINE (`codes[i].code`, a code of the same kind with the same normalized form). The same stock no
        may exist in another catalog.
        `initialPrice` is a MANUAL price row and emits `PriceChanged` like `setPartPrice`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartWrite' }
      responses:
        '201': { $ref: '#/components/responses/PartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/catalog/parts/lookup:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: lookupPartByCode
      summary: Resolve a manufacturer / OEM / ALT / equivalent code or stock no (normalized match)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Matching parts with their equivalents
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Part' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Catalog]
      operationId: getPart
      summary: Get part with codes, equivalents, current and next list price
      responses:
        '200': { $ref: '#/components/responses/PartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: updatePart
      summary: Update part; `codes` replaces the code list; deactivate with `isActive` false (parts are never deleted)
      description: |
        `catalogId` must stay the same (422 ERR_PART_CATALOG_IMMUTABLE); `initialPrice` is ignored, prices change
        through `setPartPrice`. 409 ERR_PART_CODE_EXISTS on a stock no taken in the catalog; 422 ERR_DUPLICATE_LINE
        (`codes[i].equivalentPartId`) on a second link to the same part, (`codes[i].code`) on a code of the same kind
        with the same normalized form.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartWrite' }
      responses:
        '200': { $ref: '#/components/responses/PartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/parts/{partId}/stock:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Stock]
      operationId: getPartStock
      summary: On hand, reserved, available, min, max and shelf for every depot, with a total row
      description: Every depot of the company has a row; a depot without movements or settings shows zeros, version 0.
      responses:
        '200':
          description: Stock per depot
          content:
            application/json:
              schema:
                type: object
                required: [partId, depots, total]
                properties:
                  partId: { type: integer }
                  depots: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  total: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/catalog/parts/{partId}/depots/{depotId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
      - { name: depotId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Stock]
      operationId: setPartDepotSettings
      summary: Min, max and shelf of a part in one depot (upsert)
      description: |
        `If-Match` is the `version` of that depot row in `getPartStock`; `"0"` creates it. 422 ERR_INVALID_REQUEST
        (`maxQty`) when max < min. PUT semantics: the body replaces all three fields, an omitted field is cleared
        (`minQty` 0, `maxQty` null, `shelf` empty).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartDepotSettings' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/parts/{partId}/prices:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Catalog]
      operationId: getPartPriceHistory
      summary: List price history of a part, newest `validFrom` first, future prices included
      responses:
        '200':
          description: Prices
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Price' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Catalog]
      operationId: setPartPrice
      summary: New list price from `validFrom` (past, today or future); history is append-only
      description: |
        Price on date D = the row with the latest `validFrom` ≤ D, so periods never overlap and a future price
        becomes current on its day without a job. A different price on an existing `validFrom` → 409 ERR_PRICE_EXISTS
        (a correction is a new row with a later `validFrom`); the same price → 200 with the existing row.
        Emits `PriceChanged`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceWrite' }
      responses:
        '200':
          description: Same price already on that date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '201':
          description: Price recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orgs/{orgId}/catalog/imports:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: listPriceImports
      summary: Price list import jobs, newest first
      parameters:
        - { name: catalogId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PriceImport' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      operationId: createPriceImport
      summary: Upload a price list (CSV, XLSX or legacy LISAKT text) into one catalog; starts parsing
      description: |
        Returns the job in PARSING, NEEDS_MAPPING, READY or FAILED; poll `getPriceImport` while PARSING.
        Limits: 10 MiB, 100 000 rows (FAILED `ERR_IMPORT_TOO_MANY_ROWS`). Without `mapping` the columns are matched
        by header name (`PriceImportTarget` names, Turkish aliases in `listPriceImportPresets`); if `code` or `price`
        stay unmapped the job is NEEDS_MAPPING with `headers` and `sample`, and `updatePriceImport` sends the mapping.
        A file whose SHA-256 was already applied to the catalog sets `duplicateOfImportId` (warning only).
        A file over 10 MiB answers 400 ERR_FILE_TOO_LARGE and creates no job. The idempotency request hash is the
        file SHA-256 plus the form fields, so a retry with a new multipart boundary replays.
        A NEW row without a description takes the stock no as the part name.
        400 ERR_NO_FILE_UPLOADED, ERR_FILE_TOO_LARGE; 422 ERR_CATALOG_NOT_FOUND.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, catalogId, validFrom]
              properties:
                file: { type: string, contentMediaType: application/octet-stream, description: '.csv, .xlsx or .txt (LISAKT)' }
                catalogId: { type: integer }
                validFrom: { type: string, format: date, description: For rows without their own valid_from }
                mapping: { $ref: '#/components/schemas/PriceImportMappingWrite' }
            encoding:
              mapping: { contentType: application/json }
      responses:
        '201': { $ref: '#/components/responses/PriceImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/catalog/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Catalog]
      operationId: getPriceImport
      summary: Job with status, counts per change kind and, once applied, the result
      responses:
        '200': { $ref: '#/components/responses/PriceImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      operationId: updatePriceImport
      summary: Change mapping or default `validFrom` and rebuild the preview; `{}` only rebuilds it
      description: |
        NEEDS_MAPPING or READY → PARSING → NEEDS_MAPPING | READY; version +1. Rebuilding against the current catalog is
        also how a stale preview (409 ERR_IMPORT_STALE on apply) is refreshed. 409 ERR_INVALID_STATE_TRANSITION
        in any other status.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping: { $ref: '#/components/schemas/PriceImportMappingWrite' }
                validFrom: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/PriceImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/imports/{importId}/rows/grid:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Catalog]
      operationId: gridPriceImportRows
      summary: Preview diff rows (file vs catalog); XLSX via Accept
      description: |
        `change` picks the tab; a row with PRICE and ATTRIBUTES shows under both. Column ids: rowNo, stockNo,
        description, brand, price, currentPrice, priceChangePct, validFrom, changes, errors. `description` and `brand`
        filter and sort the file value, else the current value (MISSING rows). Default sort rowNo, MISSING rows
        (rowNo null) last by stock no. `unfilteredCount` = rows of the selected tab before column filters.
        `totals` is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    change: { type: string, enum: [ALL, NEW, PRICE, ATTRIBUTES, UNCHANGED, MISSING, DELETE, ERROR, WARNING], default: ALL }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/PriceImportRow' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/catalog/imports/{importId}/apply:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Catalog]
      operationId: applyPriceImport
      summary: Apply the previewed diff once, in one transaction; READY → APPLYING → APPLIED
      description: |
        `If-Match` = job version (the preview the user saw). Checks: status READY (409 ERR_INVALID_STATE_TRANSITION),
        catalog unchanged since the preview (`catalogVersion`, 409 ERR_IMPORT_STALE), no ERROR rows unless
        `skipErrorRows` (422 ERR_IMPORT_HAS_ERRORS). Effects: NEW → part in the job's catalog with its price;
        PRICE → price row (`source` IMPORT, `importId`); ATTRIBUTES → part fields and codes (if `applyAttributes`);
        DELETE → deactivated; MISSING → deactivated only with `missing` DEACTIVATE. Parts are never deleted.
        200 with APPLIED, or 202 with APPLYING when it runs past the request (poll `getPriceImport`); on failure
        the transaction rolls back and the job returns to READY. Emits one `PriceListImported`, no `PriceChanged`.
        A replay with the same `Idempotency-Key` returns the first response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skipErrorRows: { type: boolean, default: false }
                applyAttributes: { type: boolean, default: true }
                missing: { type: string, enum: [KEEP, DEACTIVATE], default: KEEP }
      responses:
        '200': { $ref: '#/components/responses/PriceImportResponse' }
        '202': { $ref: '#/components/responses/PriceImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/imports/{importId}/discard:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Catalog]
      operationId: discardPriceImport
      summary: Drop a job that was not applied (→ DISCARDED); the file is deleted
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/PriceImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/import-presets:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: listPriceImportPresets
      summary: Mapping presets (LISAKT) and the header aliases used for automatic mapping
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [presets, aliases]
                properties:
                  presets: { type: array, items: { $ref: '#/components/schemas/PriceImportPreset' } }
                  aliases:
                    type: object
                    description: 'Target → accepted header names, e.g. `price: [price, fiyat, liste fiyatı]`'
                    additionalProperties: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orgs/{orgId}/stock/levels:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockLevels
      summary: On hand per part and depot (projection of movements); below-minimum and negative lists
      description: |
        `belowMin` = minQty > 0 and onHand < minQty; `negative` = onHand < 0. Order: onHand asc for NEGATIVE,
        otherwise onHand − minQty asc, then stock no. An unknown `depotId` returns an empty list.
      parameters:
        - { name: partId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: only, in: query, schema: { type: string, enum: [ALL, BELOW_MIN, NEGATIVE, BELOW_MIN_OR_NEGATIVE], default: ALL } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stock levels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/movements/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Stock]
      operationId: gridStockMovements
      summary: Movements ledger with document, account and running on-hand; XLSX via Accept
      description: |
        Ledger order is (date, id). `runningOnHand` is the on hand after the movement in that order, per depot
        (`depotId`) or over all depots (`depotId` null); it is set only when `partId` is given and the sort is `date`
        (asc or desc), otherwise null. It counts every movement of the part, so column filters hide rows without
        changing it. `openingOnHand` / `closingOnHand` bracket the `date` filter range (same scope); without a date
        filter opening is 0 and closing is the on hand through today. Both need `partId` and are null without it.
        Column ids: date, kind, label, sourceNo, sicilName, stockNo, name, depotId, qty, qtyIn, qtyOut, delta, unitCost;
        `qtyIn` / `qtyOut` are number columns (null on rows of the other direction, `blank` matches those). Default
        sort date desc, id desc. `totals`: qtyIn, qtyOut (Σ over filtered rows). A transfer is two rows
        (TRANSFER_OUT, TRANSFER_IN), each with `otherDepotId`. `label`: SALE (SF, SF with waybill, SIR), PURCHASE (AF,
        AF with waybill, AIR), SALES_RETURN (SI, SIRI), PURCHASE_RETURN (AI, AIRI), TRANSFER, COUNT, OPENING (legacy).
        Document movements (v1.4) carry `sourceNo` (document number), `documentId`, `documentType` and `sicilName`;
        the opposite movement of a cancelled document has the same label and `reversal` true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    partId: { type: integer }
                    depotId: { type: [integer, 'null'] }
      responses:
        '200':
          description: One page of movements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
                      openingOnHand: { oneOf: [{ $ref: '#/components/schemas/SignedQuantity' }, { type: 'null' }] }
                      closingOnHand: { oneOf: [{ $ref: '#/components/schemas/SignedQuantity' }, { type: 'null' }] }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/transfers:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Stock]
      operationId: transferStock
      summary: Move stock between two depots of the company in one transaction (TRF number of the source depot)
      description: |
        All lines or none: one TRF number, and per line a TRANSFER_OUT in the source and a TRANSFER_IN in the
        target, same date. Negative on hand is allowed and reported in `warnings`. 422 ERR_SAME_DEPOT,
        ERR_DEPOT_NOT_FOUND, ERR_PART_NOT_FOUND / ERR_PART_INACTIVE (`lines[i].partId`), ERR_DUPLICATE_LINE (a part
        twice); 409 ERR_YEAR_CLOSED. Emits `StockMoved` per movement.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransferCreate' }
      responses:
        '201':
          description: Transfer with its movements and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/stock/transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: transferId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Stock]
      operationId: getStockTransfer
      summary: Transfer with its movements (`warnings` empty)
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/stock/counts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockCounts
      summary: Stock counts (sayım), newest first
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, FINALIZED, CANCELLED] } }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Stock]
      operationId: openStockCount
      summary: Open a count session for one depot; freezes the system quantity of every line
      description: |
        One OPEN count per depot (409 ERR_STOCK_COUNT_OPEN_EXISTS). `startedAt` is the freeze instant: a line's
        `systemQty` is the on hand of the part in the depot from movements that occurred up to then, also for lines
        added later. Lines: active parts with on hand ≠ 0 in the depot or a non-empty shelf there; with a shelf range,
        parts whose shelf is in [shelfFrom, shelfTo] (shelfTo also matches as a prefix: `B` includes `B-04-2`).
        Number from the SAY series of the depot, year of `countDate`. 409 ERR_YEAR_CLOSED for a `countDate` in a
        closed year.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountOpen' }
      responses:
        '201': { $ref: '#/components/responses/StockCountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/stock/counts/{countId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    get:
      tags: [Stock]
      operationId: getStockCount
      summary: Count header with progress and totals; count sheet PDF via Accept
      description: |
        The PDF sheet lists lines by shelf, then stock no: shelf, stock no, name, brand, unit, an empty counted box,
        and the system quantity only with `sheet` WITH_SYSTEM. `only` NOT_COUNTED prints a recount sheet.
      parameters:
        - { name: sheet, in: query, schema: { type: string, enum: [BLIND, WITH_SYSTEM], default: BLIND }, description: PDF only }
        - { name: only, in: query, schema: { type: string, enum: [ALL, NOT_COUNTED], default: ALL }, description: PDF only }
        - { name: shelfFrom, in: query, schema: { type: string }, description: PDF only }
        - { name: shelfTo, in: query, schema: { type: string }, description: PDF only }
      responses:
        '200':
          description: Stock count
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines/grid:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: gridStockCountLines
      summary: Count lines; XLSX via Accept
      description: |
        `only`: DIFFERENCES = counted and ≠ system; NOT_COUNTED = countedQty null; COUNTED = not null. Shelf range as
        in `openStockCount`. Column ids: shelf, stockNo, name, brand, systemQty, countedQty, difference,
        movedSinceOpen, unitCost, costSource, value, countedBy, countedAt; default sort shelf, stockNo. While OPEN,
        unitCost / costSource are `last_purchase_cost(countDate)` read live; after finalize, the snapshot.
        `totals`: systemQty, countedQty, difference, value, valueIn, valueOut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    only: { type: string, enum: [ALL, DIFFERENCES, NOT_COUNTED, COUNTED], default: ALL }
                    shelfFrom: { type: string }
                    shelfTo: { type: string }
      responses:
        '200':
          description: One page of lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/StockCountLine' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: addStockCountLine
      summary: Add a part found on a shelf that is not on the sheet (`added` true, systemQty frozen at `startedAt`)
      description: |
        409 ERR_STOCK_COUNT_LINE_EXISTS when the part already has a line (one line per part; count it there),
        409 ERR_STOCK_COUNT_NOT_OPEN; 422 ERR_PART_NOT_FOUND / ERR_PART_INACTIVE.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partId]
              properties:
                partId: { type: integer }
                shelf: { type: string, maxLength: 20, description: Defaults to the part's shelf in the depot }
                countedQty: { $ref: '#/components/schemas/Quantity' }
      responses:
        '201':
          description: Line
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
      - { name: lineId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Stock]
      operationId: getStockCountLine
      summary: One count line with its ETag (re-read after a 412 on autosave)
      description: Any count status. 404 ERR_STOCK_COUNT_NOT_FOUND, ERR_STOCK_COUNT_LINE_NOT_FOUND (a line of another count too).
      responses:
        '200':
          description: Line
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Stock]
      operationId: setStockCountLine
      summary: Autosave one counted quantity (null clears it); sets countedBy and countedAt
      description: |
        Per-line optimistic lock: `If-Match` is the line `version` (ETag), every save moves it by one, so several
        people can count one sheet and a stale save gets 412 instead of overwriting. The count must be OPEN
        (409 ERR_STOCK_COUNT_NOT_OPEN). 404 ERR_STOCK_COUNT_LINE_NOT_FOUND. The count header version does not move.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedQty]
              properties:
                countedQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
                shelf: { type: string, maxLength: 20, description: Where it was found; the part's depot shelf is not changed }
      responses:
        '200':
          description: Saved line
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/stock/counts/{countId}/finalize:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: finalizeStockCount
      summary: Post differences; OPEN → FINALIZED, one ADJUST movement per line with a difference
      description: |
        `uncounted`: SKIP leaves lines without a count as they are; ZERO sets `countedQty` 0 on them (countedBy /
        countedAt = the finalizing user and time), so they show their difference afterwards.
        Difference = counted − systemQty (frozen); movements after `startedAt` stay on top, so on hand after =
        on hand now + difference. ADJUST_IN / ADJUST_OUT dated `countDate`, `unitCost` = snapshot of
        `last_purchase_cost(countDate)` with `costSource` (ADR-0008). One transaction; negative results are allowed
        and reported in `warnings`. 409 ERR_STOCK_COUNT_NOT_OPEN, ERR_YEAR_CLOSED. Emits `StockMoved` per movement.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uncounted]
              properties:
                uncounted: { type: string, enum: [SKIP, ZERO] }
      responses:
        '200':
          description: Finalized count, adjustments and warnings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountFinalized' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/stock/counts/{countId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: cancelStockCount
      summary: OPEN → CANCELLED without movements; the depot can open a new count
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/migration/runs:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Migration]
      operationId: listMigrationRuns
      summary: Import runs, newest first
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MigrationRun' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Migration]
      operationId: startMigrationRun
      summary: Start an import run (admin); the demo only allows dry runs on the bundled synthetic files
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryRun]
              properties:
                dryRun: { type: boolean }
      responses:
        '202':
          description: Started; poll the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/migration/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: runId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Migration]
      operationId: getMigrationRun
      summary: Reconciliation report; PDF or XLSX via Accept ("Download report")
      responses:
        '200':
          description: Run with per-file results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationRun' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/migration/runs/{runId}/quarantine:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: runId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Migration]
      operationId: listQuarantine
      summary: Rejected records with reason and decoded fields
      parameters:
        - { name: legacyFile, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Quarantined records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QuarantineRecord' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migration/layouts/{legacyFile}:
    parameters:
      - { name: legacyFile, in: path, required: true, schema: { type: string, examples: [SICIL] } }
    get:
      tags: [Migration]
      operationId: getCopybookLayout
      summary: Record layout parsed from the copybook, with target columns
      responses:
        '200':
          description: Layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopybookLayout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Read-only, append-only audit trail (admin)
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrgId:
      name: orgId
      in: path
      required: true
      description: Tenant. Caller must be a member (or admin).
      schema: { type: integer, minimum: 1 }
    SicilId:
      name: sicilId
      in: path
      required: true
      schema: { type: integer }
    Year:
      name: year
      in: path
      required: true
      description: Calendar year being opened
      schema: { type: integer, minimum: 2000, maximum: 2999 }
    DepotIdQuery:
      name: depotId
      in: query
      description: Restrict to one depot; omitted means all depots of the company.
      schema: { type: integer }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: integer }
    PartId:
      name: partId
      in: path
      required: true
      schema: { type: integer }
    CatalogId:
      name: catalogId
      in: path
      required: true
      schema: { type: integer }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: integer }
    CountId:
      name: countId
      in: path
      required: true
      schema: { type: integer }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: integer }
    Filename:
      name: filename
      in: path
      required: true
      schema: { type: string }
    PreviewDepotId:
      name: previewDepotId
      in: query
      description: Restrict the returned carry-forward preview to one depot; omitted means all depots.
      schema: { type: integer }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous `nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID. Unique per (org, key) for 24 h. Same key + same body replays the stored
        response; same key + different body → 422 ERR_IDEMPOTENCY_KEY_REUSED; in-flight → 409 ERR_IDEMPOTENCY_IN_PROGRESS.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (`"<version>"`) from the last read. Missing → 428, stale → 412.
      schema: { type: string, examples: ['"3"'] }

  headers:
    ETag:
      description: Current aggregate version, quoted.
      schema: { type: string }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3 }
    AvatarUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [avatar]
            properties:
              avatar: { type: string, contentMediaType: application/octet-stream }

  responses:
    BadRequest:
      description: Invalid input (ERR_INVALID_REQUEST, ERR_INVALID_ID, ERR_METHOD_NOT_AVAILABLE, field validation codes)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid token or credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not a member of the organization or missing role (ERR_FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (ERR_*_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Uniqueness or state conflict (ERR_*_EXISTS, ERR_INVALID_STATE_TRANSITION, ERR_IDEMPOTENCY_IN_PROGRESS, ERR_YEAR_CLOSED, ERR_IMPORT_STALE, ERR_ENTRY_OWNED_BY_SOURCE with `owner`, ERR_DOCUMENT_NOT_DRAFT, ERR_WAYBILL_BILLED, ERR_DOCUMENT_HAS_DEPENDENTS, ERR_CREDIT_LIMIT_EXCEEDED with `details`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match does not match current version (ERR_VERSION_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match header missing (ERR_PRECONDITION_REQUIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Business rule violated or unknown id in the body (ERR_ENTRY_UNBALANCED, ERR_IDEMPOTENCY_KEY_REUSED, ERR_IMPORT_HAS_ERRORS, ERR_*_NOT_FOUND, …)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit (ERR_RATE_LIMITED); see Retry-After
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkCode:
      description: Success notification code (OK_USER_DELETED, OK_ORG_DELETED, OK_SICIL_DELETED)
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, pattern: '^OK_[A-Z_]+$' }
    Image:
      description: Uploaded image file
      content:
        image/*:
          schema: { type: string, contentMediaType: application/octet-stream }
    UserResponse:
      description: User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    OrganizationResponse:
      description: Organization
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Organization' }
    AccountResponse:
      description: Ledger account
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }
    JournalEntryResponse:
      description: Journal entry with postings
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JournalEntry' }
    PartResponse:
      description: Part
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Part' }
    CatalogResponse:
      description: Catalog
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Catalog' }
    PriceImportResponse:
      description: Price list import job
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PriceImport' }
    DocumentResponse:
      description: Document
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Document' }
    ReceiptResponse:
      description: Receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    StockCountResponse:
      description: Stock count
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StockCount' }
    InstrumentResponse:
      description: Instrument
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Instrument' }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string, description: Developer-facing detail; never shown to end users }
        field: { type: string, description: Offending field for validation errors }
        traceId: { type: string, description: Request ID (X-Request-Id) }
        owner: { $ref: '#/components/schemas/EntryOwner' }
        details:
          description: '`CreditLimitExceeded` with ERR_CREDIT_LIMIT_EXCEEDED, `DocumentDependents` with ERR_DOCUMENT_HAS_DEPENDENTS'
          oneOf:
            - $ref: '#/components/schemas/CreditLimitExceeded'
            - $ref: '#/components/schemas/DocumentDependents'
    CreditLimitExceeded:
      type: object
      description: 'excess = balance + documentTotal − limit (> 0). balance = the current account over all depots and dates (ADR-0014).'
      required: [limit, balance, documentTotal, excess]
      properties:
        limit: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        documentTotal: { $ref: '#/components/schemas/Money' }
        excess: { $ref: '#/components/schemas/Money' }
    DocumentDependents:
      type: object
      description: |
        ERR_DOCUMENT_HAS_DEPENDENTS. Cancel: the posted returns and price differences that link the document. Draft
        update or delete: the drafts that bill or link its lines (documentNo null).
      required: [dependents]
      properties:
        dependents:
          type: array
          items:
            type: object
            required: [id, documentNo, type]
            properties:
              id: { type: integer }
              documentNo: { type: [string, 'null'] }
              type: { $ref: '#/components/schemas/DocumentType' }
    EntryOwner:
      type: object
      description: Set only with ERR_ENTRY_OWNED_BY_SOURCE; the document, receipt, instrument or voucher that owns the entry.
      required: [sourceType, sourceId]
      properties:
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: string }
        sourceNo: { type: [string, 'null'], examples: [SF-2026-1-000418] }
    ErrorCode:
      type: string
      description: Language-agnostic code; translated by the client. The first group exists today.
      enum:
        - ERR_INVALID_REQUEST
        - ERR_INVALID_ID
        - ERR_USER_NOT_FOUND
        - ERR_ORG_NOT_FOUND
        - ERR_INVALID_CREDENTIALS
        - ERR_TOKEN_GENERATION
        - ERR_NO_FILE_UPLOADED
        - ERR_FILE_TOO_LARGE
        - ERR_FILE_OPEN
        - ERR_MISSING_TOKEN
        - ERR_INVALID_TOKEN_FORMAT
        - ERR_INVALID_TOKEN
        - ERR_UNAUTHORIZED
        - ERR_FORBIDDEN
        - ERR_SLUG_INVALID
        - ERR_SLUG_EXISTS
        - ERR_EMAIL_EXISTS
        - ERR_CANNOT_DELETE_SELF
        - ERR_CANNOT_DELETE_LAST_ADMIN
        - ERR_HESAP_NO_REQUIRED
        - ERR_HESAP_ADI_REQUIRED
        - ERR_HESAP_NO_EXISTS
        - ERR_SICIL_NOT_FOUND
        - ERR_INVALID_SICIL_TIPI
        - ERR_INVALID_TELEFON_TIPI
        - ERR_TELEFON_NUMARA_REQUIRED
        - ERR_INVALID_ISKONTO
        - ERR_INTERNAL
        - ERR_PRECONDITION_REQUIRED
        - ERR_VERSION_CONFLICT
        - ERR_IDEMPOTENCY_KEY_REQUIRED
        - ERR_IDEMPOTENCY_KEY_REUSED
        - ERR_IDEMPOTENCY_IN_PROGRESS
        - ERR_INVALID_STATE_TRANSITION
        - ERR_DEPOT_NOT_FOUND
        - ERR_DEPOT_REQUIRED
        - ERR_DEPOT_CODE_EXISTS
        - ERR_NUMBER_SERIES_NOT_FOUND
        - ERR_NUMBER_SERIES_BACKWARDS
        - ERR_ACCOUNT_NOT_FOUND
        - ERR_ACCOUNT_CODE_EXISTS
        - ERR_ACCOUNT_INACTIVE
        - ERR_CURRENCY_MISMATCH
        - ERR_ENTRY_NOT_FOUND
        - ERR_ENTRY_UNBALANCED
        - ERR_ENTRY_TOO_FEW_LINES
        - ERR_ENTRY_ALREADY_REVERSED
        - ERR_ENTRY_OWNED_BY_SOURCE
        - ERR_ALREADY_CARRIED_FORWARD
        - ERR_NOT_CARRIED_FORWARD
        - ERR_YEAR_CLOSED
        - ERR_INVALID_AMOUNT
        - ERR_PART_NOT_FOUND
        - ERR_PART_CODE_EXISTS
        - ERR_PART_INACTIVE
        - ERR_PART_NOT_IN_CATALOG
        - ERR_PART_CATALOG_IMMUTABLE
        - ERR_CATALOG_NOT_FOUND
        - ERR_CATALOG_CODE_EXISTS
        - ERR_CATALOG_CODE_IMMUTABLE
        - ERR_PRICE_EXISTS
        - ERR_IMPORT_NOT_FOUND
        - ERR_IMPORT_FORMAT
        - ERR_IMPORT_TOO_MANY_ROWS
        - ERR_IMPORT_STALE
        - ERR_IMPORT_HAS_ERRORS
        - ERR_STOCK_COUNT_NOT_OPEN
        - ERR_DOCUMENT_NOT_FOUND
        - ERR_DOCUMENT_EMPTY
        - ERR_DOCUMENT_NOT_DRAFT
        - ERR_LINKED_DOCUMENT_INVALID
