openapi: 3.1.0
info:
  title: fikopar API
  version: 0.1.0-draft
  summary: B2B trade, ledger and instrument management for a spare-parts distributor.
  description: |
    **DRAFT / provisional.** Revised against the live JHipster (v2) inventory; see `docs/domain-model.md`.
    `Identity`, `Users`, `Admin`, `Uploads` and `Health` exist today. `Sicil` exists under `/api/sicil`
    and moves under `/api/orgs/{orgId}` in F1. Everything else is planned. Screen coverage: `docs/screens.md`.

    Conventions
    - **Errors** are language-agnostic: `{"code": "ERR_…"}` plus optional `detail`, `field`, `traceId`.
      The frontend translates `code`. Success notifications use `{"code": "OK_…"}`.
    - **Security**: there is no self-registration; users are created by an admin. Every data endpoint
      requires a token and membership of the organization (company) in the path, otherwise
      `403 ERR_FORBIDDEN`; the `user` role never sees other companies' data.
    - **Tenancy**: new endpoints are scoped by path `/api/orgs/{orgId}/…`; most also carry a depot.
    - **Dates**: date ranges are inclusive on both ends; years are calendar years.
    - **Exports**: reports and printable documents honour `Accept: application/pdf`. Grid endpoints return
      every filtered row as XLSX when `Accept` is the XLSX media type (server-side Excel). CSV is built in the client.
    - **Numbers**: `PREFIX-YEAR-DEPOT-COUNTER`, e.g. `SF-2026-1-000418`; one counter per company, depot, prefix and year.
    - **Money** is a decimal string (`"1250.00"`), never a JSON number.
    - **Idempotency**: unsafe POSTs in new contexts require `Idempotency-Key`. A replay with the same key
      and body returns the original response with `Idempotent-Replayed: true`.
    - **Optimistic locking**: responses carry `ETag: "<version>"`; updates and state transitions
      require `If-Match` (`428` if missing, `412` if stale).
    - **Pagination**: grid endpoints take AG Grid Community infinite-model blocks (`startRow/endRow`),
      list endpoints use keyset `limit` + `cursor`. Column filters are AND-combined; `search` is OR across columns.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://fikopar.fpirim.me
    description: Demo, synthetic data
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness, version and metrics
  - name: Identity
    description: Authentication
  - name: Users
    description: Current user profile
  - name: Uploads
    description: Public avatar and logo files
  - name: Sicil
    description: Account cards of trading partners (exists)
  - name: Admin
    description: User and organization administration (exists)
  - name: Ledger
    description: Double-entry ledger (accounts, journal entries, balances)
  - name: Catalog
    description: Parts, OEM/equivalent codes, price lists with history
  - name: Stock
    description: Depots, movements, transfers, counts, levels
  - name: Documents
    description: Invoices, waybills, returns, price-difference invoices; number series
  - name: Instruments
    description: Cheques and promissory notes (çek/senet)
  - name: Receipts
    description: Collection and payment receipts (makbuz) and the cash book
  - name: Cash
    description: Cash book, expenses, bank deposits, till counts
  - name: Dashboard
    description: Aggregates for the start page and global search
  - name: Migration
    description: COBOL import runs and reconciliation
  - name: Audit
    description: Append-only audit trail

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and build version
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ['1.4.0'] }
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Prometheus metrics (restricted at the proxy in production)
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  /api/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: Exchange email + password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/demo:
    post:
      tags: [Identity]
      operationId: loginDemo
      summary: Sign in as the demo user (demo deployments only, rate limited)
      security: []
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  resetAt: { type: string, format: date-time, description: Next nightly reset }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/uploads/avatars/{filename}:
    get:
      tags: [Uploads]
      operationId: getAvatar
      summary: Get avatar
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/uploads/logos/{filename}:
    get:
      tags: [Uploads]
      operationId: getLogo
      summary: Get logo
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get me
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Users]
      operationId: updateMe
      summary: Update me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, description: Omit to keep the current password }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/me/avatar:
    post:
      tags: [Users]
      operationId: uploadMyAvatar
      summary: Upload my avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      operationId: deleteMyAvatar
      summary: Delete my avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orgs/{orgId}/sicils/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Sicil]
      operationId: gridSicil
      summary: Grid of account cards; XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Sicil' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/sicils:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Sicil]
      operationId: createSicil
      summary: Create sicil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/sicils/{sicilId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SicilId'
    get:
      tags: [Sicil]
      operationId: getSicil
      summary: Get sicil
      responses:
        '200':
          description: Account card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sicil]
      operationId: updateSicil
      summary: Partial update (whitelisted fields); `telefonlar`, when present, replaces all phones
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilUpdate' }
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Sicil]
      operationId: deleteSicil
      summary: Delete sicil
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/sicils/{sicilId}/summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SicilId'
    get:
      tags: [Sicil]
      operationId: getSicilSummary
      summary: Balance, overdue, credit use and open instruments of one account card
      description: Side panel on statement, receipt and invoice screens.
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: asOf, in: query, schema: { type: string, format: date }, description: Defaults to today }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SicilSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Start page aggregates
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today }
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/search:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Dashboard]
      operationId: globalSearch
      summary: Top-bar search over account cards, parts and document numbers
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 }, description: Per group }
      responses:
        '200':
          description: Hits grouped by kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List users
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/grid:
    post:
      tags: [Admin]
      operationId: adminGridUsers
      summary: Grid users
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: Delete user
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/avatar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadUserAvatar
      summary: Upload user avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUserAvatar
      summary: Delete user avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations:
    get:
      tags: [Admin]
      operationId: adminListOrganizations
      summary: List organizations
      responses:
        '200':
          description: All organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateOrganization
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/organizations/grid:
    post:
      tags: [Admin]
      operationId: adminGridOrganizations
      summary: Grid organizations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateOrganization
      summary: Update organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganization
      summary: Delete organization
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations/{id}/logo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadOrganizationLogo
      summary: Upload organization logo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganizationLogo
      summary: Delete organization logo
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/depots:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listDepots
      summary: Depots (physical warehouses) of the company
      responses:
        '200':
          description: Depots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Depot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Stock]
      operationId: createDepot
      summary: Create a depot (admin)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Depot' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Depot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orgs/{orgId}/number-series:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Documents]
      operationId: listNumberSeries
      summary: Number series per prefix, depot and year; `nextValue` previews the next number
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: prefix, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Series with the next value
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NumberSeries' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/number-series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: seriesId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Documents]
      operationId: updateNumberSeries
      summary: Change width or move the counter forward (admin)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                width: { type: integer, minimum: 4, maximum: 10 }
                nextValue: { type: integer, description: May only increase }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/ledger/accounts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AccountType' } }
        - { name: sicilId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ledger]
      operationId: createAccount
      summary: Create account
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201': { $ref: '#/components/responses/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccount
      summary: Get account
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Ledger]
      operationId: updateAccount
      summary: Rename or deactivate an account (code, type and currency are immutable)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}/statement:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccountStatement
      summary: Statement (ekstre) with brought-forward row, running balance and per-depot totals
      description: '`from` and `to` are inclusive. Excel or PDF via the Accept header.'
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/balances/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: gridBalances
      summary: Current-account balances as of a date (cari toplam); end date inclusive
      description: |
        Columns: accountCode, name, city, sicilTipi, debit, credit, balance, overdue, lastMoveDate; all filterable.
        `totals` sums the filtered rows (pinned row). XLSX via Accept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  required: [asOf]
                  properties:
                    asOf: { type: string, format: date }
                    depotId: { type: [integer, 'null'] }
                    sicilTipi: { oneOf: [{ $ref: '#/components/schemas/SicilTipi' }, { type: 'null' }] }
      responses:
        '200':
          description: One page of balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/ledger/statements/print:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: printStatements
      summary: One PDF with the statements of the selected accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSelection' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/reminder-letters:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: printReminderLetters
      summary: Payment reminder letters for the selected accounts (overdue items as of `to`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSelection' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/trial-balance:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: getTrialBalance
      summary: Trial balance (mizan); Σ debit = Σ credit by construction
      parameters:
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalancesReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/ledger/opening-balances:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listOpeningBalances
      summary: Opening balances (cari devir) per account, depot and calendar year
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000 } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Opening balances
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OpeningBalance' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    get:
      tags: [Ledger]
      operationId: getCarryForward
      summary: Preview opening entries for `year` from closing balances of `year - 1`; PDF via Accept
      description: One row per (account, depot) with a non-zero closing balance or an override.
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Preview, or the posted result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}/overrides:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    put:
      tags: [Ledger]
      operationId: setCarryForwardOverride
      summary: Edit one opening amount before posting (admin); the row shows EDITED
      description: '`debit` and `credit` both "0.00" skips the row. Removing an override restores the computed amount.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarryForwardOverride' }
      responses:
        '200':
          description: Updated preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Ledger]
      operationId: deleteCarryForwardOverride
      summary: Remove an override
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: integer } }
        - { name: depotId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}/post:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    post:
      tags: [Ledger]
      operationId: postCarryForward
      summary: Post all opening entries of `year` in one transaction (admin)
      description: |
        Blocking checks must pass (422 ERR_CARRY_FORWARD_BLOCKED). One entry per (account, depot) dated 1 January,
        counter-account OPENING. A repeat returns 409 ERR_ALREADY_CARRIED_FORWARD.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/account-roles:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listAccountRoles
      summary: Accounts used by posting rules (cash, sales, VAT, cheques, opening …)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Ledger]
      operationId: setAccountRoles
      summary: Replace the role map (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/entries:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listJournalEntries
      summary: List journal entries
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: accountId, in: query, schema: { type: integer } }
        - { name: sourceType, in: query, schema: { $ref: '#/components/schemas/SourceType' } }
        - { name: q, in: query, schema: { type: string }, description: Entry number or source document number }
      responses:
        '200':
          description: Journal entries, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ledger]
      operationId: postJournalEntry
      summary: Post a balanced manual journal entry
      description: '`422 ERR_ENTRY_UNBALANCED` unless Σ debit = Σ credit with at least two lines.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
      responses:
        '201': { $ref: '#/components/responses/JournalEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Ledger]
      operationId: getJournalEntry
      summary: Get journal entry
      responses:
        '200': { $ref: '#/components/responses/JournalEntryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/entries/{entryId}/trail:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Ledger]
      operationId: getJournalEntryTrail
      summary: How the entry came to be (audit events, outbox event, deliveries), oldest first
      responses:
        '200':
          description: Trail
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TrailItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/entries/{entryId}/reversal:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Ledger]
      operationId: reverseJournalEntry
      summary: Reverse a manual entry
      description: Entries owned by a document, receipt, instrument or cash voucher return 409 ERR_ENTRY_OWNED_BY_SOURCE; reverse them through the owner.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '201': { $ref: '#/components/responses/JournalEntryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orgs/{orgId}/documents/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Documents]
      operationId: gridDocuments
      summary: Grid of trade documents (filters type, status, depot, account, date, amount); XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/documents:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Documents]
      operationId: createDocument
      summary: Create a DRAFT invoice, waybill, return or price-difference document
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentWrite' }
      responses:
        '201': { $ref: '#/components/responses/DocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get document with line stock, totals and, for a DRAFT, the effects of posting; PDF via Accept
      responses:
        '200':
          description: Document
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      operationId: updateDocument
      summary: Replace header and lines of a DRAFT document
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentWrite' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/documents/{documentId}/post:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      operationId: postDocument
      summary: DRAFT → POSTED; allocates the number, emits DocumentPosted (ledger entry and stock movements follow)
      description: |
        422 ERR_INSUFFICIENT_STOCK unless the depot allows negative stock; 422 ERR_CREDIT_LIMIT_EXCEEDED over the card's limit;
        422 ERR_WAYBILL_INVALID when `waybillDocumentId` is not a POSTED, unbilled waybill of the matching type, sicil and depot.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/documents/{documentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      operationId: cancelDocument
      summary: Cancel; a POSTED document is cancelled by reversal entries and opposite stock movements
      description: 409 ERR_WAYBILL_BILLED for a waybill billed by a document that is not cancelled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/receipts/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Receipts]
      operationId: gridReceipts
      summary: Grid of receipts (no, date, kind, method, account, source, amount); XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of receipts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/receipts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Receipts]
      operationId: createReceipt
      summary: Issue a collection (tahsilat) or payment (tediye) receipt
      description: |
        CASH posts to the depot's cash book, BANK_TRANSFER to `bankAccountId`. CHEQUE and NOTE register the
        instrument in `instrument` in the same transaction (the receipt then belongs to it).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptCreate' }
      responses:
        '201': { $ref: '#/components/responses/ReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Get receipt; PDF via Accept
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/receipts/{receiptId}/void:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ReceiptId'
    post:
      tags: [Receipts]
      operationId: voidReceipt
      summary: Void by reversal; receipts owned by an instrument operation return 409 ERR_RECEIPT_OWNED_BY_INSTRUMENT
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/cash-book:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Cash]
      operationId: getCashBook
      summary: Cash book (kasa defteri) of one depot with opening row, in/out totals and running balance
      parameters:
        - { name: depotId, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Cash book; XLSX or PDF via Accept
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashBook' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/cash-vouchers:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Cash]
      operationId: createCashVoucher
      summary: Expense paid from the till (GDR) or cash moved to / from a bank (VRM)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashVoucherCreate' }
      responses:
        '201':
          description: Posted voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/cash-vouchers/{voucherId}/void:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: voucherId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Cash]
      operationId: voidCashVoucher
      summary: Void by reversal
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: Voided voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/cash-counts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Cash]
      operationId: listCashCounts
      summary: Till counts of a depot, newest first
      parameters:
        - { name: depotId, in: query, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CashCount' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Cash]
      operationId: createCashCount
      summary: Record a till count against the book balance; optionally post the difference to CASH_OVER_SHORT
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashCountCreate' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/instruments/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Instruments]
      operationId: gridInstruments
      summary: Cheques and notes; filter by type, status, drawer, due range, amount; XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of instruments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/instruments/summary:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Instruments]
      operationId: getInstrumentSummary
      summary: Counts and totals per tab (receivable, payable, portfolio, at bank, endorsed, protested, closed) and due buckets
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/instruments:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Instruments]
      operationId: createInstrument
      summary: Register a cheque/note; issues its receipt and ledger entry in the same transaction
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '201': { $ref: '#/components/responses/InstrumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/instruments/{instrumentId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/InstrumentId'
    get:
      tags: [Instruments]
      operationId: getInstrument
      summary: Get instrument
      responses:
        '200': { $ref: '#/components/responses/InstrumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/instruments/{instrumentId}/events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/InstrumentId'
    get:
      tags: [Instruments]
      operationId: listInstrumentEvents
      summary: Status history including the endorsement chain
      responses:
        '200':
          description: Events in sequence order
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstrumentEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/instruments/{instrumentId}/operations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/InstrumentId'
    post:
      tags: [Instruments]
      operationId: operateInstrument
      summary: Deposit to bank, collect (fully or partly), bounce, endorse, protest, return, pay
      description: |
        Illegal transitions return 409 ERR_INVALID_STATE_TRANSITION. Money-moving operations issue a receipt and
        ledger entry. Collect actions take `amount` (default: remaining); less than remaining gives
        PARTIALLY_COLLECTED, more returns 422 ERR_AMOUNT_EXCEEDS_REMAINING.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentOperation' }
      responses:
        '200': { $ref: '#/components/responses/InstrumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/catalog/parts/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: gridParts
      summary: Grid search; `search` matches stock no, name and any OEM/equivalent code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of parts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Part' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/search:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: searchCatalog
      summary: Part picker (F2 on an invoice line)
      description: |
        Matches stock no and codes by normalized prefix/substring, name by words; exact code matches first.
        Returns stock per depot and the price valid on `date`. Budget: p95 under 100 ms at 50k parts
        (trigram indexes on parts and part_codes).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: priceListId, in: query, schema: { type: integer }, description: Defaults to the default sales list }
        - { name: date, in: query, schema: { type: string, format: date }, description: Price date; defaults to today }
        - { name: inStockDepotId, in: query, schema: { type: integer }, description: Only parts available in this depot }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts/resolve:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: resolvePartCodes
      summary: Resolve many codes at once (invoice CSV import); unknown or ambiguous codes are reported per row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                depotId: { type: integer, description: Adds on-hand for this depot }
      responses:
        '200':
          description: One result per input code, same order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code: { type: string }
                    status: { type: string, enum: [FOUND, NOT_FOUND, AMBIGUOUS] }
                    part: { $ref: '#/components/schemas/CatalogHit' }
                    candidates: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Catalog]
      operationId: createPart
      summary: Create part
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartWrite' }
      responses:
        '201': { $ref: '#/components/responses/PartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/catalog/parts/lookup:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: lookupPartByCode
      summary: Resolve a manufacturer / OEM / equivalent code (normalized match)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Matching parts with their equivalents
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Part' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Catalog]
      operationId: getPart
      summary: Get part
      responses:
        '200': { $ref: '#/components/responses/PartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: updatePart
      summary: Update part
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartWrite' }
      responses:
        '200': { $ref: '#/components/responses/PartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/catalog/parts/{partId}/stock:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Stock]
      operationId: getPartStock
      summary: On hand, reserved, available, min, max and shelf per depot, with a total row
      responses:
        '200':
          description: Stock per depot
          content:
            application/json:
              schema:
                type: object
                required: [partId, depots, total]
                properties:
                  partId: { type: integer }
                  depots: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  total: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/catalog/parts/{partId}/depots/{depotId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
      - { name: depotId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Stock]
      operationId: setPartDepotSettings
      summary: Min, max and shelf of a part in one depot
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartDepotSettings' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/catalog/parts/{partId}/prices:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [Catalog]
      operationId: getPartPriceHistory
      summary: Price history of a part, newest first, with change against the previous price
      parameters:
        - { name: priceListId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Prices, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Price' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/catalog/price-lists:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Catalog]
      operationId: listPriceLists
      summary: Price lists (supplier catalogues and sales lists)
      responses:
        '200':
          description: Price lists
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PriceList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      operationId: createPriceList
      summary: Create price list
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceList' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/catalog/price-lists/{priceListId}/prices:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: priceListId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Catalog]
      operationId: listPrices
      summary: Prices valid on a date
      parameters:
        - { name: validOn, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Prices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      operationId: setPrices
      summary: Set new prices from a date; earlier prices stay in history
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validFrom, items]
              properties:
                validFrom: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [partId, price]
                    properties:
                      partId: { type: integer }
                      price: { $ref: '#/components/schemas/Money4' }
      responses:
        '201':
          description: Prices recorded
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Price' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/stock/levels:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockLevels
      summary: Quantity on hand per part and depot, derived from movements
      parameters:
        - { name: partId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: belowMin, in: query, schema: { type: boolean }, description: Dashboard "below minimum" list }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stock levels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/movements/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Stock]
      operationId: gridStockMovements
      summary: Movements with document, account and running on-hand; XLSX via Accept
      description: '`runningOnHand` is set when `partId` is given (per depot, or over all depots when `depotId` is null).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    partId: { type: integer }
                    depotId: { type: [integer, 'null'] }
      responses:
        '200':
          description: One page of movements, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/transfers:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Stock]
      operationId: transferStock
      summary: Move stock between the company's depots (TRF number of the source depot, paired OUT/IN movements)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransferCreate' }
      responses:
        '201':
          description: Transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/stock/counts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listStockCounts
      summary: Stock counts (sayım)
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Stock]
      operationId: openStockCount
      summary: Open a count for a depot, year and optional shelf range; creates one line per part in range
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountOpen' }
      responses:
        '201': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/stock/counts/{countId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    get:
      tags: [Stock]
      operationId: getStockCount
      summary: Count header with progress and totals; count sheet PDF via Accept
      responses:
        '200':
          description: Stock count
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines/grid:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: gridStockCountLines
      summary: Count lines (shelf, part, system, counted, difference, value, counted by)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    only: { type: string, enum: [ALL, DIFFERENCES, NOT_COUNTED], default: ALL }
      responses:
        '200':
          description: One page of lines; `totals` has system, counted, difference and value
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/StockCountLine' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: addStockCountLine
      summary: Add a part found on a shelf that is not on the sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partId, shelf]
              properties:
                partId: { type: integer }
                shelf: { type: string }
                countedQty: { $ref: '#/components/schemas/Quantity' }
      responses:
        '201':
          description: Line
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/stock/counts/{countId}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
      - { name: lineId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Stock]
      operationId: setStockCountLine
      summary: Autosave one counted quantity (null clears it); sets countedBy and countedAt
      description: |
        Per-line optimistic lock, so several people can count one sheet. The count must be OPEN
        (409 ERR_STOCK_COUNT_NOT_OPEN).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedQty]
              properties:
                countedQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
      responses:
        '200':
          description: Saved line
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/stock/counts/{countId}/finalize:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CountId'
    post:
      tags: [Stock]
      operationId: finalizeStockCount
      summary: Post differences; OPEN → FINALIZED, differences become ADJUST movements
      description: '`uncounted` decides lines without a counted quantity: SKIP leaves stock as is, ZERO counts them as 0.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uncounted]
              properties:
                uncounted: { type: string, enum: [SKIP, ZERO] }
      responses:
        '200': { $ref: '#/components/responses/StockCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/orgs/{orgId}/migration/runs:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Migration]
      operationId: listMigrationRuns
      summary: Import runs, newest first
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MigrationRun' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Migration]
      operationId: startMigrationRun
      summary: Start an import run (admin); the demo only allows dry runs on the bundled synthetic files
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryRun]
              properties:
                dryRun: { type: boolean }
      responses:
        '202':
          description: Started; poll the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/migration/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: runId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Migration]
      operationId: getMigrationRun
      summary: Reconciliation report; PDF or XLSX via Accept ("Download report")
      responses:
        '200':
          description: Run with per-file results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationRun' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/migration/runs/{runId}/quarantine:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: runId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Migration]
      operationId: listQuarantine
      summary: Rejected records with reason and decoded fields
      parameters:
        - { name: legacyFile, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Quarantined records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QuarantineRecord' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migration/layouts/{legacyFile}:
    parameters:
      - { name: legacyFile, in: path, required: true, schema: { type: string, examples: [SICIL] } }
    get:
      tags: [Migration]
      operationId: getCopybookLayout
      summary: Record layout parsed from the copybook, with target columns
      responses:
        '200':
          description: Layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopybookLayout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Read-only, append-only audit trail (admin)
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrgId:
      name: orgId
      in: path
      required: true
      description: Tenant. Caller must be a member (or admin).
      schema: { type: integer, minimum: 1 }
    SicilId:
      name: sicilId
      in: path
      required: true
      schema: { type: integer }
    Year:
      name: year
      in: path
      required: true
      description: Calendar year being opened
      schema: { type: integer, minimum: 2000, maximum: 2999 }
    DepotIdQuery:
      name: depotId
      in: query
      description: Restrict to one depot; omitted means all depots of the company.
      schema: { type: integer }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: integer }
    PartId:
      name: partId
      in: path
      required: true
      schema: { type: integer }
    CountId:
      name: countId
      in: path
      required: true
      schema: { type: integer }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: integer }
    Filename:
      name: filename
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous `nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID. Unique per (org, key) for 24 h. Same key + same body replays the stored
        response; same key + different body → 422 ERR_IDEMPOTENCY_KEY_REUSED; in-flight → 409 ERR_IDEMPOTENCY_IN_PROGRESS.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (`"<version>"`) from the last read. Missing → 428, stale → 412.
      schema: { type: string, examples: ['"3"'] }

  headers:
    ETag:
      description: Current aggregate version, quoted.
      schema: { type: string }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3 }
    AvatarUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [avatar]
            properties:
              avatar: { type: string, contentMediaType: application/octet-stream }

  responses:
    BadRequest:
      description: Invalid input (ERR_INVALID_REQUEST, ERR_INVALID_ID, field validation codes)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid token or credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not a member of the organization or missing role (ERR_FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (ERR_*_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Uniqueness or state conflict (ERR_*_EXISTS, ERR_INVALID_STATE_TRANSITION, ERR_IDEMPOTENCY_IN_PROGRESS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match does not match current version (ERR_VERSION_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match header missing (ERR_PRECONDITION_REQUIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Business rule violated (ERR_ENTRY_UNBALANCED, ERR_INSUFFICIENT_STOCK, ERR_IDEMPOTENCY_KEY_REUSED, …)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit (ERR_RATE_LIMITED); see Retry-After
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkCode:
      description: Success notification code (OK_USER_DELETED, OK_ORG_DELETED, OK_SICIL_DELETED)
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, pattern: '^OK_[A-Z_]+$' }
    Image:
      description: Uploaded image file
      content:
        image/*:
          schema: { type: string, contentMediaType: application/octet-stream }
    UserResponse:
      description: User
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    OrganizationResponse:
      description: Organization
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Organization' }
    AccountResponse:
      description: Ledger account
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }
    JournalEntryResponse:
      description: Journal entry with postings
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JournalEntry' }
    PartResponse:
      description: Part
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Part' }
    DocumentResponse:
      description: Document
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Document' }
    ReceiptResponse:
      description: Receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    StockCountResponse:
      description: Stock count
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StockCount' }
    InstrumentResponse:
      description: Instrument
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Instrument' }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string, description: Developer-facing detail; never shown to end users }
        field: { type: string, description: Offending field for validation errors }
        traceId: { type: string, description: Request ID (X-Request-Id) }
    ErrorCode:
      type: string
      description: Language-agnostic code; translated by the client. The first group exists today.
      enum:
        - ERR_INVALID_REQUEST
        - ERR_INVALID_ID
        - ERR_USER_NOT_FOUND
        - ERR_ORG_NOT_FOUND
        - ERR_INVALID_CREDENTIALS
        - ERR_TOKEN_GENERATION
        - ERR_NO_FILE_UPLOADED
        - ERR_FILE_TOO_LARGE
        - ERR_FILE_OPEN
        - ERR_MISSING_TOKEN
        - ERR_INVALID_TOKEN_FORMAT
        - ERR_INVALID_TOKEN
        - ERR_UNAUTHORIZED
        - ERR_FORBIDDEN
        - ERR_SLUG_INVALID
        - ERR_SLUG_EXISTS
        - ERR_EMAIL_EXISTS
        - ERR_CANNOT_DELETE_SELF
        - ERR_CANNOT_DELETE_LAST_ADMIN
        - ERR_HESAP_NO_REQUIRED
        - ERR_HESAP_ADI_REQUIRED
        - ERR_HESAP_NO_EXISTS
        - ERR_SICIL_NOT_FOUND
        - ERR_INVALID_SICIL_TIPI
        - ERR_INVALID_TELEFON_TIPI
        - ERR_TELEFON_NUMARA_REQUIRED
        - ERR_INVALID_ISKONTO
        - ERR_INTERNAL
        - ERR_PRECONDITION_REQUIRED
        - ERR_VERSION_CONFLICT
        - ERR_IDEMPOTENCY_KEY_REQUIRED
        - ERR_IDEMPOTENCY_KEY_REUSED
        - ERR_IDEMPOTENCY_IN_PROGRESS
        - ERR_INVALID_STATE_TRANSITION
        - ERR_DEPOT_NOT_FOUND
        - ERR_DEPOT_REQUIRED
        - ERR_NUMBER_SERIES_BACKWARDS
        - ERR_ACCOUNT_NOT_FOUND
        - ERR_ACCOUNT_CODE_EXISTS
        - ERR_ACCOUNT_INACTIVE
        - ERR_CURRENCY_MISMATCH
        - ERR_ENTRY_NOT_FOUND
        - ERR_ENTRY_UNBALANCED
        - ERR_ENTRY_TOO_FEW_LINES
        - ERR_ENTRY_ALREADY_REVERSED
        - ERR_ENTRY_OWNED_BY_SOURCE
        - ERR_ALREADY_CARRIED_FORWARD
        - ERR_INVALID_AMOUNT
        - ERR_PART_NOT_FOUND
        - ERR_PART_CODE_EXISTS
        - ERR_PRICE_LIST_NOT_FOUND
        - ERR_INSUFFICIENT_STOCK
        - ERR_STOCK_COUNT_NOT_OPEN
        - ERR_DOCUMENT_NOT_FOUND
        - ERR_DOCUMENT_EMPTY
        - ERR_DOCUMENT_NOT_DRAFT
        - ERR_LINKED_DOCUMENT_INVALID
        - ERR_WAYBILL_INVALID
        - ERR_WAYBILL_BILLED
        - ERR_CREDIT_LIMIT_EXCEEDED
        - ERR_INSTRUMENT_NOT_FOUND
        - ERR_INSTRUMENT_DUPLICATE
        - ERR_DUE_BEFORE_ISSUE
        - ERR_RECEIPT_NOT_FOUND
        - ERR_RECEIPT_ALREADY_VOIDED
        - ERR_RECEIPT_OWNED_BY_INSTRUMENT
        - ERR_RATE_LIMITED
        - ERR_SICIL_HAS_POSTINGS
        - ERR_BANK_ACCOUNT_REQUIRED
        - ERR_INSTRUMENT_REQUIRED
        - ERR_AMOUNT_EXCEEDS_REMAINING
        - ERR_ENDORSEE_REQUIRED
        - ERR_ACCOUNT_ROLE_MISSING
        - ERR_CARRY_FORWARD_BLOCKED
        - ERR_STOCK_COUNT_LINE_NOT_FOUND
        - ERR_STOCK_COUNT_OPEN_EXISTS
        - ERR_SAME_DEPOT
        - ERR_CASH_VOUCHER_NOT_FOUND
        - ERR_CASH_VOUCHER_ALREADY_VOIDED
        - ERR_MIGRATION_RUNNING
        - ERR_MIGRATION_DRY_RUN_ONLY

    Pdf: { type: string, contentMediaType: application/pdf }
    Xlsx: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
    Money:
      type: string
      description: Decimal amount with two fraction digits, never a JSON number.
      pattern: '^-?\d{1,16}\.\d{2}$'
      examples: ['1250.00']
    Money4:
      type: string
      description: Unit price with up to four fraction digits.
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.3456']
    Quantity:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.5']
    Percent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,4})?$'
      examples: ['18']
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      default: TRY

    GridRequest:
      type: object
      description: One block of the AG Grid Community infinite row model, plus column filters.
      properties:
        startRow: { type: integer, minimum: 0 }
        endRow: { type: integer, minimum: 0 }
        sortModel:
          type: array
          items:
            type: object
            properties:
              colId: { type: string }
              sort: { type: string, enum: [asc, desc] }
        filterModel:
          type: object
          additionalProperties:
            type: object
            properties:
              filterType: { type: string, enum: [text, number, date] }
              type:
                type: string
                enum: [contains, notContains, equals, notEqual, startsWith, endsWith, blank, notBlank,
                       lessThan, lessThanOrEqual, greaterThan, greaterThanOrEqual, inRange]
              filter: { type: [string, number] }
              filterTo: { type: [string, number] }
              dateFrom: { type: [string, 'null'], description: 'yyyy-mm-dd' }
              dateTo: { type: [string, 'null'], description: 'yyyy-mm-dd, inclusive' }
        search: { type: string, description: Free-text OR ILIKE across searchable columns }
    GridResponse:
      type: object
      required: [rows, totalCount]
      properties:
        rows: { type: array, items: {} }
        totalCount: { type: integer, format: int64, description: Rows after filters }
        unfilteredCount: { type: integer, format: int64, description: 'Rows before column filters ("6 of 412")' }
        totals:
          type: object
          description: Pinned total row over all filtered rows, keyed by column
          additionalProperties: { type: string }

    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationWrite:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        logo_url: { type: [string, 'null'] }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserWrite:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organization_ids: { type: array, items: { type: integer } }

    SicilTipi: { type: string, enum: [FIRMA, MUSTERI, BANKA], description: 'Supplier (firma) / customer / bank' }
    TelefonTipi: { type: string, enum: [CEP, EV, IS, FAKS, DIGER], description: 'Mobile / home / work / fax / other' }
    SicilTelefon:
      type: object
      required: [tipi, numara]
      properties:
        id: { type: integer, readOnly: true }
        sicil_id: { type: integer, readOnly: true }
        tipi: { $ref: '#/components/schemas/TelefonTipi' }
        numara: { type: string }
    Sicil:
      type: object
      description: Account card (sicil) of a trading partner.
      required: [id, organization_id, hesap_no, hesap_adi, sicil_tipi]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        hesap_no: { type: string, maxLength: 64 }
        hesap_adi: { type: string, maxLength: 255 }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string, description: Payment term (days) }
        iskonto: { type: number, description: Default discount percent (legacy field; kept numeric for compatibility) }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
        credit_limit: { $ref: '#/components/schemas/Money', description: Planned }
        iskonto2: { type: number, description: Second cascaded discount percent (planned) }
        sales_rep_user_id: { type: [integer, 'null'], description: Planned }
        contacts:
          description: Planned; contact people with their own phones and emails
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              role: { type: string }
              phone: { type: string }
              email: { type: string, format: email }
        emails: { type: array, items: { type: string, format: email }, description: Planned }
        account_id: { type: [integer, 'null'], description: 'Current account (120 / 320 / 102), planned' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SicilCreate:
      type: object
      required: [hesap_no, hesap_adi]
      properties:
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
    SicilUpdate:
      type: object
      description: Partial update; unknown fields are ignored, organization_id cannot change.
      properties:
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
    SicilSummary:
      type: object
      required: [sicilId, accountId, balance, overdue, chequesInPortfolio]
      properties:
        sicilId: { type: integer }
        accountId: { type: integer }
        accountCode: { type: string }
        balance: { $ref: '#/components/schemas/Money', description: 'Debit positive' }
        overdue: { $ref: '#/components/schemas/Money', description: 'Debit items past due, not yet matched by credits' }
        creditLimit: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        creditUsedPct: { type: [integer, 'null'], description: 'balance / creditLimit, rounded; null without a limit' }
        paymentTermDays: { type: [integer, 'null'] }
        discount1Pct: { $ref: '#/components/schemas/Percent' }
        discount2Pct: { $ref: '#/components/schemas/Percent' }
        chequesInPortfolio: { $ref: '#/components/schemas/Money', description: Open receivable instruments of this card }
        lastMoveDate: { type: [string, 'null'], format: date }

    Dashboard:
      type: object
      required: [date, receivables, payables, cash, instrumentsDue30, latest, dueThisWeek, belowMin, ledgerCheck]
      properties:
        date: { type: string, format: date }
        receivables:
          type: object
          required: [total, accounts]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            accounts: { type: integer }
        payables:
          type: object
          required: [total, accounts]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            accounts: { type: integer }
        cash:
          type: object
          required: [total, depots]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            depots:
              type: array
              items:
                type: object
                required: [depotId, balance]
                properties:
                  depotId: { type: integer }
                  balance: { $ref: '#/components/schemas/Money' }
        instrumentsDue30:
          type: object
          required: [total, overdueCount]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            overdueCount: { type: integer }
        latest:
          type: array
          description: Documents, receipts and instruments, newest first
          items: { $ref: '#/components/schemas/ActivityItem' }
        dueThisWeek:
          type: array
          items:
            type: object
            required: [instrumentId, instrumentNo, sicilName, dueDate, daysToDue, remaining]
            properties:
              instrumentId: { type: integer }
              instrumentNo: { type: string }
              sicilName: { type: string }
              dueDate: { type: string, format: date }
              daysToDue: { type: integer, description: Negative when overdue }
              remaining: { $ref: '#/components/schemas/Money' }
        belowMin: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
        ledgerCheck:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [BALANCED, DRIFT, NOT_RUN] }
            checkedAt: { type: [string, 'null'], format: date-time }
    ActivityItem:
      type: object
      required: [kind, id, number, date, depotId, amount]
      properties:
        kind: { type: string, enum: [DOCUMENT, RECEIPT, INSTRUMENT, CASH_VOUCHER] }
        id: { type: integer }
        number: { type: string }
        subtype: { type: string, description: 'Document type, receipt kind or instrument type' }
        sicilId: { type: [integer, 'null'] }
        sicilName: { type: [string, 'null'] }
        date: { type: string, format: date }
        depotId: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
    SearchResult:
      type: object
      required: [accounts, parts, documents]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [sicilId, hesapNo, hesapAdi]
            properties:
              sicilId: { type: integer }
              hesapNo: { type: string }
              hesapAdi: { type: string }
        parts: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        documents: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }

    Depot:
      type: object
      description: Physical warehouse. Documents, number series, statements and stock are per depot.
      required: [code, name]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string, examples: ['1'] }
        name: { type: string }
        vatRate: { $ref: '#/components/schemas/Percent' }
        allowNegativeStock: { type: boolean, default: false }
        version: { type: integer, readOnly: true }
    NumberSeries:
      type: object
      description: 'Rendered as PREFIX-YEAR-DEPOT-COUNTER, e.g. TAH-2026-1-000042. Allocated with an upsert … RETURNING on this row, never max()+1.'
      required: [id, depotId, year, prefix, width, nextValue, version]
      properties:
        id: { type: integer }
        depotId: { type: integer }
        year: { type: integer }
        prefix: { $ref: '#/components/schemas/NumberPrefix' }
        width: { type: integer }
        nextValue: { type: integer, minimum: 1 }
        version: { type: integer }
    NumberPrefix:
      type: string
      description: 'Meaning per prefix: docs/domain-model.md, "Number prefixes". Imported legacy numbers keep their own format.'
      enum: [SF, SIR, SI, SIRI, AF, AIR, AI, AIRI, FF, TAH, TED, AC, AS, BC, BS, GDR, VRM, TRF, SAY, J]

    AccountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
    Side: { type: string, enum: [DEBIT, CREDIT] }
    SourceType: { type: string, enum: [manual, document, receipt, instrument, cash_voucher, cash_count, opening, reversal, legacy_import] }
    Account:
      type: object
      required: [id, orgId, code, name, type, currency, normalSide, isActive, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        code: { type: string, examples: ['120.00042'] }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        normalSide: { $ref: '#/components/schemas/Side' }
        sicilId: { type: [integer, 'null'], description: 'Set for current (cari) accounts of customers, suppliers and banks' }
        currency: { $ref: '#/components/schemas/Currency' }
        isActive: { type: boolean }
        version: { type: integer }
    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, pattern: '^[0-9]{3}(\.[0-9A-Za-z-]+)*$' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        sicilId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
    AccountPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        nextCursor: { type: [string, 'null'] }
    BalanceRow:
      type: object
      required: [accountId, debitTotal, creditTotal, balance]
      properties:
        accountId: { type: integer }
        accountCode: { type: string }
        accountName: { type: string }
        sicilId: { type: [integer, 'null'] }
        sicilTipi: { oneOf: [{ $ref: '#/components/schemas/SicilTipi' }, { type: 'null' }] }
        city: { type: [string, 'null'] }
        depotId: { type: [integer, 'null'], description: Null when summed over depots }
        debitTotal: { $ref: '#/components/schemas/Money' }
        creditTotal: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money', description: 'debitTotal − creditTotal' }
        overdue: { $ref: '#/components/schemas/Money' }
        lastMoveDate: { type: [string, 'null'], format: date }
    AccountSelection:
      type: object
      required: [accountIds, to]
      properties:
        accountIds: { type: array, minItems: 1, maxItems: 500, items: { type: integer } }
        from: { type: string, format: date, description: Statements only; defaults to 1 January of `to` }
        to: { type: string, format: date }
        depotId: { type: [integer, 'null'] }
        language: { type: string, enum: [en, tr], default: en }
    BalancesReport:
      type: object
      required: [asOf, rows, totalDebit, totalCredit]
      properties:
        asOf: { type: string, format: date, description: Inclusive }
        depotId: { type: [integer, 'null'] }
        rows: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
    CarryForward:
      type: object
      required: [year, status, checks, accountCount, entryCount, totalDebit, totalCredit, rows]
      properties:
        year: { type: integer }
        status: { type: string, enum: [PREVIEW, POSTED] }
        checks:
          type: array
          description: Close previous-year documents, stock counts posted, balances, open the year
          items:
            type: object
            required: [code, ok, blocking]
            properties:
              code: { type: string, enum: [NO_DRAFT_DOCUMENTS, STOCK_COUNTS_POSTED, LEDGER_BALANCED, YEAR_NOT_OPENED] }
              ok: { type: boolean }
              blocking: { type: boolean }
              detail: { type: string }
        accountCount: { type: integer, description: Accounts with a balance }
        entryCount: { type: integer, description: Opening entries (account × depot) }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
        rows:
          type: array
          items:
            type: object
            required: [accountId, accountCode, accountName, depotId, closingBalance, openingDebit, openingCredit, status]
            properties:
              accountId: { type: integer }
              accountCode: { type: string }
              accountName: { type: string }
              depotId: { type: integer }
              closingBalance: { $ref: '#/components/schemas/Money', description: '31 December of year − 1; debit positive' }
              openingDebit: { $ref: '#/components/schemas/Money' }
              openingCredit: { $ref: '#/components/schemas/Money' }
              status: { type: string, enum: [READY, SKIP, EDITED, POSTED] }
              overrideReason: { type: [string, 'null'] }
              journalEntryId: { type: [integer, 'null'] }
    CarryForwardOverride:
      type: object
      required: [accountId, depotId, debit, credit, reason]
      properties:
        accountId: { type: integer }
        depotId: { type: integer }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 3 }
    AccountRole:
      type: object
      required: [role, accountId]
      properties:
        role:
          type: string
          enum: [CASH, SALES, SALES_RETURNS, PURCHASES, PURCHASE_RETURNS, PRICE_DIFFERENCE, OUTPUT_VAT, INPUT_VAT,
                 RECEIVABLE_CHEQUES, RECEIVABLE_NOTES, CHEQUES_AT_BANK, PAYABLE_CHEQUES, PAYABLE_NOTES, OPENING, CASH_OVER_SHORT]
        depotId: { type: [integer, 'null'], description: Null = company default }
        accountId: { type: integer }
    TrailItem:
      type: object
      required: [at, kind, label]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [AUDIT, OUTBOX, DELIVERY, STOCK] }
        label: { type: string, examples: [document.posted, DocumentPosted, ledger] }
        ref: { type: [string, 'null'], description: 'Outbox id, If-Match version, depot …' }
        actorUserId: { type: [integer, 'null'] }
    OpeningBalance:
      type: object
      required: [accountId, depotId, year, debit, credit, journalEntryId]
      properties:
        accountId: { type: integer }
        depotId: { type: integer }
        year: { type: integer, description: Calendar year of the opening date (1 January) }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        journalEntryId: { type: integer }
        source: { type: string, enum: [CARRY_FORWARD, LEGACY_IMPORT] }
    PostingInput:
      type: object
      required: [accountId, side, amount]
      properties:
        accountId: { type: integer }
        side: { $ref: '#/components/schemas/Side' }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        memo: { type: string }
    Posting:
      allOf:
        - $ref: '#/components/schemas/PostingInput'
        - type: object
          required: [id, lineNo, currency]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            currency: { $ref: '#/components/schemas/Currency' }
            accountCode: { type: string }
            accountName: { type: string }
    JournalEntryCreate:
      type: object
      required: [depotId, entryDate, description, lines]
      properties:
        depotId: { type: integer }
        entryDate: { type: string, format: date }
        description: { type: string }
        lines: { type: array, minItems: 2, items: { $ref: '#/components/schemas/PostingInput' } }
    JournalEntry:
      type: object
      required: [id, orgId, depotId, entryNo, entryDate, description, sourceType, postings, createdAt]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        depotId: { type: integer }
        entryNo: { type: string }
        entryDate: { type: string, format: date }
        description: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: [string, 'null'] }
        reversesEntryId: { type: [integer, 'null'] }
        reversedByEntryId: { type: [integer, 'null'] }
        sourceNo: { type: [string, 'null'], description: 'Number of the owning document, receipt, instrument or voucher' }
        idempotencyKey: { type: [string, 'null'] }
        postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
    JournalEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
        nextCursor: { type: [string, 'null'] }
    StatementLine:
      type: object
      required: [entryDate, description, debit, credit, runningBalance]
      properties:
        entryId: { type: [integer, 'null'], description: Null on the brought-forward row }
        entryDate: { type: string, format: date }
        depotId: { type: [integer, 'null'] }
        documentNo: { type: [string, 'null'] }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: [string, 'null'] }
        subtype: { type: [string, 'null'], description: 'Document type, receipt kind or instrument type (SALES_INVOICE, COLLECTION …)' }
        dueDate: { type: [string, 'null'], format: date }
        description: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
    Statement:
      type: object
      required: [accountId, from, to, broughtForward, lines, depotTotals, closingBalance]
      properties:
        accountId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        broughtForward:
          type: array
          description: One row per depot, dated `from`; opening entries of `from`'s year are folded in
          items: { $ref: '#/components/schemas/StatementLine' }
        lines: { type: array, items: { $ref: '#/components/schemas/StatementLine' } }
        depotTotals:
          type: array
          items:
            type: object
            required: [depotId, debit, credit, balance]
            properties:
              depotId: { type: integer }
              debit: { $ref: '#/components/schemas/Money' }
              credit: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }

    DocumentType:
      type: string
      description: |
        Waybills (including return waybills) move stock only. Price-difference invoices post to the ledger only and
        take their direction (sales or purchase) from the linked document. Returns post to the ledger and move stock
        back, unless they bill a return waybill. An invoice or return that bills a waybill never moves stock.
      enum:
        - SALES_INVOICE_WITH_WAYBILL
        - SALES_INVOICE
        - SALES_WAYBILL
        - SALES_RETURN
        - SALES_RETURN_WAYBILL
        - PURCHASE_INVOICE_WITH_WAYBILL
        - PURCHASE_INVOICE
        - PURCHASE_WAYBILL
        - PURCHASE_RETURN
        - PURCHASE_RETURN_WAYBILL
        - PRICE_DIFFERENCE
    DocumentStatus: { type: string, enum: [DRAFT, POSTED, CANCELLED] }
    DocumentLineWrite:
      type: object
      required: [partId, qty, unitPrice]
      properties:
        partId: { type: integer }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitPrice: { $ref: '#/components/schemas/Money4' }
        discount1Pct: { $ref: '#/components/schemas/Percent' }
        discount2Pct: { $ref: '#/components/schemas/Percent' }
        vatPct: { $ref: '#/components/schemas/Percent' }
    DocumentLine:
      allOf:
        - $ref: '#/components/schemas/DocumentLineWrite'
        - type: object
          required: [id, lineNo, netAmount, vatAmount, lineTotal]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            stockNo: { type: string, readOnly: true }
            name: { type: string, readOnly: true }
            onHand: { $ref: '#/components/schemas/Quantity', description: 'In the document depot, now' }
            available: { $ref: '#/components/schemas/Quantity', description: onHand − reserved }
            netAmount: { $ref: '#/components/schemas/Money' }
            vatAmount: { $ref: '#/components/schemas/Money' }
            lineTotal: { $ref: '#/components/schemas/Money' }
    DocumentWrite:
      type: object
      required: [type, depotId, sicilId, documentDate, lines]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        depotId: { type: integer }
        sicilId: { type: integer }
        documentDate: { type: string, format: date }
        shipDate: { type: string, format: date }
        dueDate: { type: string, format: date, description: Defaults to documentDate + the card's payment term }
        salesRepUserId: { type: [integer, 'null'] }
        linkedDocumentId: { type: [integer, 'null'], description: 'Original of a return, return waybill or price difference' }
        waybillDocumentId:
          type: [integer, 'null']
          description: >-
            Waybill being billed. SALES_INVOICE → SALES_WAYBILL, PURCHASE_INVOICE → PURCHASE_WAYBILL,
            SALES_RETURN → SALES_RETURN_WAYBILL, PURCHASE_RETURN → PURCHASE_RETURN_WAYBILL; same sicil and depot,
            POSTED, billed once. The billing document does not move stock.
        description: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLineWrite' }, description: May be empty while DRAFT }
    DocumentSummary:
      type: object
      required: [id, type, status, depotId, sicilId, documentDate, grandTotal, version]
      properties:
        id: { type: integer }
        documentNo: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        depotId: { type: integer }
        sicilId: { type: integer }
        sicilName: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: [string, 'null'], format: date }
        grandTotal: { $ref: '#/components/schemas/Money' }
        version: { type: integer }
    Document:
      type: object
      required: [id, orgId, type, status, depotId, sicilId, documentDate, currency, grossTotal, discountTotal, netTotal, vatTotal, grandTotal, lines, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        documentNo: { type: [string, 'null'], description: Allocated on post }
        type: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        depotId: { type: integer }
        sicilId: { type: integer }
        sicilName: { type: string }
        documentDate: { type: string, format: date }
        shipDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        salesRepUserId: { type: [integer, 'null'] }
        linkedDocumentId: { type: [integer, 'null'] }
        linkedDocumentNo: { type: [string, 'null'] }
        waybillDocumentId: { type: [integer, 'null'] }
        waybillDocumentNo: { type: [string, 'null'] }
        billedByDocumentId: { type: [integer, 'null'], description: 'Waybills: the invoice or return that bills it' }
        currency: { $ref: '#/components/schemas/Currency' }
        grossTotal: { $ref: '#/components/schemas/Money', description: Σ qty × unit price }
        discountTotal: { $ref: '#/components/schemas/Money' }
        netTotal: { $ref: '#/components/schemas/Money', description: grossTotal − discountTotal }
        vatTotal: { $ref: '#/components/schemas/Money' }
        grandTotal: { $ref: '#/components/schemas/Money', description: netTotal + vatTotal }
        vatBreakdown:
          type: array
          items:
            type: object
            required: [vatPct, base, vat]
            properties:
              vatPct: { $ref: '#/components/schemas/Percent' }
              base: { $ref: '#/components/schemas/Money' }
              vat: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
        effects:
          description: What posting will do (DRAFT) or did (POSTED)
          type: object
          properties:
            ledger:
              type: array
              items:
                type: object
                required: [accountCode, side, amount]
                properties:
                  accountCode: { type: string }
                  accountName: { type: string }
                  side: { $ref: '#/components/schemas/Side' }
                  amount: { $ref: '#/components/schemas/Money' }
            stock:
              type: array
              items:
                type: object
                required: [depotId, qtyDelta]
                properties:
                  depotId: { type: integer }
                  qtyDelta: { type: string, pattern: '^-?\d{1,14}(\.\d{1,4})?$' }
            creditUsedPctAfter: { type: [integer, 'null'] }
        warnings:
          type: array
          description: Non-blocking on save, checked again on post
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [STOCK_SHORT, CREDIT_LIMIT, PRICE_BELOW_LIST] }
              lineNo: { type: [integer, 'null'] }
              requested: { $ref: '#/components/schemas/Quantity' }
              available: { $ref: '#/components/schemas/Quantity' }
        journalEntryId: { type: [integer, 'null'] }
        postedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        version: { type: integer }

    PaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER, CHEQUE, NOTE, ENDORSEMENT]
      description: ENDORSEMENT only appears on receipts issued by an ENDORSE operation.
    ReceiptCreate:
      type: object
      required: [kind, depotId, sicilId, date, method, amount]
      properties:
        kind: { type: string, enum: [COLLECTION, PAYMENT], description: 'tahsilat / tediye' }
        depotId: { type: integer }
        sicilId: { type: integer }
        date: { type: string, format: date }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        bankAccountId: { type: integer, description: Required for BANK_TRANSFER (a 102 account) }
        instrument:
          description: Required for CHEQUE and NOTE; type follows kind (collection → receivable, payment → payable)
          type: object
          required: [serialNo, issueDate, dueDate]
          properties:
            serialNo: { type: string, maxLength: 20 }
            issueDate: { type: string, format: date }
            dueDate: { type: string, format: date }
            drawerName: { type: string }
            drawerTaxNo: { type: string }
            bankName: { type: string }
            bankBranch: { type: string }
            bankCity: { type: string }
            accountNo: { type: string }
        description: { type: string }
    Receipt:
      allOf:
        - $ref: '#/components/schemas/ReceiptCreate'
        - type: object
          required: [id, orgId, receiptNo, journalEntryId, origin]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            receiptNo: { type: string, examples: [TAH20261000042] }
            origin: { type: string, enum: [MANUAL, INSTRUMENT], description: INSTRUMENT receipts are read-only; change them through the instrument }
            instrumentId: { type: [integer, 'null'] }
            instrumentNo: { type: [string, 'null'], description: '"Source" column' }
            sicilName: { type: string }
            journalEntryId: { type: integer }
            voidedByEntryId: { type: [integer, 'null'] }
    CashBookLine:
      type: object
      required: [date, kind, description, income, expense, runningBalance]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [COLLECTION, PAYMENT, EXPENSE, BANK_DEPOSIT, BANK_WITHDRAWAL, CASH_COUNT, OTHER] }
        documentNo: { type: [string, 'null'] }
        receiptId: { type: [integer, 'null'] }
        voucherId: { type: [integer, 'null'] }
        journalEntryId: { type: integer }
        sicilId: { type: [integer, 'null'] }
        sicilName: { type: [string, 'null'] }
        description: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
    CashBook:
      type: object
      required: [depotId, from, to, openingBalance, totalIn, totalOut, lines, closingBalance]
      properties:
        depotId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        openingBalance: { $ref: '#/components/schemas/Money', description: Balance at the end of from − 1 }
        totalIn: { $ref: '#/components/schemas/Money' }
        totalOut: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { $ref: '#/components/schemas/CashBookLine' } }
        closingBalance: { $ref: '#/components/schemas/Money' }
    CashVoucherCreate:
      type: object
      required: [kind, depotId, date, accountId, amount, description]
      properties:
        kind: { type: string, enum: [EXPENSE, BANK_DEPOSIT, BANK_WITHDRAWAL] }
        depotId: { type: integer }
        date: { type: string, format: date }
        accountId: { type: integer, description: Expense account (7xx) or bank account (102) }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
    CashVoucher:
      allOf:
        - $ref: '#/components/schemas/CashVoucherCreate'
        - type: object
          required: [id, voucherNo, journalEntryId]
          properties:
            id: { type: integer }
            voucherNo: { type: string, examples: [GDR-2026-1-000038] }
            journalEntryId: { type: integer }
            voidedByEntryId: { type: [integer, 'null'] }
    CashCountCreate:
      type: object
      required: [depotId, countedAmount]
      properties:
        depotId: { type: integer }
        countedAmount: { $ref: '#/components/schemas/Money' }
        postDifference: { type: boolean, default: false }
        note: { type: string }
    CashCount:
      allOf:
        - $ref: '#/components/schemas/CashCountCreate'
        - type: object
          required: [id, countedAt, bookBalance, difference]
          properties:
            id: { type: integer }
            countedAt: { type: string, format: date-time }
            bookBalance: { $ref: '#/components/schemas/Money' }
            difference: { $ref: '#/components/schemas/Money' }
            journalEntryId: { type: [integer, 'null'] }
            countedBy: { type: integer }

    InstrumentType:
      type: string
      enum: [RECEIVABLE_CHEQUE, RECEIVABLE_NOTE, PAYABLE_CHEQUE, PAYABLE_NOTE]
      description: 'alacak çeki, alacak senedi, borç çeki, borç senedi'
    InstrumentStatus:
      type: string
      enum: [PORTFOLIO, DEPOSITED, PARTIALLY_COLLECTED, COLLECTED, BOUNCED, ENDORSED, PROTESTED, RETURNED, ISSUED, PAID]
      description: 'Closed = COLLECTED, RETURNED, PAID.'
    InstrumentCreate:
      type: object
      required: [type, depotId, sicilId, serialNo, amount, issueDate, dueDate]
      properties:
        type: { $ref: '#/components/schemas/InstrumentType' }
        depotId: { type: integer }
        sicilId: { type: integer, description: 'Customer it was received from, or supplier it was issued to' }
        serialNo: { type: string, maxLength: 20 }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        drawerName: { type: string }
        drawerTaxNo: { type: string }
        bankName: { type: string }
        bankBranch: { type: string }
        bankCity: { type: string }
        accountNo: { type: string }
    Instrument:
      allOf:
        - $ref: '#/components/schemas/InstrumentCreate'
        - type: object
          required: [id, orgId, instrumentNo, status, remaining, isOverdue, receiptId, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            instrumentNo: { type: string, examples: [AC-2026-1-000007] }
            status: { $ref: '#/components/schemas/InstrumentStatus' }
            remaining: { $ref: '#/components/schemas/Money', description: amount − Σ collected; 0 exactly when COLLECTED or PAID }
            isOverdue: { type: boolean, description: Open and due date before today }
            sicilName: { type: string }
            heldBySicilId: { type: [integer, 'null'], description: Endorsee while ENDORSED }
            bankAccountId: { type: [integer, 'null'], description: While DEPOSITED }
            receiptId: { type: integer, description: Receipt issued at registration }
            version: { type: integer }
    InstrumentSummary:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items:
            type: object
            required: [tab, count, total]
            properties:
              tab: { type: string, enum: [RECEIVABLE, PAYABLE, PORTFOLIO, AT_BANK, ENDORSED, PROTESTED, CLOSED] }
              count: { type: integer }
              total: { $ref: '#/components/schemas/Money' }
        overdue:
          type: object
          properties:
            count: { type: integer }
            total: { $ref: '#/components/schemas/Money' }
        dueNext30:
          type: object
          properties:
            count: { type: integer }
            total: { $ref: '#/components/schemas/Money' }
    InstrumentOperation:
      type: object
      required: [action, date]
      properties:
        action: { type: string, enum: [DEPOSIT_TO_BANK, COLLECT_AT_BANK, COLLECT_BY_HAND, BOUNCE, ENDORSE, PROTEST, RETURN, PAY] }
        date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money', description: COLLECT_* only; defaults to remaining }
        method: { type: string, enum: [CASH, BANK_TRANSFER], description: COLLECT_BY_HAND and PAY; default CASH }
        endorseeSicilId: { type: integer, description: Required for ENDORSE }
        bankAccountId: { type: integer, description: 'Required for DEPOSIT_TO_BANK, COLLECT_AT_BANK and BANK_TRANSFER' }
        note: { type: string }
    InstrumentEvent:
      type: object
      required: [seq, action, toStatus, occurredAt]
      properties:
        seq: { type: integer }
        action: { type: string }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/InstrumentStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/InstrumentStatus' }
        occurredAt: { type: string, format: date-time }
        date: { type: string, format: date }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        remainingAfter: { $ref: '#/components/schemas/Money' }
        counterpartySicilId: { type: [integer, 'null'] }
        receiptId: { type: [integer, 'null'] }
        receiptNo: { type: [string, 'null'] }
        journalEntryId: { type: [integer, 'null'] }
        actorUserId: { type: integer }
        note: { type: [string, 'null'] }

    PartCode:
      type: object
      required: [kind, code]
      properties:
        kind: { type: string, enum: [MANUFACTURER, OEM, EQUIVALENT] }
        code: { type: string, maxLength: 40 }
        equivalentPartId: { type: [integer, 'null'], description: For EQUIVALENT codes (muadil) }
    PartWrite:
      type: object
      required: [catalogNo, stockNo, name]
      properties:
        catalogNo: { type: integer, description: Legacy KATNO }
        stockNo: { type: string, maxLength: 15, description: Legacy STNO }
        name: { type: string }
        type: { type: string }
        brand: { type: string }
        unit: { type: string, default: PCS }
        packageQty: { type: integer, minimum: 1 }
        vatPct: { $ref: '#/components/schemas/Percent' }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' } }
    Part:
      allOf:
        - $ref: '#/components/schemas/PartWrite'
        - type: object
          required: [id, orgId, isActive, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            isActive: { type: boolean }
            listPrice: { $ref: '#/components/schemas/Money4', description: Current price in the default sales list }
            priceListName: { type: string }
            onHand: { $ref: '#/components/schemas/Quantity', description: Sum over depots }
            version: { type: integer }
    CatalogHit:
      type: object
      required: [partId, stockNo, name, stock]
      properties:
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' }, description: OEM and equivalent codes }
        matchedCode: { type: [string, 'null'], description: 'The code that matched `q`, for highlighting' }
        stock:
          type: array
          items:
            type: object
            required: [depotId, onHand, available]
            properties:
              depotId: { type: integer }
              onHand: { $ref: '#/components/schemas/Quantity' }
              available: { $ref: '#/components/schemas/Quantity' }
        listPrice: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }] }
        vatPct: { $ref: '#/components/schemas/Percent' }
        unit: { type: string }
    CatalogSearchResult:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        total: { type: integer, description: 'All matches ("5 of 23")' }
        priceList: { $ref: '#/components/schemas/PriceList' }
        nextCursor: { type: [string, 'null'] }
    PriceList:
      type: object
      required: [code, name, kind]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [SALES, SUPPLIER] }
        supplierSicilId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        isDefault: { type: boolean }
    Price:
      type: object
      required: [priceListId, partId, price, validFrom]
      properties:
        priceListId: { type: integer }
        partId: { type: integer }
        price: { $ref: '#/components/schemas/Money4' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date, description: Derived from the next price }
        changePct: { type: [string, 'null'], description: 'Against the previous price, e.g. "6.9"' }
        createdBy: { type: integer }
    PartDepotSettings:
      type: object
      properties:
        minQty: { $ref: '#/components/schemas/Quantity' }
        maxQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        shelf: { type: string, maxLength: 20, examples: [A-04-2] }
    StockLevel:
      type: object
      required: [partId, onHand, reserved, available]
      properties:
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        depotId: { type: [integer, 'null'], description: Null on the total row }
        onHand: { $ref: '#/components/schemas/Quantity' }
        reserved: { $ref: '#/components/schemas/Quantity', description: Held by B2B orders (F3) }
        available: { $ref: '#/components/schemas/Quantity' }
        minQty: { $ref: '#/components/schemas/Quantity' }
        maxQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        shelf: { type: string }
        belowMin: { type: boolean }
        version: { type: integer, description: Of the depot settings }
    MovementKind: { type: string, enum: [IN, OUT, ADJUST_IN, ADJUST_OUT, TRANSFER_IN, TRANSFER_OUT] }
    StockMovement:
      type: object
      required: [id, partId, depotId, kind, qty, date, occurredAt, sourceType]
      properties:
        id: { type: integer }
        partId: { type: integer }
        depotId: { type: integer }
        kind: { $ref: '#/components/schemas/MovementKind' }
        label: { type: string, enum: [SALE, PURCHASE, SALES_RETURN, PURCHASE_RETURN, TRANSFER, COUNT, OPENING], description: Grid "Type" }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitCost: { $ref: '#/components/schemas/Money4' }
        sourceType: { type: string, enum: [document, stock_count, transfer, legacy_import] }
        sourceId: { type: [string, 'null'] }
        sourceNo: { type: [string, 'null'], description: 'Document, count or transfer number' }
        sicilName: { type: [string, 'null'] }
        otherDepotId: { type: [integer, 'null'], description: Transfers }
        runningOnHand: { $ref: '#/components/schemas/Quantity' }
        date: { type: string, format: date }
        occurredAt: { type: string, format: date-time }
    StockTransferCreate:
      type: object
      required: [fromDepotId, toDepotId, date, lines]
      properties:
        fromDepotId: { type: integer }
        toDepotId: { type: integer }
        date: { type: string, format: date }
        note: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [partId, qty]
            properties:
              partId: { type: integer }
              qty: { $ref: '#/components/schemas/Quantity' }
    StockTransfer:
      allOf:
        - $ref: '#/components/schemas/StockTransferCreate'
        - type: object
          required: [id, transferNo, movements]
          properties:
            id: { type: integer }
            transferNo: { type: string, examples: [TRF-2026-1-000051] }
            movements: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
    StockCountOpen:
      type: object
      required: [depotId, year]
      properties:
        depotId: { type: integer }
        year: { type: integer }
        shelfFrom: { type: string }
        shelfTo: { type: string }
    StockCountLine:
      type: object
      required: [id, partId, stockNo, name, shelf, systemQty, costSource, version]
      properties:
        id: { type: integer }
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        shelf: { type: string }
        systemQty: { $ref: '#/components/schemas/Quantity', description: 'Live while OPEN, snapshot after posting' }
        countedQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }], description: Null = not counted }
        difference: { type: [string, 'null'], pattern: '^-?\d{1,14}(\.\d{1,4})?$' }
        unitCost:
          oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }]
          description: Last purchase cost (docs/domain-model.md); live while OPEN, snapshot after posting
        costSource:
          type: string
          enum: [LAST_PURCHASE, LIST_PRICE, NONE]
          description: LIST_PRICE and NONE are flagged in the grid; NONE leaves value null
        value: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: difference × unitCost }
        countedBy: { type: [string, 'null'], description: User login }
        countedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    StockCount:
      allOf:
        - $ref: '#/components/schemas/StockCountOpen'
        - type: object
          required: [id, countNo, status, lineCount, countedCount, version]
          properties:
            id: { type: integer }
            countNo: { type: string, examples: [SAY-2026-1-000001] }
            status: { type: string, enum: [OPEN, FINALIZED, CANCELLED] }
            startedAt: { type: string, format: date-time }
            lineCount: { type: integer }
            countedCount: { type: integer, description: 'Progress "412 / 1,280"' }
            differenceValue: { $ref: '#/components/schemas/Money', description: Σ line value at last purchase cost }
            unvaluedLines: { type: integer, description: Lines with a difference and costSource LIST_PRICE or NONE }
            uncounted: { type: [string, 'null'], enum: [SKIP, ZERO, null] }
            finalizedAt: { type: [string, 'null'], format: date-time }
            version: { type: integer }

    MigrationRun:
      type: object
      required: [id, runNo, dryRun, status, source, recordsRead, recordsImported, recordsRejected, startedAt]
      properties:
        id: { type: integer }
        runNo: { type: string, examples: [MIG-0007] }
        dryRun: { type: boolean }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        source: { type: string, examples: ['synthetic:seed-42'] }
        recordsRead: { type: integer }
        recordsImported: { type: integer }
        recordsRejected: { type: integer, description: Sent to quarantine }
        ledgerDifference: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        trialBalance:
          type: object
          description: Account balances equal between legacy and new ledger
          properties:
            accountsChecked: { type: integer }
            accountsEqual: { type: integer }
        files:
          type: array
          items:
            type: object
            required: [legacyFile, target, read, imported, rejected, controlRule, result]
            properties:
              legacyFile: { type: string, examples: [CARHAR.DAT] }
              target: { type: string, examples: ['journal_entry, posting'] }
              read: { type: integer }
              imported: { type: integer }
              rejected: { type: integer }
              controlRule: { type: string, examples: ['Σ DR = Σ CR'] }
              controlLeft: { type: [string, 'null'] }
              controlRight: { type: [string, 'null'] }
              result: { type: string, enum: [MATCH, QUARANTINE, MISMATCH] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    QuarantineRecord:
      type: object
      required: [id, legacyFile, recordKey, reason]
      properties:
        id: { type: integer }
        legacyFile: { type: string }
        recordKey: { type: string }
        reason: { type: string, examples: [ERR_PART_NOT_FOUND] }
        decoded: { type: [object, 'null'] }
        rawHex: { type: string }
    CopybookLayout:
      type: object
      required: [legacyFile, copybook, fields]
      properties:
        legacyFile: { type: string }
        copybook: { type: string, examples: [legacy/cobol/SICIL.cpz] }
        recordLength: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [level, name, pic, offset, length]
            properties:
              level: { type: integer }
              name: { type: string }
              pic: { type: string, examples: ['9(13)V99'] }
              offset: { type: integer }
              length: { type: integer }
              target: { type: [string, 'null'], examples: [sicils.credit_limit] }

    AuditEvent:
      type: object
      required: [id, orgId, occurredAt, action, entityType, entityId]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [integer, 'null'] }
        actorIp: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        action: { type: string, examples: [document.posted, sicil.updated] }
        entityType: { type: string }
        entityId: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
