openapi: 3.1.0
info:
  title: fikopar API
  version: 1.5.0
  summary: B2B trade, ledger and instrument management for a spare-parts distributor.
  description: |
    **DRAFT / provisional.** Revised against the live JHipster (v2) inventory; see `docs/domain-model.md`.
    `Identity`, `Users`, `Admin`, `Uploads` and `Health` exist today. `Sicil` exists under `/api/sicil`
    and moves under `/api/orgs/{orgId}` in F1. Everything else is planned. Screen coverage: `docs/screens.md`.

    Conventions
    - **Errors** are language-agnostic: `{"code": "ERR_…"}` plus optional `detail`, `field`, `traceId`.
      The frontend translates `code`. Success notifications use `{"code": "OK_…"}`.
    - **Security**: there is no self-registration; users are created by an admin. Every data endpoint
      requires a token and membership of the organization (company) in the path, otherwise
      `403 ERR_FORBIDDEN`; the `user` role never sees other companies' data.
    - **Tenancy**: new endpoints are scoped by path `/api/orgs/{orgId}/…`; most also carry a depot.
    - **Dates**: date ranges are inclusive on both ends; years are calendar years. Date parameters and
      grid date filters are `yyyy-mm-dd`; a time part (`yyyy-mm-dd hh:mm:ss`, AG Grid) is accepted and ignored.
    - **Unknown ids**: an unknown id in the path answers `404 ERR_*_NOT_FOUND`; an unknown id in the request
      body (account, depot, sicil, part …) answers `422 ERR_*_NOT_FOUND` with `field`. In a query string it is
      stated per operation (v1.3: `getDashboard depotId` 404, `listStockLevels depotId` an empty list).
    - **Closed years**: posting the carry-forward into year Y closes Y − 1 and every earlier year. Any operation
      that writes a journal entry dated in a closed year answers `409 ERR_YEAR_CLOSED` (manual and reversal
      entries, document create/update/post/cancel, receipts and their voids, cash vouchers and counts, instrument
      operations, stock transfers, opening and finalizing stock counts).
      `reopenCarryForward` opens it again.
    - **Currency**: one currency per journal entry; v1.1 accepts `TRY` only.
    - **Negative stock** is allowed (v1.2). Operations that move stock (document post and cancel, transfers,
      count finalize) never fail on it; they return `warnings[]` with `NEGATIVE_STOCK`, the part, the depot and
      the on hand after. Stock movements follow the ledger's closed years (`409 ERR_YEAR_CLOSED`).
    - **Reservations** (v1.4): drafts that will move stock OUT hold what is available in their depot for 48 h after
      the last save; available = onHand − reserved. A shortfall is a `STOCK_SHORT` warning, never a block (v1.5: a
      line is short when onHand − reserved by other documents < qty, whatever this draft holds).
    - **Documents post in one transaction** (v1.5): post and cancel write the journal entry and the stock movements
      in their own transaction; `DocumentPosted` / `DocumentCancelled` are still written to the outbox for external
      consumers (e-Fatura exporter).
    - **Rounding** (v1.4): money is rounded per document line, half-up to 2 decimals; document totals are Σ lines.
    - **Exports**: reports and printable documents honour `Accept: application/pdf`. Grid endpoints return
      every filtered row as XLSX when `Accept` is the XLSX media type (server-side Excel). CSV is built in the client.
    - **Numbers**: `PREFIX-YEAR-DEPOT-COUNTER`, e.g. `SF-2026-1-000418`; one counter per company, depot, prefix and year.
      Every number in requests, responses, events and examples uses this dashed form (legacy imports excepted).
    - **Money** is a decimal string (`"1250.00"`), never a JSON number.
    - **Idempotency**: unsafe POSTs in new contexts require `Idempotency-Key`. A replay with the same key
      and body returns the original response with `Idempotent-Replayed: true`.
    - **Optimistic locking**: responses carry `ETag: "<version>"`; updates and state transitions
      require `If-Match` (`428` if missing, `412` if stale).
    - **Pagination**: grid endpoints take AG Grid Community infinite-model blocks (`startRow/endRow`),
      list endpoints use keyset `limit` + `cursor`. Column filters are AND-combined; `search` is OR across columns.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://fikopar.fpirim.me
    description: Demo, synthetic data
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness, version and metrics
  - name: Identity
    description: Authentication
  - name: Users
    description: Current user profile
  - name: Uploads
    description: Public avatar and logo files
  - name: Sicil
    description: Account cards of trading partners (exists)
  - name: Admin
    description: User and organization administration (exists)
  - name: Ledger
    description: Double-entry ledger (accounts, journal entries, balances)
  - name: Catalog
    description: Catalogs (price lists), parts, OEM/ALT/equivalent codes, list price history, price list imports
  - name: Stock
    description: Depots, movements, transfers, counts, levels
  - name: Documents
    description: Invoices, waybills, returns, price-difference invoices; number series
  - name: Instruments
    description: Cheques and promissory notes (çek/senet)
  - name: Receipts
    description: Collection and payment receipts (makbuz) and the cash book
  - name: Cash
    description: Cash book, expenses, bank deposits, till counts
  - name: Dashboard
    description: Aggregates for the start page and global search
  - name: Migration
    description: COBOL import runs and reconciliation
  - name: Audit
    description: Append-only audit trail

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and build version
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ['1.4.0'] }
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Prometheus metrics (restricted at the proxy in production)
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  /api/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: Exchange email + password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/demo:
    post:
      tags: [Identity]
      operationId: loginDemo
      summary: Sign in as the demo user (demo deployments only, rate limited)
      security: []
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  resetAt: { type: string, format: date-time, description: Next nightly reset }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/uploads/avatars/{filename}:
    get:
      tags: [Uploads]
      operationId: getAvatar
      summary: Get avatar
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/uploads/logos/{filename}:
    get:
      tags: [Uploads]
      operationId: getLogo
      summary: Get logo
      security: []
      parameters: [{ $ref: '#/components/parameters/Filename' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get me
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Users]
      operationId: updateMe
      summary: Update me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, description: Omit to keep the current password }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/me/avatar:
    post:
      tags: [Users]
      operationId: uploadMyAvatar
      summary: Upload my avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      operationId: deleteMyAvatar
      summary: Delete my avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orgs/{orgId}/sicils/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Sicil]
      operationId: gridSicil
      summary: Grid of account cards; XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Sicil' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/sicils:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Sicil]
      operationId: createSicil
      summary: Create sicil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/sicils/{sicilId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SicilId'
    get:
      tags: [Sicil]
      operationId: getSicil
      summary: Get sicil
      responses:
        '200':
          description: Account card
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sicil]
      operationId: updateSicil
      summary: Partial update (whitelisted fields); `telefonlar`, `emails` and `contacts`, when present, replace the list
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SicilUpdate' }
      responses:
        '200':
          description: Updated card
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sicil' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Sicil]
      operationId: deleteSicil
      summary: Delete sicil
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/sicils/{sicilId}/summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SicilId'
    get:
      tags: [Sicil]
      operationId: getSicilSummary
      summary: Balance, overdue, credit use and open instruments of one account card
      description: Side panel on statement, receipt and invoice screens.
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: asOf, in: query, schema: { type: string, format: date }, description: Defaults to today }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SicilSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Start page aggregates
      description: |
        As of `date`, for `depotId` or the whole company. An unknown `depotId` answers 404 ERR_DEPOT_NOT_FOUND.
        - `receivables`: Σ of the positive balances of `120.*` accounts; `accounts` = how many.
        - `payables`: Σ of the credit balances of `320.*` accounts (as a positive amount); `accounts` = how many.
        - `cash`: the CASH role account of each depot (depots without the role are left out); `total` = Σ.
        - `instrumentsDue30`: open receivable instruments due on or before `date` + 30, overdue included;
          `overdueCount` = due before `date`.
        - `dueThisWeek`: open receivable instruments due on or before `date` + 7, overdue first, then by due date.
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today }
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/search:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Dashboard]
      operationId: globalSearch
      summary: Top-bar search over account cards, parts and document numbers
      description: |
        The parts group uses the `searchCatalog` match and ranking, `limit` hits per group. A `q` over 60 characters
        skips the parts group. Cards and document numbers contain `q` literally (`%`, `_` and `\` are not wildcards).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 }, description: Per group }
      responses:
        '200':
          description: Hits grouped by kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List users
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/grid:
    post:
      tags: [Admin]
      operationId: adminGridUsers
      summary: Grid users
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserWrite' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: Delete user
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/avatar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadUserAvatar
      summary: Upload user avatar
      requestBody: { $ref: '#/components/requestBodies/AvatarUpload' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUserAvatar
      summary: Delete user avatar
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations:
    get:
      tags: [Admin]
      operationId: adminListOrganizations
      summary: List organizations
      responses:
        '200':
          description: All organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateOrganization
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/organizations/grid:
    post:
      tags: [Admin]
      operationId: adminGridOrganizations
      summary: Grid organizations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GridRequest' }
      responses:
        '200':
          description: One page of organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Admin]
      operationId: adminUpdateOrganization
      summary: Update organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganization
      summary: Delete organization
      responses:
        '200': { $ref: '#/components/responses/OkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/organizations/{id}/logo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      operationId: adminUploadOrganizationLogo
      summary: Upload organization logo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOrganizationLogo
      summary: Delete organization logo
      responses:
        '200': { $ref: '#/components/responses/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orgs/{orgId}/depots:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Stock]
      operationId: listDepots
      summary: Depots (physical warehouses) of the company
      responses:
        '200':
          description: Depots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Depot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Stock]
      operationId: createDepot
      summary: Create a depot (admin)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Depot' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Depot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Depot code already used in this company (ERR_DEPOT_CODE_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/orgs/{orgId}/number-series:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Documents]
      operationId: listNumberSeries
      summary: Number series per prefix, depot and year; `nextValue` previews the next number
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: prefix, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Series with the next value
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NumberSeries' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/number-series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: seriesId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Documents]
      operationId: updateNumberSeries
      summary: Change width or move the counter forward (admin)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                width: { type: integer, minimum: 4, maximum: 10 }
                nextValue: { type: integer, description: May only increase }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such series in this company (ERR_NUMBER_SERIES_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/ledger/accounts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AccountType' } }
        - { name: sicilId, in: query, schema: { type: integer } }
        - name: codePrefix
          in: query
          description: 'Code starts with this value, e.g. `102` or `120.10`. AND-combined with the other filters.'
          schema: { type: string, pattern: '^[0-9]{1,3}(\.[0-9A-Za-z-]*)*$' }
        - name: role
          in: query
          description: 'Picker shortcut: CASH = 100, BANK = 102, CUSTOMER = 120, SUPPLIER = 320, EXPENSE = 770 (code prefix).'
          schema: { $ref: '#/components/schemas/AccountPickerRole' }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ledger]
      operationId: createAccount
      summary: Create account
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201': { $ref: '#/components/responses/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccount
      summary: Get account
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Ledger]
      operationId: updateAccount
      summary: Rename or deactivate an account (code, type and currency are immutable)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/ledger/accounts/{accountId}/statement:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Ledger]
      operationId: getAccountStatement
      summary: Statement (ekstre) with brought-forward row, running balance and per-depot totals
      description: |
        `from` and `to` are inclusive. Excel or PDF via the Accept header.
        Balances follow the ledger start: the balance as of D is the opening entries of the latest carried-forward
        year Y ≤ D plus postings from 1 January Y to D. `broughtForward` is that balance as of `from − 1` per depot
        (opening entries of `from`'s year are folded in). When the range crosses 1 January of a carried-forward
        year, that year's opening entries appear as lines with `sourceType: opening` and `resetsBalance: true`: the
        running balance restarts at the opening amount instead of adding it, and `depotTotals` debit/credit leave
        them out. Without an override the restart equals the previous closing; with one the difference is visible
        on that line. `closingBalance` always equals the balance as of `to`.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/balances/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: gridBalances
      summary: Current-account balances as of a date (cari toplam); end date inclusive
      description: |
        `colId` in `sortModel` / `filterModel` is a `BalanceColId` (the `BalanceRow` property names); others answer
        400 ERR_INVALID_REQUEST. `totals` sums the filtered rows (pinned row) with the keys of `BalanceTotals`.
        XLSX via Accept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  required: [asOf]
                  properties:
                    asOf: { type: string, format: date }
                    depotId: { type: [integer, 'null'] }
                    sortModel:
                      type: array
                      items:
                        type: object
                        properties:
                          colId: { $ref: '#/components/schemas/BalanceColId' }
                    filterModel:
                      type: object
                      propertyNames: { $ref: '#/components/schemas/BalanceColId' }
                    sicilTipi: { oneOf: [{ $ref: '#/components/schemas/SicilTipi' }, { type: 'null' }] }
      responses:
        '200':
          description: One page of balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    required: [totals]
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
                      totals: { $ref: '#/components/schemas/BalanceTotals' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/ledger/statements/print:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: printStatements
      summary: One PDF with the statements of the selected accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSelection' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/reminder-letters:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Ledger]
      operationId: printReminderLetters
      summary: Payment reminder letters for the selected accounts (overdue items as of `to`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSelection' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/trial-balance:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: getTrialBalance
      summary: Trial balance (mizan); Σ debit = Σ credit by construction
      parameters:
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalancesReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/ledger/opening-balances:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listOpeningBalances
      summary: Opening balances (cari devir) per account, depot and calendar year
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000 } }
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Opening balances
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OpeningBalance' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    get:
      tags: [Ledger]
      operationId: getCarryForward
      summary: Preview opening entries for `year` from closing balances of `year - 1`; PDF via Accept
      description: |
        One row per (account, depot) with a non-zero closing balance or an override. `ETag` is the preview
        version; it changes with every override, post and reopen.
      parameters:
        - $ref: '#/components/parameters/DepotIdQuery'
      responses:
        '200':
          description: Preview, or the posted result
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}/overrides:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    put:
      tags: [Ledger]
      operationId: setCarryForwardOverride
      summary: Edit one opening amount before posting (admin); the row shows EDITED
      description: |
        `debit` and `credit` both "0.00" skips the row. Removing an override restores the computed amount.
        `previewDepotId` restricts the returned preview like `depotId` on `getCarryForward`.
        409 ERR_ALREADY_CARRIED_FORWARD while the year is POSTED.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/PreviewDepotId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarryForwardOverride' }
      responses:
        '200':
          description: Updated preview
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '400':
          description: Invalid amounts or reason (ERR_INVALID_AMOUNT, ERR_INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Ledger]
      operationId: deleteCarryForwardOverride
      summary: Remove an override
      description: '`accountId` and `depotId` name the row; `previewDepotId` restricts the returned preview.'
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: integer } }
        - { name: depotId, in: query, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/PreviewDepotId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated preview
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}/post:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    post:
      tags: [Ledger]
      operationId: postCarryForward
      summary: Post all opening entries of `year` in one transaction (admin)
      description: |
        Blocking checks must pass (422 ERR_CARRY_FORWARD_BLOCKED). One entry per (account, depot) dated 1 January,
        counter-account OPENING. A repeat returns 409 ERR_ALREADY_CARRIED_FORWARD. Posting closes `year − 1`
        (409 ERR_YEAR_CLOSED for later postings dated in it). Allowed again after `reopenCarryForward`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Posted
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/carry-forwards/{year}/reopen:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Year'
    post:
      tags: [Ledger]
      operationId: reopenCarryForward
      summary: Void the posted carry-forward of `year` so it can be edited and posted again (admin)
      description: |
        Reverses every opening entry of the active run (reversal entries dated 1 January, `sourceType: reversal`),
        marks the run REOPENED and opens `year − 1` for posting. Overrides are kept. Status becomes REOPENED
        (behaves like PREVIEW). 409 ERR_NOT_CARRIED_FORWARD when the year has no active run;
        409 ERR_YEAR_CLOSED while `year + 1` is carried forward (reopen that first).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: Reopened preview
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarryForward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/ledger/account-roles:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listAccountRoles
      summary: Accounts used by posting rules (cash, sales, VAT, cheques, opening …)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Ledger]
      operationId: setAccountRoles
      summary: Replace the role map (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccountRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/entries:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Ledger]
      operationId: listJournalEntries
      summary: List journal entries
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DepotIdQuery'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: accountId, in: query, schema: { type: integer } }
        - { name: sourceType, in: query, schema: { $ref: '#/components/schemas/SourceType' } }
        - { name: q, in: query, schema: { type: string }, description: Entry number or source document number }
      responses:
        '200':
          description: Journal entries, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ledger]
      operationId: postJournalEntry
      summary: Post a balanced manual journal entry
      description: |
        `422 ERR_ENTRY_UNBALANCED` unless Σ debit = Σ credit with at least two lines. Every line is TRY
        (422 ERR_CURRENCY_MISMATCH for an account in another currency). 409 ERR_YEAR_CLOSED for `entryDate` in a closed year.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
      responses:
        '201': { $ref: '#/components/responses/JournalEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/ledger/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Ledger]
      operationId: getJournalEntry
      summary: Get journal entry
      responses:
        '200': { $ref: '#/components/responses/JournalEntryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/entries/{entryId}/trail:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Ledger]
      operationId: getJournalEntryTrail
      summary: How the entry came to be (audit events, outbox event, deliveries), oldest first
      responses:
        '200':
          description: Trail
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TrailItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/ledger/entries/{entryId}/reversal:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Ledger]
      operationId: reverseJournalEntry
      summary: Reverse a manual entry
      description: |
        Entries owned by a document, receipt, instrument or cash voucher return 409 ERR_ENTRY_OWNED_BY_SOURCE with
        `owner`; reverse them through the owner. The reversal is dated today; 409 ERR_YEAR_CLOSED if that year is closed.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '201': { $ref: '#/components/responses/JournalEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orgs/{orgId}/members:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Users]
      operationId: listMembers
      summary: Users of the company (salesperson picker)
      responses:
        '200':
          description: Members, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orgs/{orgId}/documents/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Documents]
      operationId: gridDocuments
      summary: Documents list (type, status, card, depot, date range, number; column filters; totals); XLSX via Accept
      description: |
        Top-level filters and column filters (`DocumentColId`) are AND-combined. `documentNo` matches a substring of the
        number literally (`%`, `_`, `\` are plain characters), case-insensitive (drafts have none). `search` is OR over
        documentNo, hesapNo and sicilName. `billed` and `billsWaybill` (v1.5) feed the waybill and original pickers.
        Default sort documentDate desc, then id desc. `totals` has grossTotal, discountTotal, netTotal, vatTotal and grandTotal:
        Σ over the filtered rows except CANCELLED ones. `unfilteredCount` = documents of the company (and `depotId`)
        before the other filters. XLSX carries every filtered row (at most 100 000) with the same columns.
        Dashboard "Latest documents" = this grid with `statuses` [POSTED, CANCELLED], sort postedAt desc, rows 0–10
        (v1.5: `Dashboard.latest` is removed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentGridRequest' }
      responses:
        '200':
          description: One page of documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/documents:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Documents]
      operationId: createDocument
      summary: Create a DRAFT invoice, waybill, return or price-difference document
      description: |
        Server defaults: `dueDate` = documentDate + the card's payment term (`gun` in days; blank or not a number = 0),
        `salesRepUserId` = the card's salesperson, line `vatPct` = the part's, `discount1Pct` / `discount2Pct` = the
        card's `iskonto` / `iskonto2`. With `waybillDocumentId` and no lines the waybill's lines are copied (part,
        qty, prices, discounts, VAT, `billedLineId`). There is no preview endpoint: an editor that shows the lines
        before the first save reads the waybill (`getDocument`) and sends its lines with `billedLineId` itself (v1.5).
        Every line of a bill needs `billedLineId` (a line of the waybill, same part); quantities are checked on post.
        A return that bills a return waybill without `linkedDocumentId` takes the waybill's original. A return may
        go to another depot of the company than its original. The original of a return or price difference must be
        POSTED when the draft is saved.
        Amounts and totals are computed by the server (`Document`).
        A draft that will move stock OUT reserves `min(qty, available)` per line for 48 h (`StockReserved`).
        422: ERR_SICIL_NOT_FOUND, ERR_DEPOT_NOT_FOUND, ERR_PART_NOT_FOUND / ERR_PART_INACTIVE (`lines[i].partId`),
        ERR_USER_NOT_FOUND (`salesRepUserId`, not a member), ERR_LINKED_DOCUMENT_INVALID (`linkedDocumentId`:
        missing on a return or price difference, not POSTED, wrong type or card; `lines[i].originLineId`),
        ERR_WAYBILL_INVALID (`waybillDocumentId`, `lines[i].billedLineId`). 400
        ERR_INVALID_REQUEST (`field`): `priceDirection` missing on PRICE_DIFFERENCE or set on another type;
        `linkedDocumentId` on a type other than a return or price difference; a
        price-difference line with qty ≠ 1, discounts or a `partId` other than its origin line's; another type's
        line without `partId` or with `description`. 409
        ERR_WAYBILL_BILLED (the waybill has another non-cancelled bill), ERR_YEAR_CLOSED.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentWrite' }
      responses:
        '201': { $ref: '#/components/responses/DocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Document with per-depot stock, reservations, totals, effects and warnings; PDF via Accept
      description: |
        JSON: lines carry the stock of every depot now, what this draft holds (`reservedQty`) and, on documents that
        moved goods, `returnedQty`. `effects` = what posting will do (DRAFT) or did (POSTED); `warnings` are recomputed
        on every read of a draft. PDF: the printed invoice / waybill in the company's language; a DRAFT prints without
        a number and with a DRAFT mark; a CANCELLED document prints with a CANCELLED mark.
      responses:
        '200':
          description: Document
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      operationId: updateDocument
      summary: Replace header and lines of a DRAFT document
      description: |
        Same defaults and 422 codes as create. Replaces the draft's reservations (`StockReleased UPDATED`, then
        `StockReserved`) and restarts their 48 h. 409 ERR_DOCUMENT_NOT_DRAFT, ERR_WAYBILL_BILLED, ERR_YEAR_CLOSED,
        ERR_DOCUMENT_HAS_DEPENDENTS (another draft bills or links this draft's lines; `details` = `DocumentDependents`).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentWrite' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a DRAFT (no number was allocated); releases its reservations
      description: |
        409 ERR_DOCUMENT_NOT_DRAFT for a POSTED or CANCELLED document; ERR_DOCUMENT_HAS_DEPENDENTS when another draft
        bills or links this draft's lines (`details` = `DocumentDependents`). Emits `StockReleased DELETED`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/documents/{documentId}/post:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      operationId: postDocument
      summary: DRAFT → POSTED; allocates the number, releases reservations, emits DocumentPosted
      description: |
        One transaction (v1.5): checks, number (`next_number`, prefix of the type, year of documentDate), card
        snapshot, reservations released (`StockReleased POSTED`), the journal entry (ADR-0013 posting table) and the
        stock movements, and `DocumentPosted` in the outbox for external consumers. `journalEntryId` is set in the
        response (null for waybills and zero totals). Negative stock never blocks: `warnings` NEGATIVE_STOCK.
        409: ERR_DOCUMENT_NOT_DRAFT, ERR_YEAR_CLOSED, ERR_WAYBILL_BILLED, ERR_CREDIT_LIMIT_EXCEEDED (SF, SF with
        waybill, FF INCREASE on a sale; card limit set and balance + grandTotal > limit; `details` = `CreditLimitExceeded`)
        unless `creditOverride` is sent by an admin. 403 ERR_FORBIDDEN only when a non-admin's override would be
        needed; an override that is not needed is ignored and not recorded, for every user. 400 ERR_INVALID_REQUEST
        `field` `creditOverride.reason` (3–500 characters after trimming), checked before the credit check. 422: ERR_DOCUMENT_EMPTY, ERR_PART_INACTIVE, ERR_WAYBILL_INVALID (waybill not POSTED
        or lines do not bill it line for line), ERR_LINKED_DOCUMENT_INVALID, ERR_RETURN_QTY_EXCEEDED
        (`lines[i].qty`), ERR_PRICE_DIFFERENCE_EXCEEDED (a DECREASE above the original's net minus its posted
        decreases and goods-moving returns; `field` = `lines`),
        ERR_ACCOUNT_ROLE_MISSING, ERR_ACCOUNT_NOT_FOUND (the card has no current account).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                creditOverride:
                  type: object
                  description: Admin only. Stored on the document and in the audit trail (`document.credit_override`).
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/orgs/{orgId}/documents/{documentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      operationId: cancelDocument
      summary: POSTED → CANCELLED by reversal; the document itself is never edited
      description: |
        One transaction (v1.5): the reversal entry of the document's entry and one opposite movement per line that
        moved stock, both dated the cancel date, and `DocumentCancelled` in the outbox. Cancel date = the later of
        today (Europe/Istanbul) and the document date. `reversalEntryId` is set in the response.
        Opposite movements may take stock negative: `warnings` NEGATIVE_STOCK. 409: ERR_INVALID_STATE_TRANSITION
        (not POSTED; a draft is deleted instead), ERR_WAYBILL_BILLED (a waybill with a non-cancelled bill),
        ERR_DOCUMENT_HAS_DEPENDENTS (posted returns or price differences link it; `details` = `DocumentDependents`),
        ERR_YEAR_CLOSED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /api/orgs/{orgId}/receipts/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Receipts]
      operationId: gridReceipts
      summary: Grid of receipts (no, date, kind, method, account, source, amount); XLSX via Accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GridRequest'
                - type: object
                  properties:
                    depotId: { type: [integer, 'null'], description: Top-bar depot; null = all depots }
      responses:
        '200':
          description: One page of receipts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GridResponse'
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/receipts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Receipts]
      operationId: createReceipt
      summary: Issue a collection (tahsilat) or payment (tediye) receipt
      description: |
        CASH posts to the depot's cash book, BANK_TRANSFER to `bankAccountId`. CHEQUE and NOTE register the
        instrument in `instrument` in the same transaction (the receipt then belongs to it).
        Until F4 CHEQUE and NOTE answer 400 ERR_METHOD_NOT_AVAILABLE with `field: method`.
        409 ERR_YEAR_CLOSED for `date` in a closed year.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptCreate' }
      responses:
        '201': { $ref: '#/components/responses/ReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Get receipt; PDF via Accept
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orgs/{orgId}/receipts/{receiptId}/void:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ReceiptId'
    post:
      tags: [Receipts]
      operationId: voidReceipt
      summary: Void by reversal; receipts owned by an instrument operation return 409 ERR_RECEIPT_OWNED_BY_INSTRUMENT
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/cash-book:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Cash]
      operationId: getCashBook
      summary: Cash book (kasa defteri) of one depot with opening row, in/out totals and running balance
      description: |
        One till per depot, so `depotId` is required; there is no combined book. With "All depots" in the top bar
        the client asks the user to pick a depot. Missing `depotId` answers 400 ERR_DEPOT_REQUIRED.
        Across a carried year (as statements, L8): the CASH opening entry of the active run is an OPENING line on
        1 January with `resetsBalance`; lines after it run from the carried opening. Voided opening entries and their
        reversals are left out.
      parameters:
        - { name: depotId, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Cash book; XLSX or PDF via Accept
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashBook' }
            application/pdf:
              schema: { $ref: '#/components/schemas/Pdf' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/cash-vouchers:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Cash]
      operationId: createCashVoucher
      summary: Expense paid from the till (GDR) or cash moved to / from a bank (VRM)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashVoucherCreate' }
      responses:
        '201':
          description: Posted voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/orgs/{orgId}/cash-vouchers/{voucherId}/void:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: voucherId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Cash]
      operationId: voidCashVoucher
      summary: Void by reversal
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: Voided voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orgs/{orgId}/cash-counts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      tags: [Cash]
      operationId: listCashCounts
      summary: Till counts of a depot, newest first
      parameters:
        - { name: depotId, in: query, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CashCount' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Cash]
      operationId: createCashCount
      summary: Record a till count against the book balance; optionally post the difference to CASH_OVER_SHORT
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashCountCreate' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/orgs/{orgId}/instruments/grid:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      tags: [Instruments]
