    Pdf: { type: string, contentMediaType: application/pdf }
    Xlsx: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
    Money:
      type: string
      description: Decimal amount with two fraction digits, never a JSON number.
      pattern: '^-?\d{1,16}\.\d{2}$'
      examples: ['1250.00']
    Money4:
      type: string
      description: Unit price with up to four fraction digits.
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.3456']
    Quantity:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      examples: ['12.5']
    SignedQuantity:
      type: string
      description: Quantity that may be negative (on hand, available, differences)
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      examples: ['-3']
    Percent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,4})?$'
      examples: ['18']
    Currency:
      type: string
      description: One currency per journal entry; v1.1 accepts TRY only.
      enum: [TRY]
      default: TRY

    GridRequest:
      type: object
      description: One block of the AG Grid Community infinite row model, plus column filters.
      properties:
        startRow: { type: integer, minimum: 0 }
        endRow: { type: integer, minimum: 0 }
        sortModel:
          type: array
          items:
            type: object
            properties:
              colId: { type: string }
              sort: { type: string, enum: [asc, desc] }
        filterModel:
          type: object
          additionalProperties:
            type: object
            properties:
              filterType: { type: string, enum: [text, number, date] }
              type:
                type: string
                enum: [contains, notContains, equals, notEqual, startsWith, endsWith, blank, notBlank,
                       lessThan, lessThanOrEqual, greaterThan, greaterThanOrEqual, inRange]
              filter: { type: [string, number] }
              filterTo: { type: [string, number] }
              dateFrom: { type: [string, 'null'], description: 'yyyy-mm-dd; a time part is ignored' }
              dateTo: { type: [string, 'null'], description: 'yyyy-mm-dd, inclusive; a time part is ignored' }
        search: { type: string, description: Free-text OR ILIKE across searchable columns }
    GridResponse:
      type: object
      required: [rows, totalCount]
      properties:
        rows: { type: array, items: {} }
        totalCount: { type: integer, format: int64, description: Rows after filters }
        unfilteredCount: { type: integer, format: int64, description: 'Rows before column filters ("6 of 412")' }
        totals:
          type: object
          description: Pinned total row over all filtered rows, keyed by column
          additionalProperties: { type: string }

    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationWrite:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        logo_url: { type: [string, 'null'] }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserWrite:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        avatar_url: { type: [string, 'null'] }
        organization_ids: { type: array, items: { type: integer } }

    SicilTipi: { type: string, enum: [FIRMA, MUSTERI, BANKA], description: 'Supplier (firma) / customer / bank' }
    TelefonTipi: { type: string, enum: [CEP, EV, IS, FAKS, DIGER], description: 'Mobile / home / work / fax / other' }
    SicilTelefon:
      type: object
      required: [tipi, numara]
      properties:
        id: { type: integer, readOnly: true }
        sicil_id: { type: integer, readOnly: true }
        tipi: { $ref: '#/components/schemas/TelefonTipi' }
        numara: { type: string }
    Sicil:
      type: object
      description: Account card (sicil) of a trading partner.
      required: [id, organization_id, hesap_no, hesap_adi, sicil_tipi, version]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        hesap_no: { type: string, maxLength: 64 }
        hesap_adi: { type: string, maxLength: 255 }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string, description: Payment term (days) }
        iskonto: { type: number, description: Default discount percent (legacy field; kept numeric for compatibility) }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
        credit_limit: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Null = no limit }
        contacts: { type: array, items: { $ref: '#/components/schemas/SicilContact' } }
        emails: { type: array, items: { type: string, format: email } }
        iskonto2: { type: number, description: "Second cascaded discount percent, applied after iskonto; default of a line's discount2Pct" }
        sales_rep_user_id: { type: [integer, 'null'], description: "The card's salesperson, a company member (v1.5); default of a document's salesRepUserId" }
        sales_rep_name: { type: [string, 'null'], readOnly: true, description: Name of sales_rep_user_id }
        account_id: { type: [integer, 'null'], description: 'Current account (120 / 320 / 102), planned' }
        version: { type: integer, description: Also sent as ETag; updates need If-Match }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SicilContact:
      type: object
      description: Contact person; the first one is shown on the statement card.
      required: [name]
      properties:
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
    SicilCreate:
      type: object
      required: [hesap_no, hesap_adi]
      properties:
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        iskonto2: { type: number, minimum: 0, maximum: 100, description: 'Out of range: 400 ERR_INVALID_ISKONTO' }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
        credit_limit: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        contacts: { type: array, items: { $ref: '#/components/schemas/SicilContact' } }
        emails: { type: array, items: { type: string, format: email } }
        sales_rep_user_id: { type: [integer, 'null'], description: 'A company member or null; 422 ERR_USER_NOT_FOUND otherwise (v1.5)' }
    SicilUpdate:
      type: object
      description: Partial update; unknown fields are ignored, organization_id cannot change.
      properties:
        hesap_no: { type: string }
        hesap_adi: { type: string }
        adres: { type: string }
        ilce: { type: string }
        sehir: { type: string }
        v_dairesi: { type: string }
        v_no: { type: string }
        tc_no: { type: string }
        gun: { type: string }
        iskonto: { type: number, minimum: 0, maximum: 100 }
        iskonto2: { type: number, minimum: 0, maximum: 100, description: 'Out of range: 400 ERR_INVALID_ISKONTO' }
        sicil_tipi: { $ref: '#/components/schemas/SicilTipi' }
        telefonlar: { type: array, items: { $ref: '#/components/schemas/SicilTelefon' } }
        credit_limit: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        contacts: { type: array, items: { $ref: '#/components/schemas/SicilContact' } }
        emails: { type: array, items: { type: string, format: email } }
        sales_rep_user_id: { type: [integer, 'null'], description: 'A company member or null; 422 ERR_USER_NOT_FOUND otherwise (v1.5)' }
    SicilSummary:
      type: object
      required: [sicilId, accountId, balance, overdue, chequesInPortfolio]
      properties:
        sicilId: { type: integer }
        accountId: { type: integer }
        accountCode: { type: string }
        balance: { $ref: '#/components/schemas/Money', description: 'Debit positive' }
        overdue: { $ref: '#/components/schemas/Money', description: 'Debit items past due, not yet matched by credits' }
        creditLimit: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        creditUsedPct: { type: [integer, 'null'], description: 'balance / creditLimit, rounded; null without a limit' }
        paymentTermDays: { type: [integer, 'null'] }
        discount1Pct: { $ref: '#/components/schemas/Percent' }
        discount2Pct: { $ref: '#/components/schemas/Percent' }
        salesRepUserId: { type: [integer, 'null'], description: "The card's salesperson (v1.5); a document's default" }
        salesRepName: { type: [string, 'null'] }
        chequesInPortfolio: { $ref: '#/components/schemas/Money', description: Open receivable instruments of this card }
        lastMoveDate: { type: [string, 'null'], format: date }

    Dashboard:
      type: object
      description: 'Latest documents come from gridDocuments (v1.5: `latest` removed)'
      required: [date, receivables, payables, cash, instrumentsDue30, dueThisWeek, belowMin, belowMinCount, negativeCount, ledgerCheck]
      properties:
        date: { type: string, format: date }
        receivables:
          type: object
          required: [total, accounts]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            accounts: { type: integer }
        payables:
          type: object
          required: [total, accounts]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            accounts: { type: integer }
        cash:
          type: object
          required: [total, depots]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            depots:
              type: array
              items:
                type: object
                required: [depotId, balance]
                properties:
                  depotId: { type: integer }
                  balance: { $ref: '#/components/schemas/Money' }
        instrumentsDue30:
          type: object
          required: [total, overdueCount]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            overdueCount: { type: integer }
        dueThisWeek:
          type: array
          items:
            type: object
            required: [instrumentId, instrumentNo, sicilName, dueDate, daysToDue, remaining]
            properties:
              instrumentId: { type: integer }
              instrumentNo: { type: string }
              sicilName: { type: string }
              dueDate: { type: string, format: date }
              daysToDue: { type: integer, description: Negative when overdue }
              remaining: { $ref: '#/components/schemas/Money' }
        belowMin:
          type: array
          maxItems: 10
          description: '"Below minimum / negative" list: listStockLevels only=BELOW_MIN_OR_NEGATIVE, negative first'
          items: { $ref: '#/components/schemas/StockLevel' }
        belowMinCount: { type: integer, description: '(part, depot) pairs below minimum' }
        negativeCount: { type: integer, description: '(part, depot) pairs with negative on hand' }
        ledgerCheck:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [BALANCED, DRIFT, NOT_RUN] }
            checkedAt: { type: [string, 'null'], format: date-time }
    ActivityItem:
      type: object
      required: [kind, id, number, date, depotId, amount]
      properties:
        kind: { type: string, enum: [DOCUMENT, RECEIPT, INSTRUMENT, CASH_VOUCHER] }
        id: { type: integer }
        number: { type: string }
        subtype: { type: string, description: 'Document type, receipt kind or instrument type' }
        sicilId: { type: [integer, 'null'] }
        sicilName: { type: [string, 'null'] }
        date: { type: string, format: date }
        depotId: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
    SearchResult:
      type: object
      required: [accounts, parts, documents]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [sicilId, accountId, hesapNo, hesapAdi]
            properties:
              sicilId: { type: integer }
              accountId: { type: [integer, 'null'], description: 'Current account (120 / 320 / 102) for the statement; null if none' }
              hesapNo: { type: string }
              hesapAdi: { type: string }
        parts: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        documents: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }

    Depot:
      type: object
      description: Physical warehouse. Documents, number series, statements and stock are per depot.
      required: [code, name]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string, examples: ['1'] }
        name: { type: string }
        vatRate: { $ref: '#/components/schemas/Percent' }
        version: { type: integer, readOnly: true }
    NumberSeries:
      type: object
      description: 'Rendered as PREFIX-YEAR-DEPOT-COUNTER, e.g. TAH-2026-1-000042. Allocated with an upsert … RETURNING on this row, never max()+1.'
      required: [id, depotId, year, prefix, width, nextValue, version]
      properties:
        id: { type: integer }
        depotId: { type: integer }
        year: { type: integer }
        prefix: { $ref: '#/components/schemas/NumberPrefix' }
        width: { type: integer }
        nextValue: { type: integer, minimum: 1 }
        version: { type: integer }
    NumberPrefix:
      type: string
      description: 'Meaning per prefix: docs/domain-model.md, "Number prefixes". Imported legacy numbers keep their own format.'
      enum: [SF, SIR, SI, SIRI, AF, AIR, AI, AIRI, FF, TAH, TED, AC, AS, BC, BS, GDR, VRM, TRF, SAY, J]

    AccountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
    AccountPickerRole: { type: string, enum: [CASH, BANK, CUSTOMER, SUPPLIER, EXPENSE], description: 'Code prefix 100 / 102 / 120 / 320 / 770' }
    Side: { type: string, enum: [DEBIT, CREDIT] }
    SourceType: { type: string, enum: [manual, document, receipt, instrument, cash_voucher, cash_count, opening, reversal, legacy_import] }
    Account:
      type: object
      required: [id, orgId, code, name, type, currency, normalSide, isActive, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        code: { type: string, examples: ['120.00042'] }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        normalSide: { $ref: '#/components/schemas/Side' }
        sicilId: { type: [integer, 'null'], description: 'Set for current (cari) accounts of customers, suppliers and banks' }
        currency: { $ref: '#/components/schemas/Currency' }
        isActive: { type: boolean }
        version: { type: integer }
    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, pattern: '^[0-9]{3}(\.[0-9A-Za-z-]+)*$' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        sicilId: { type: [integer, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
    AccountPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        nextCursor: { type: [string, 'null'] }
    BalanceRow:
      type: object
      required: [accountId, debitTotal, creditTotal, balance]
      properties:
        accountId: { type: integer }
        accountCode: { type: string }
        accountName: { type: string }
        sicilId: { type: [integer, 'null'] }
        sicilTipi: { oneOf: [{ $ref: '#/components/schemas/SicilTipi' }, { type: 'null' }] }
        city: { type: [string, 'null'] }
        depotId: { type: [integer, 'null'], description: Null when summed over depots }
        debitTotal: { $ref: '#/components/schemas/Money' }
        creditTotal: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money', description: 'debitTotal − creditTotal' }
        overdue: { $ref: '#/components/schemas/Money' }
        lastMoveDate: { type: [string, 'null'], format: date }
    BalanceColId:
      type: string
      description: '`colId` values accepted by `gridBalances`'
      enum: [accountCode, accountName, city, sicilTipi, debitTotal, creditTotal, balance, overdue, lastMoveDate]
    BalanceTotals:
      type: object
      description: Pinned total row of `gridBalances` over all filtered rows
      required: [debitTotal, creditTotal, balance, overdue]
      properties:
        debitTotal: { $ref: '#/components/schemas/Money' }
        creditTotal: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        overdue: { $ref: '#/components/schemas/Money' }
    AccountSelection:
      type: object
      required: [accountIds, to]
      properties:
        accountIds: { type: array, minItems: 1, maxItems: 500, items: { type: integer } }
        from: { type: string, format: date, description: Statements only; defaults to 1 January of `to` }
        to: { type: string, format: date }
        depotId: { type: [integer, 'null'] }
        language: { type: string, enum: [en, tr], default: en }
    BalancesReport:
      type: object
      required: [asOf, rows, totalDebit, totalCredit]
      properties:
        asOf: { type: string, format: date, description: Inclusive }
        depotId: { type: [integer, 'null'] }
        rows: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
    CarryForward:
      type: object
      required: [year, status, version, checks, steps, accountCount, entryCount, totalDebit, totalCredit, rows]
      properties:
        year: { type: integer }
        status:
          type: string
          enum: [PREVIEW, POSTED, REOPENED]
          description: REOPENED = a posted run was voided by `reopenCarryForward`; editable and postable like PREVIEW
        version: { type: integer, description: 'Preview version; also the ETag' }
        postedAt: { type: [string, 'null'], format: date-time, description: Active run }
        reopenedAt: { type: [string, 'null'], format: date-time, description: Last reopened run }
        reopenReason: { type: [string, 'null'] }
        steps:
          type: array
          description: |
            The four steps of the screen, in order. CLOSE_DOCUMENTS ← NO_DRAFT_DOCUMENTS, STOCK_COUNTS ←
            STOCK_COUNTS_POSTED and YEAR_END_COUNTS, ACCOUNT_BALANCES ← LEDGER_BALANCED, OPEN_YEAR ← YEAR_NOT_OPENED and the post.
            A failing blocking check makes its step BLOCKED; a failing warning (YEAR_END_COUNTS) is shown in
            `checks` but does not keep its step from DONE. The first step not DONE is CURRENT; all four are DONE
            when status is POSTED.
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [code, status]
            properties:
              code: { type: string, enum: [CLOSE_DOCUMENTS, STOCK_COUNTS, ACCOUNT_BALANCES, OPEN_YEAR] }
              status: { type: string, enum: [DONE, CURRENT, TODO, BLOCKED] }
        checks:
          type: array
          description: |
            Close previous-year documents, stock counts posted, balances, open the year.
            STOCK_COUNTS_POSTED (blocking): no stock count in status OPEN with countDate ≤ 31 December of year − 1, in any
            depot (their ADJUST movements would land in the closed year); `detail` lists the count numbers.
            YEAR_END_COUNTS (not blocking): every depot has a FINALIZED count dated in year − 1; `detail` lists depots
            without one. NO_DRAFT_DOCUMENTS (blocking, v1.4): no DRAFT document dated on or before 31 December of year − 1;
            `detail` lists up to 20 draft ids.
          items:
            type: object
            required: [code, ok, blocking]
            properties:
              code: { type: string, enum: [NO_DRAFT_DOCUMENTS, STOCK_COUNTS_POSTED, YEAR_END_COUNTS, LEDGER_BALANCED, YEAR_NOT_OPENED] }
              ok: { type: boolean }
              blocking: { type: boolean }
              detail: { type: string }
        accountCount: { type: integer, description: Accounts with a balance }
        entryCount: { type: integer, description: Opening entries (account × depot) }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
        rows:
          type: array
          items:
            type: object
            required: [accountId, accountCode, accountName, depotId, closingBalance, openingDebit, openingCredit, status]
            properties:
              accountId: { type: integer }
              accountCode: { type: string }
              accountName: { type: string }
              depotId: { type: integer }
              closingBalance: { $ref: '#/components/schemas/Money', description: '31 December of year − 1; debit positive' }
              openingDebit: { $ref: '#/components/schemas/Money' }
              openingCredit: { $ref: '#/components/schemas/Money' }
              status: { type: string, enum: [READY, SKIP, EDITED, POSTED] }
              overrideReason: { type: [string, 'null'] }
              journalEntryId: { type: [integer, 'null'] }
    CarryForwardOverride:
      type: object
      required: [accountId, depotId, debit, credit, reason]
      properties:
        accountId: { type: integer }
        depotId: { type: integer }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 3 }
    AccountRole:
      type: object
      required: [role, accountId]
      properties:
        role:
          type: string
          enum: [CASH, SALES, SALES_RETURNS, SALES_DISCOUNTS, PURCHASES, PURCHASE_RETURNS, PRICE_DIFFERENCE, OUTPUT_VAT, INPUT_VAT,
                 RECEIVABLE_CHEQUES, RECEIVABLE_NOTES, CHEQUES_AT_BANK, PAYABLE_CHEQUES, PAYABLE_NOTES, OPENING, CASH_OVER_SHORT]
        depotId: { type: [integer, 'null'], description: Null = company default }
        accountId: { type: integer }
    TrailItem:
      type: object
      required: [at, kind, label]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [AUDIT, OUTBOX, DELIVERY, STOCK] }
        label: { type: string, examples: [document.posted, DocumentPosted, ledger] }
        ref: { type: [string, 'null'], description: 'Outbox id, If-Match version, depot …' }
        actorUserId: { type: [integer, 'null'] }
        actorLogin: { type: [string, 'null'], description: 'Login shown in the UI (email local part)', examples: [a.kaya] }
    OpeningBalance:
      type: object
      required: [accountId, depotId, year, debit, credit, journalEntryId]
      properties:
        accountId: { type: integer }
        depotId: { type: integer }
        year: { type: integer, description: Calendar year of the opening date (1 January) }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        journalEntryId: { type: integer }
        source: { type: string, enum: [CARRY_FORWARD, LEGACY_IMPORT] }
    PostingInput:
      type: object
      required: [accountId, side, amount]
      properties:
        accountId: { type: integer }
        side: { $ref: '#/components/schemas/Side' }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        memo: { type: string }
    Posting:
      allOf:
        - $ref: '#/components/schemas/PostingInput'
        - type: object
          required: [id, lineNo, currency]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            currency: { $ref: '#/components/schemas/Currency' }
            accountCode: { type: string }
            accountName: { type: string }
    JournalEntryCreate:
      type: object
      required: [depotId, entryDate, description, lines]
      properties:
        depotId: { type: integer }
        entryDate: { type: string, format: date }
        description: { type: string }
        lines: { type: array, minItems: 2, items: { $ref: '#/components/schemas/PostingInput' } }
    JournalEntry:
      type: object
      required: [id, orgId, depotId, entryNo, entryDate, description, sourceType, postings, createdAt]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        depotId: { type: integer }
        entryNo: { type: string }
        entryDate: { type: string, format: date }
        description: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: [string, 'null'] }
        reversesEntryId: { type: [integer, 'null'] }
        reversesEntryNo: { type: [string, 'null'], examples: [J-2026-1-000118] }
        reversedByEntryId: { type: [integer, 'null'] }
        reversedByEntryNo: { type: [string, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        sourceNo: { type: [string, 'null'], description: 'Number of the owning document, receipt, instrument or voucher' }
        idempotencyKey: { type: [string, 'null'] }
        postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
    JournalEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
        nextCursor: { type: [string, 'null'] }
    StatementLine:
      type: object
      required: [entryDate, description, debit, credit, runningBalance]
      properties:
        entryId: { type: [integer, 'null'], description: Null on the brought-forward row }
        entryDate: { type: string, format: date }
        depotId: { type: [integer, 'null'] }
        documentNo: { type: [string, 'null'] }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceId: { type: [string, 'null'] }
        subtype: { type: [string, 'null'], description: 'Document type, receipt kind or instrument type (SALES_INVOICE, COLLECTION …)' }
        documentId:
          type: [integer, 'null']
          description: 'v1.4: the document of a document entry or of its reversal (link to the invoice screen); null otherwise'
        documentType: { oneOf: [{ $ref: '#/components/schemas/DocumentType' }, { type: 'null' }] }
        dueDate: { type: [string, 'null'], format: date }
        description: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
        resetsBalance:
          type: boolean
          default: false
          description: 'Opening line of a carried-forward year inside the range: runningBalance restarts at its amount'
    Statement:
      type: object
      required: [accountId, from, to, broughtForward, lines, depotTotals, closingBalance]
      properties:
        accountId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        broughtForward:
          type: array
          description: One row per depot, dated `from`; opening entries of `from`'s year are folded in
          items: { $ref: '#/components/schemas/StatementLine' }
        lines: { type: array, items: { $ref: '#/components/schemas/StatementLine' } }
        depotTotals:
          type: array
          description: Debit and credit of `lines` per depot, without `resetsBalance` lines; balance = closing balance of the depot
          items:
            type: object
            required: [depotId, debit, credit, balance]
            properties:
              depotId: { type: integer }
              debit: { $ref: '#/components/schemas/Money' }
              credit: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }

    DocumentType:
      type: string
      description: |
        Waybills (including return waybills) move stock only. Price-difference invoices post to the ledger only, take
        sales or purchase from the linked invoice and INCREASE or DECREASE from `priceDirection` (prefix FF for both).
        Returns post to the ledger and move stock
        back, unless they bill a return waybill. An invoice or return that bills a waybill never moves stock.
      enum:
        - SALES_INVOICE_WITH_WAYBILL
        - SALES_INVOICE
        - SALES_WAYBILL
        - SALES_RETURN
        - SALES_RETURN_WAYBILL
        - PURCHASE_INVOICE_WITH_WAYBILL
        - PURCHASE_INVOICE
        - PURCHASE_WAYBILL
        - PURCHASE_RETURN
        - PURCHASE_RETURN_WAYBILL
        - PRICE_DIFFERENCE
    PriceDirection:
      type: string
      description: |
        Price differences only. INCREASE: sales, the customer is debited (C / 600 + 391); purchase, the supplier is
        credited (153 + 191 / C). DECREASE: sales, the customer is credited (611 + 391 / C); purchase, the supplier is
        debited (C / 153 + 191). A DECREASE is capped by the original's net minus its posted decreases and
        goods-moving returns (ERR_PRICE_DIFFERENCE_EXCEEDED).
      enum: [INCREASE, DECREASE]
    DocumentStatus:
      type: string
      description: DRAFT → POSTED → CANCELLED. A DRAFT is deleted, never cancelled.
      enum: [DRAFT, POSTED, CANCELLED]
    Member:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    DocumentLineWrite:
      type: object
      description: |
        PRICE_DIFFERENCE lines are amount only: qty 1, unitPrice = the difference (net), no discounts, VAT applies
        (default the origin line's); `partId` is the origin line's (omit it) or null without `originLineId`, and
        `description` is printed. Every other type needs `partId` and no `description`.
      required: [qty, unitPrice]
      properties:
        partId: { type: [integer, 'null'], description: Catalog part; never free text. Null only on a price-difference line without origin }
        description: { type: [string, 'null'], maxLength: 200, description: Price-difference lines only }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitPrice: { $ref: '#/components/schemas/Money4' }
        discount1Pct: { $ref: '#/components/schemas/Percent', description: "Default: the card's iskonto" }
        discount2Pct: { $ref: '#/components/schemas/Percent', description: "Default: the card's iskonto2; applied after discount1Pct" }
        vatPct: { $ref: '#/components/schemas/Percent', description: "Default: the part's VAT rate" }
        originLineId:
          type: [integer, 'null']
          description: Returns (required) and price differences (optional); a line of `linkedDocumentId` with the same part
        billedLineId:
          type: [integer, 'null']
          description: Bills; a line of `waybillDocumentId` with the same part and qty, each waybill line once
    DepotStock:
      type: object
      required: [depotId, depotCode, onHand, reserved, available]
      properties:
        depotId: { type: integer }
        depotCode: { type: string }
        onHand: { $ref: '#/components/schemas/SignedQuantity' }
        reserved: { $ref: '#/components/schemas/Quantity' }
        available: { $ref: '#/components/schemas/SignedQuantity', description: onHand − reserved }
    DocumentLine:
      description: |
        Amounts per line, half-up to 2 decimals: grossAmount = round(qty × unitPrice); netAmount = round(qty × unitPrice ×
        (1 − discount1Pct/100) × (1 − discount2Pct/100)) from the unrounded product; discountAmount = grossAmount −
        netAmount; vatAmount = round(netAmount × vatPct/100); lineTotal = netAmount + vatAmount.
      allOf:
        - $ref: '#/components/schemas/DocumentLineWrite'
        - type: object
          required: [id, lineNo, discount1Pct, discount2Pct, vatPct, grossAmount, discountAmount, netAmount, vatAmount, lineTotal]
          properties:
            id: { type: integer }
            lineNo: { type: integer }
            stockNo: { type: string, readOnly: true }
            name: { type: string, readOnly: true }
            catalogCode: { type: integer, readOnly: true }
            onHand: { $ref: '#/components/schemas/SignedQuantity', description: 'In the document depot, now' }
            available: { $ref: '#/components/schemas/SignedQuantity', description: 'onHand − reserved in the document depot, this draft included' }
            stockByDepot:
              type: array
              description: Every depot of the company, depot code order, now (DRAFT only; omitted otherwise)
              items: { $ref: '#/components/schemas/DepotStock' }
            reservedQty:
              $ref: '#/components/schemas/Quantity'
              description: Held by this line (DRAFT); "0" when nothing is held or the reservation expired
            returnedQty:
              $ref: '#/components/schemas/Quantity'
              description: Documents that moved goods; Σ qty of posted goods-moving returns of this line. Returnable = qty − returnedQty
            grossAmount: { $ref: '#/components/schemas/Money' }
            discountAmount: { $ref: '#/components/schemas/Money' }
            netAmount: { $ref: '#/components/schemas/Money' }
            vatAmount: { $ref: '#/components/schemas/Money' }
            lineTotal: { $ref: '#/components/schemas/Money' }
    DocumentWrite:
      type: object
      required: [type, depotId, sicilId, documentDate, lines]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        depotId: { type: integer }
        sicilId: { type: integer }
        documentDate: { type: string, format: date }
        shipDate: { type: [string, 'null'], format: date }
        dueDate:
          type: [string, 'null']
          format: date
          description: "Default: documentDate + the card's payment term (gun, days; blank or not a number = 0). ≥ documentDate"
        salesRepUserId: { type: [integer, 'null'], description: "Member of the company; default the card's salesperson" }
        linkedDocumentId:
          type: [integer, 'null']
          description: |
            Required for returns and price differences, null otherwise. Returns: the SF / SF with waybill / SIR (sales)
            or AF / AF with waybill / AIR (purchases) that moved the goods, same card, not a bill. Price difference: a
            posted SF / SF with waybill / AF / AF with waybill of the same card and depot.
        priceDirection:
          oneOf:
            - $ref: '#/components/schemas/PriceDirection'
            - type: 'null'
          description: Required on PRICE_DIFFERENCE, null otherwise
        waybillDocumentId:
          type: [integer, 'null']
          description: >-
            Waybill being billed. SALES_INVOICE → SALES_WAYBILL, PURCHASE_INVOICE → PURCHASE_WAYBILL,
            SALES_RETURN → SALES_RETURN_WAYBILL, PURCHASE_RETURN → PURCHASE_RETURN_WAYBILL; same card and depot,
            POSTED by the time the bill posts, billed by one non-cancelled document, line for line. The billing
            document does not move stock. Empty `lines` copies the waybill's lines.
        description: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLineWrite' }, description: May be empty while DRAFT }
    DocumentColId:
      type: string
      description: |
        gridDocuments column ids. text: documentNo, type, status, hesapNo, sicilName, depotCode, salesRepName,
        linkedDocumentNo, waybillDocumentNo; number: grossTotal, discountTotal, netTotal, vatTotal, grandTotal;
        date: documentDate, dueDate, postedAt.
      enum: [documentNo, type, status, documentDate, dueDate, hesapNo, sicilName, depotCode, salesRepName, grossTotal,
             discountTotal, netTotal, vatTotal, grandTotal, postedAt, linkedDocumentNo, waybillDocumentNo]
    DocumentGridRequest:
      allOf:
        - $ref: '#/components/schemas/GridRequest'
        - type: object
          properties:
            sortModel:
              type: array
              items:
                type: object
                properties:
                  colId: { $ref: '#/components/schemas/DocumentColId' }
            filterModel:
              type: object
              propertyNames: { $ref: '#/components/schemas/DocumentColId' }
            types: { type: array, items: { $ref: '#/components/schemas/DocumentType' }, description: Empty or omitted = all }
            statuses: { type: array, items: { $ref: '#/components/schemas/DocumentStatus' }, description: Empty or omitted = all }
            sicilId: { type: [integer, 'null'] }
            depotId: { type: [integer, 'null'] }
            dateFrom: { type: [string, 'null'], format: date, description: 'documentDate ≥ dateFrom, inclusive' }
            dateTo: { type: [string, 'null'], format: date, description: 'documentDate ≤ dateTo, inclusive' }
            documentNo: { type: [string, 'null'], description: 'Substring of the number, literal, case-insensitive' }
            billed:
              type: [boolean, 'null']
              description: 'v1.5. Set: waybills only (SIR, AIR, SIRI, AIRI); true = billed by a non-cancelled document, false = not billed'
            billsWaybill:
              type: [boolean, 'null']
              description: 'v1.5. true = invoices and returns that bill a waybill; false = every other document (return originals)'
    DocumentSummary:
      type: object
      required: [id, type, status, depotId, depotCode, sicilId, hesapNo, sicilName, documentDate, grossTotal, discountTotal, netTotal, vatTotal, grandTotal, version]
      properties:
        id: { type: integer }
        documentNo: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        depotId: { type: integer }
        depotCode: { type: string }
        sicilId: { type: integer }
        hesapNo: { type: string }
        sicilName: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: [string, 'null'], format: date }
        salesRepName: { type: [string, 'null'] }
        grossTotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        netTotal: { $ref: '#/components/schemas/Money' }
        vatTotal: { $ref: '#/components/schemas/Money' }
        grandTotal: { $ref: '#/components/schemas/Money' }
        linkedDocumentNo: { type: [string, 'null'] }
        priceDirection:
          oneOf:
            - $ref: '#/components/schemas/PriceDirection'
            - type: 'null'
        waybillDocumentNo: { type: [string, 'null'] }
        creditOverride: { type: boolean, default: false }
        postedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    Document:
      type: object
      required: [id, orgId, type, status, depotId, sicilId, hesapNo, documentDate, currency, grossTotal, discountTotal, netTotal, vatTotal, grandTotal, vatBreakdown, lines, warnings, version]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        documentNo: { type: [string, 'null'], description: 'Allocated on post; a draft shows NumberSeries.nextValue' }
        type: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        depotId: { type: integer }
        sicilId: { type: integer }
        hesapNo: { type: string, description: "The card's account no. (v1.5)" }
        sicilName: { type: string }
        documentDate: { type: string, format: date }
        shipDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        salesRepUserId: { type: [integer, 'null'] }
        salesRepName: { type: [string, 'null'] }
        linkedDocumentId: { type: [integer, 'null'] }
        linkedDocumentNo: { type: [string, 'null'] }
        priceDirection:
          oneOf:
            - $ref: '#/components/schemas/PriceDirection'
            - type: 'null'
        waybillDocumentId: { type: [integer, 'null'] }
        waybillDocumentNo: { type: [string, 'null'] }
        billedByDocumentId: { type: [integer, 'null'], description: 'Waybills: the non-cancelled invoice or return that bills it' }
        dependentDocumentIds:
          type: array
          items: { type: integer }
          description: Posted returns and price differences that link this document (block its cancellation)
        currency: { $ref: '#/components/schemas/Currency' }
        grossTotal: { $ref: '#/components/schemas/Money', description: Σ line grossAmount }
        discountTotal: { $ref: '#/components/schemas/Money', description: Σ line discountAmount }
        netTotal: { $ref: '#/components/schemas/Money', description: grossTotal − discountTotal = Σ line netAmount }
        vatTotal: { $ref: '#/components/schemas/Money', description: Σ line vatAmount }
        grandTotal: { $ref: '#/components/schemas/Money', description: netTotal + vatTotal }
        vatBreakdown:
          type: array
          description: Per VAT rate, Σ of the lines' netAmount and vatAmount (not recomputed)
          items:
            type: object
            required: [vatPct, base, vat]
            properties:
              vatPct: { $ref: '#/components/schemas/Percent' }
              base: { $ref: '#/components/schemas/Money' }
              vat: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
        reservation:
          description: DRAFT that holds stock; null when nothing is held
          oneOf:
            - type: 'null'
            - type: object
              required: [expiresAt]
              properties:
                expiresAt: { type: string, format: date-time, description: Last save + 48 h }
        effects:
          description: |
            What posting will do (DRAFT) or did (POSTED); ADR-0013 posting table. A posting whose role has no account is
            left out (the post answers 422 ERR_ACCOUNT_ROLE_MISSING). `creditUsedPctAfter` on a POSTED document = the
            current balance / limit (the document is in the balance already), rounded half-up.
          type: object
          properties:
            ledger:
              type: array
              items:
                type: object
                required: [accountCode, side, amount]
                properties:
                  role: { type: [string, 'null'], description: 'Account role; null for the card account' }
                  accountCode: { type: string }
                  accountName: { type: string }
                  side: { $ref: '#/components/schemas/Side' }
                  amount: { $ref: '#/components/schemas/Money' }
            stock:
              type: array
              items:
                type: object
                required: [depotId, qtyDelta]
                properties:
                  depotId: { type: integer }
                  qtyDelta: { type: string, pattern: '^-?\d{1,14}(\.\d{1,4})?$' }
            creditUsedPctAfter: { type: [integer, 'null'] }
        warnings:
          type: array
          description: |
            Non-blocking. DRAFT (every read): STOCK_SHORT per line whose qty exceeds what is available to it (v1.5):
            `available` = onHand − reserved by other documents in the document depot (what this draft holds, expired
            or not, does not count against it); short when `available` < qty (`requested` = qty); lines of one part
            report the same `available`. CREDIT_LIMIT when posting would exceed the limit. PRICE_BELOW_LIST when
            unitPrice < `price_on(documentDate)` on SF, SF with waybill and SIR (not returns, not price differences).
            Post and cancel responses: NEGATIVE_STOCK, computed in that transaction from the stock levels and the
            document's movements, with the part's `stockNo` (v1.5). `stockNo` is set on every warning with a part.
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [STOCK_SHORT, NEGATIVE_STOCK, CREDIT_LIMIT, PRICE_BELOW_LIST] }
              lineNo: { type: [integer, 'null'] }
              partId: { type: [integer, 'null'] }
              stockNo: { type: [string, 'null'], description: 'Set with partId (v1.5)' }
              depotId: { type: [integer, 'null'] }
              requested: { $ref: '#/components/schemas/Quantity' }
              available: { $ref: '#/components/schemas/SignedQuantity' }
              onHandAfter: { $ref: '#/components/schemas/SignedQuantity', description: NEGATIVE_STOCK }
        creditOverride:
          description: Set when an admin posted over the credit limit
          oneOf:
            - type: 'null'
            - type: object
              required: [reason, userId, at, excess]
              properties:
                reason: { type: string }
                userId: { type: integer }
                userName: { type: string }
                at: { type: string, format: date-time }
                excess: { $ref: '#/components/schemas/Money' }
        journalEntryId: { type: [integer, 'null'], description: 'Set on post (v1.5: same transaction); null for drafts, waybills and zero totals' }
        reversalEntryId: { type: [integer, 'null'], description: 'Set on cancel when the document had an entry' }
        postedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelDate: { type: [string, 'null'], format: date }
        cancelReason: { type: [string, 'null'] }
        version: { type: integer }

    PaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER, CHEQUE, NOTE, ENDORSEMENT]
      description: ENDORSEMENT only appears on receipts issued by an ENDORSE operation.
    ReceiptCreate:
      type: object
      required: [kind, depotId, sicilId, date, method, amount]
      properties:
        kind: { type: string, enum: [COLLECTION, PAYMENT], description: 'tahsilat / tediye' }
        depotId: { type: integer }
        sicilId: { type: integer }
        date: { type: string, format: date }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        bankAccountId: { type: integer, description: Required for BANK_TRANSFER (a 102 account) }
        instrument:
          description: Required for CHEQUE and NOTE; type follows kind (collection → receivable, payment → payable)
          type: object
          required: [serialNo, issueDate, dueDate]
          properties:
            serialNo: { type: string, maxLength: 20 }
            issueDate: { type: string, format: date }
            dueDate: { type: string, format: date }
            drawerName: { type: string }
            drawerTaxNo: { type: string }
            bankName: { type: string }
            bankBranch: { type: string }
            bankCity: { type: string }
            accountNo: { type: string }
        description: { type: string }
    Receipt:
      allOf:
        - $ref: '#/components/schemas/ReceiptCreate'
        - type: object
          required: [id, orgId, receiptNo, journalEntryId, origin]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            receiptNo: { type: string, examples: [TAH-2026-1-000042] }
            origin: { type: string, enum: [MANUAL, INSTRUMENT], description: INSTRUMENT receipts are read-only; change them through the instrument }
            instrumentId: { type: [integer, 'null'] }
            instrumentNo: { type: [string, 'null'], description: '"Source" column' }
            sicilName: { type: string }
            journalEntryId: { type: integer }
            voidedByEntryId: { type: [integer, 'null'] }
    CashBookLine:
      type: object
      required: [date, kind, description, income, expense, runningBalance, resetsBalance]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [COLLECTION, PAYMENT, EXPENSE, BANK_DEPOSIT, BANK_WITHDRAWAL, CASH_COUNT, OPENING, OTHER] }
        resetsBalance:
          type: boolean
          description: |
            OPENING line of a carried year (1 January, active run): runningBalance restarts at the carried opening
            amount instead of adding to the previous line. income / expense show the opening; totals leave it out.
        documentNo: { type: [string, 'null'] }
        receiptId: { type: [integer, 'null'] }
        voucherId: { type: [integer, 'null'] }
        journalEntryId: { type: integer }
        sicilId: { type: [integer, 'null'] }
        sicilName: { type: [string, 'null'] }
        description: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        runningBalance: { $ref: '#/components/schemas/Money' }
    CashBook:
      type: object
      required: [depotId, from, to, openingBalance, totalIn, totalOut, lines, closingBalance]
      properties:
        depotId: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        openingBalance: { $ref: '#/components/schemas/Money', description: 'Balance as of from − 1 (L6: from the latest active run ≤ that day)' }
        totalIn: { $ref: '#/components/schemas/Money', description: Without resetsBalance lines }
        totalOut: { $ref: '#/components/schemas/Money', description: Without resetsBalance lines }
        lines: { type: array, items: { $ref: '#/components/schemas/CashBookLine' } }
        closingBalance: { $ref: '#/components/schemas/Money', description: 'Balance as of `to` (L6) = runningBalance of the last line, or openingBalance without lines' }
    CashVoucherCreate:
      type: object
      required: [kind, depotId, date, accountId, amount, description]
      properties:
        kind: { type: string, enum: [EXPENSE, BANK_DEPOSIT, BANK_WITHDRAWAL] }
        depotId: { type: integer }
        date: { type: string, format: date }
        accountId: { type: integer, description: Expense account (7xx) or bank account (102) }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
    CashVoucher:
      allOf:
        - $ref: '#/components/schemas/CashVoucherCreate'
        - type: object
          required: [id, voucherNo, journalEntryId]
          properties:
            id: { type: integer }
            voucherNo: { type: string, examples: [GDR-2026-1-000038] }
            journalEntryId: { type: integer }
            voidedByEntryId: { type: [integer, 'null'] }
    CashCountCreate:
      type: object
      required: [depotId, countedAmount]
      properties:
        depotId: { type: integer }
        countedAmount: { $ref: '#/components/schemas/Money' }
        postDifference: { type: boolean, default: false }
        note: { type: string }
    CashCount:
      allOf:
        - $ref: '#/components/schemas/CashCountCreate'
        - type: object
          required: [id, countedAt, bookBalance, difference]
          properties:
            id: { type: integer }
            countedAt: { type: string, format: date-time }
            bookBalance: { $ref: '#/components/schemas/Money' }
            difference: { $ref: '#/components/schemas/Money' }
            journalEntryId: { type: [integer, 'null'] }
            countedBy: { type: integer }

    InstrumentType:
      type: string
      enum: [RECEIVABLE_CHEQUE, RECEIVABLE_NOTE, PAYABLE_CHEQUE, PAYABLE_NOTE]
      description: 'alacak çeki, alacak senedi, borç çeki, borç senedi'
    InstrumentStatus:
      type: string
      enum: [PORTFOLIO, DEPOSITED, PARTIALLY_COLLECTED, COLLECTED, BOUNCED, ENDORSED, PROTESTED, RETURNED, ISSUED, PAID]
      description: 'Closed = COLLECTED, RETURNED, PAID.'
    InstrumentCreate:
      type: object
      required: [type, depotId, sicilId, serialNo, amount, issueDate, dueDate]
      properties:
        type: { $ref: '#/components/schemas/InstrumentType' }
        depotId: { type: integer }
        sicilId: { type: integer, description: 'Customer it was received from, or supplier it was issued to' }
        serialNo: { type: string, maxLength: 20 }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        drawerName: { type: string }
        drawerTaxNo: { type: string }
        bankName: { type: string }
        bankBranch: { type: string }
        bankCity: { type: string }
        accountNo: { type: string }
    Instrument:
      allOf:
        - $ref: '#/components/schemas/InstrumentCreate'
        - type: object
          required: [id, orgId, instrumentNo, status, remaining, isOverdue, receiptId, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            instrumentNo: { type: string, examples: [AC-2026-1-000007] }
            status: { $ref: '#/components/schemas/InstrumentStatus' }
            remaining: { $ref: '#/components/schemas/Money', description: amount − Σ collected; 0 exactly when COLLECTED or PAID }
            isOverdue: { type: boolean, description: Open and due date before today }
            sicilName: { type: string }
            heldBySicilId: { type: [integer, 'null'], description: Endorsee while ENDORSED }
            bankAccountId: { type: [integer, 'null'], description: While DEPOSITED }
            receiptId: { type: integer, description: Receipt issued at registration }
            version: { type: integer }
    InstrumentSummary:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items:
            type: object
            required: [tab, count, total]
            properties:
              tab: { type: string, enum: [RECEIVABLE, PAYABLE, PORTFOLIO, AT_BANK, ENDORSED, PROTESTED, CLOSED] }
              count: { type: integer }
              total: { $ref: '#/components/schemas/Money' }
        overdue:
          type: object
          properties:
            count: { type: integer }
            total: { $ref: '#/components/schemas/Money' }
        dueNext30:
          type: object
          properties:
            count: { type: integer }
            total: { $ref: '#/components/schemas/Money' }
    InstrumentOperation:
      type: object
      required: [action, date]
      properties:
        action: { type: string, enum: [DEPOSIT_TO_BANK, COLLECT_AT_BANK, COLLECT_BY_HAND, BOUNCE, ENDORSE, PROTEST, RETURN, PAY] }
        date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money', description: COLLECT_* only; defaults to remaining }
        method: { type: string, enum: [CASH, BANK_TRANSFER], description: COLLECT_BY_HAND and PAY; default CASH }
        endorseeSicilId: { type: integer, description: Required for ENDORSE }
        bankAccountId: { type: integer, description: 'Required for DEPOSIT_TO_BANK, COLLECT_AT_BANK and BANK_TRANSFER' }
        note: { type: string }
    InstrumentEvent:
      type: object
      required: [seq, action, toStatus, occurredAt]
      properties:
        seq: { type: integer }
        action: { type: string }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/InstrumentStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/InstrumentStatus' }
        occurredAt: { type: string, format: date-time }
        date: { type: string, format: date }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        remainingAfter: { $ref: '#/components/schemas/Money' }
        counterpartySicilId: { type: [integer, 'null'] }
        receiptId: { type: [integer, 'null'] }
        receiptNo: { type: [string, 'null'] }
        journalEntryId: { type: [integer, 'null'] }
        actorUserId: { type: integer }
        note: { type: [string, 'null'] }

    StockWarning:
      type: object
      description: Non-blocking. Negative stock is allowed (v1.2); the operation succeeded.
      required: [code, partId, depotId, onHandAfter]
      properties:
        code: { type: string, enum: [NEGATIVE_STOCK] }
        partId: { type: integer }
        stockNo: { type: string }
        depotId: { type: integer }
        onHandAfter: { $ref: '#/components/schemas/SignedQuantity' }

    CatalogWrite:
      type: object
      required: [code, name]
      properties:
        code: { type: integer, minimum: 1, maximum: 9999, description: Legacy KATNO; fixed after create }
        name: { type: string, maxLength: 60 }
        supplierSicilId: { type: [integer, 'null'] }
        isActive: { type: boolean, default: true }
    Catalog:
      allOf:
        - $ref: '#/components/schemas/CatalogWrite'
        - type: object
          description: A catalog is one price list. Every part belongs to exactly one catalog.
          required: [id, currency, partCount, contentVersion, version]
          properties:
            id: { type: integer }
            supplierName: { type: [string, 'null'] }
            currency: { $ref: '#/components/schemas/Currency' }
            partCount: { type: integer, description: Active parts }
            contentVersion: { type: integer, format: int64, description: Moves with every part or price change in the catalog }
            lastImportAt: { type: [string, 'null'], format: date-time }
            version: { type: integer }

    PartCode:
      type: object
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [MANUFACTURER, OEM, ALT, EQUIVALENT]
          description: 'MANUFACTURER (PRCNO), OEM (OEMNO), ALT (alternative / old code, no linked part), EQUIVALENT (muadil: links another part)'
        code:
          type: string
          minLength: 1
          maxLength: 40
          description: 'For EQUIVALENT the linked part''s stock no: the server stores it from `equivalentPartId` and ignores the sent value'
        normalizedCode: { type: string, readOnly: true, description: 'Turkish letters folded to ASCII, upper case, 0-9 A-Z only; unique per part and kind' }
        equivalentPartId: { type: [integer, 'null'], description: 'Required for EQUIVALENT; null otherwise' }
    PartWrite:
      type: object
      required: [catalogId, stockNo, name]
      properties:
        catalogId: { type: integer, description: Fixed after create }
        stockNo: { type: string, minLength: 1, maxLength: 15, description: 'Legacy STNO; unique per catalog' }
        name: { type: string, maxLength: 60 }
        type: { type: [string, 'null'], maxLength: 30 }
        brand: { type: [string, 'null'], maxLength: 30 }
        unit: { type: string, default: PCS }
        packageQty: { type: integer, minimum: 1, default: 1 }
        vatPct: { $ref: '#/components/schemas/Percent' }
        isActive: { type: boolean, default: true, description: Inactive parts are left out of search and new lines (422 ERR_PART_INACTIVE) }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' } }
        initialPrice: { $ref: '#/components/schemas/PriceWrite', description: createPart only }
    Part:
      allOf:
        - $ref: '#/components/schemas/PartWrite'
        - type: object
          required: [id, orgId, catalogCode, isActive, equivalents, lastPurchaseCost, version]
          properties:
            id: { type: integer }
            orgId: { type: integer }
            catalogCode: { type: integer }
            catalogName: { type: string }
            listPrice: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }], description: Price valid today }
            listPriceValidFrom: { type: [string, 'null'], format: date }
            nextPrice:
              description: Earliest future price, if any
              oneOf:
                - type: 'null'
                - type: object
                  required: [price, validFrom]
                  properties:
                    price: { $ref: '#/components/schemas/Money4' }
                    validFrom: { type: string, format: date }
            onHand: { $ref: '#/components/schemas/SignedQuantity', description: Sum over depots }
            lastPurchaseCost: { $ref: '#/components/schemas/LastPurchaseCost' }
            equivalents:
              type: array
              readOnly: true
              description: Parts linked by EQUIVALENT codes, either direction, by stock no
              items: { $ref: '#/components/schemas/PartEquivalent' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer }
    LastPurchaseCost:
      description: |
        v1.5. The LAST_PURCHASE branch of `last_purchase_cost()` as of today: unit net (net / qty, 4 decimals) of the
        part's line on the latest POSTED purchase invoice (with or without waybill, bills of a purchase waybill
        included; returns, waybills, price differences and cancelled invoices ignored). Null when none.
      oneOf:
        - type: 'null'
        - type: object
          required: [amount, date, documentNo]
          properties:
            amount: { $ref: '#/components/schemas/Money4' }
            date: { type: string, format: date, description: documentDate of the invoice }
            documentNo: { type: string }
    PartEquivalent:
      type: object
      required: [partId, stockNo, name, catalogId, catalogName]
      properties:
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        catalogId: { type: integer }
        catalogName: { type: string }
    PartColId:
      type: string
      description: |
        gridParts column ids. text: stockNo, name, type, brand, catalogCode, codes, unit, shelf, isActive ("true" /
        "false"); number: vatPct, packageQty, listPrice, onHand, reserved, available, minQty, maxQty; date:
        listPriceValidFrom, updatedAt.
      enum: [stockNo, name, type, brand, catalogCode, codes, unit, vatPct, packageQty, listPrice, listPriceValidFrom,
             onHand, reserved, available, minQty, maxQty, shelf, isActive, updatedAt]
    PartGridRequest:
      allOf:
        - $ref: '#/components/schemas/GridRequest'
        - type: object
          properties:
            sortModel:
              type: array
              items:
                type: object
                properties:
                  colId: { $ref: '#/components/schemas/PartColId' }
            filterModel:
              type: object
              propertyNames: { $ref: '#/components/schemas/PartColId' }
            catalogId: { type: [integer, 'null'] }
            depotId: { type: [integer, 'null'], description: Scope of the stock columns; null = all depots }
            stock: { type: string, enum: [ALL, IN_STOCK, BELOW_MIN, NEGATIVE, BELOW_MIN_OR_NEGATIVE], default: ALL }
            includeInactive: { type: boolean, default: false }
            priceDate: { type: string, format: date, description: listPrice date; defaults to today }
    PartRow:
      type: object
      required: [id, catalogId, catalogCode, stockNo, name, unit, vatPct, packageQty, isActive, onHand, reserved, available, lastPurchaseCost, belowMin, negative, version]
      properties:
        id: { type: integer }
        catalogId: { type: integer }
        catalogCode: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        type: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' } }
        unit: { type: string }
        vatPct: { $ref: '#/components/schemas/Percent' }
        packageQty: { type: integer }
        listPrice: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }] }
        listPriceValidFrom: { type: [string, 'null'], format: date }
        onHand: { $ref: '#/components/schemas/SignedQuantity' }
        reserved: { $ref: '#/components/schemas/Quantity' }
        available: { $ref: '#/components/schemas/SignedQuantity' }
        minQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        maxQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        shelf: { type: [string, 'null'] }
        lastPurchaseCost: { $ref: '#/components/schemas/LastPurchaseCost' }
        belowMin: { type: boolean, description: 'With depotId: minQty > 0 and onHand < minQty; without: in any depot' }
        negative: { type: boolean, description: 'With depotId: onHand < 0; without: in any depot' }
        stockByDepot:
          type: array
          description: 'Only when the request depotId is null: every depot of the company, depot code order, zeros included'
          items:
            type: object
            required: [depotId, depotCode, onHand, available]
            properties:
              depotId: { type: integer }
              depotCode: { type: string }
              onHand: { $ref: '#/components/schemas/SignedQuantity' }
              available: { $ref: '#/components/schemas/SignedQuantity' }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    CatalogHit:
      type: object
      required: [partId, catalogId, catalogCode, stockNo, name, stock, onHandTotal, matchKind]
      properties:
        partId: { type: integer }
        catalogId: { type: integer }
        catalogCode: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        codes: { type: array, items: { $ref: '#/components/schemas/PartCode' }, description: 'MANUFACTURER, OEM, ALT and EQUIVALENT codes' }
        matchedCode: { type: [string, 'null'], description: 'The code that matched `q`, for highlighting' }
        matchKind: { type: string, enum: [STOCK_NO, MANUFACTURER, OEM, ALT, EQUIVALENT, NAME] }
        equivalents:
          type: array
          description: Parts linked by EQUIVALENT codes, either direction
          items:
            type: object
            required: [partId, stockNo, catalogCode, onHandTotal]
            properties:
              partId: { type: integer }
              stockNo: { type: string }
              catalogCode: { type: integer }
              onHandTotal: { $ref: '#/components/schemas/SignedQuantity' }
        stock:
          type: array
          description: One entry per depot of the company
          items:
            type: object
            required: [depotId, onHand, available]
            properties:
              depotId: { type: integer }
              onHand: { $ref: '#/components/schemas/SignedQuantity' }
              available: { $ref: '#/components/schemas/SignedQuantity' }
        onHandTotal: { $ref: '#/components/schemas/SignedQuantity' }
        listPrice: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }], description: 'Catalog price valid on `date`' }
        listPriceValidFrom: { type: [string, 'null'], format: date }
        vatPct: { $ref: '#/components/schemas/Percent' }
        unit: { type: string }
        packageQty: { type: integer }
    CatalogSearchResult:
      type: object
      required: [items, total, totalCapped]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        total: { type: integer, description: 'Matches ("5 of 23"), at most 1000' }
        totalCapped: { type: boolean, description: 'True when there are more than 1000 ("1000+")' }
        date: { type: string, format: date, description: Price date used }
        nextCursor: { type: [string, 'null'] }
    PriceWrite:
      type: object
      required: [price, validFrom]
      properties:
        price: { $ref: '#/components/schemas/Money4' }
        validFrom: { type: string, format: date }
    Price:
      type: object
      description: 'One list price of a part. Valid from `validFrom` until the day before the next `validFrom`.'
      required: [partId, validFrom, source, isCurrent]
      properties:
        id: { type: integer }
        partId: { type: integer }
        catalogId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        price: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }], description: 'Null only in listPrices for a part without a price on the date' }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date, description: 'Next validFrom − 1 day; null = open-ended' }
        previousPrice: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }] }
        changePct: { type: [string, 'null'], description: 'Against previousPrice, one decimal, e.g. "6.9"' }
        isCurrent: { type: boolean, description: Valid today }
        source: { type: [string, 'null'], enum: [MANUAL, IMPORT, LEGACY, null] }
        importId: { type: [integer, 'null'] }
        createdBy: { type: [string, 'null'], description: User login }
        createdAt: { type: [string, 'null'], format: date-time }

    PriceImportTarget:
      type: string
      description: |
        Fields a column can be mapped to. code = stock no (required), price (required). Empty cells keep the
        current value; oem / manufacturerCode / altCodes, when present, replace that kind of code on the part
        (altCodes split on `listSeparator`). catalogCode, op and equivalent* are LISAKT fields.
      enum: [code, description, brand, type, manufacturerCode, oem, altCodes, price, validFrom, packQty, vatPct,
             catalogCode, op, equivalentCatalogCode, equivalentCode]
    PriceImportColumnWrite:
      type: object
      description: |
        Source of one target. CSV / XLSX: `header` (case-insensitive, trimmed) or `index` (1-based) or `letter` (XLSX).
        FIXED_WIDTH: `start` (1-based) and `length`; `scale` = implied decimals of an unsigned zoned number (0 when omitted).
      properties:
        header: { type: string }
        index: { type: integer, minimum: 1 }
        letter: { type: string, pattern: '^[A-Z]{1,3}$' }
        start: { type: integer, minimum: 1 }
        length: { type: integer, minimum: 1 }
        scale: { type: integer, minimum: 0, maximum: 6 }
    PriceImportColumn:
      description: One column of an effective mapping; an omitted `scale` is 0.
      allOf:
        - $ref: '#/components/schemas/PriceImportColumnWrite'
    PriceImportMappingWrite:
      type: object
      description: |
        Request side (`createPriceImport`, `updatePriceImport`); every field is optional. Omitted fields come from the
        preset, then the defaults: format from the file extension, encoding UTF-8, decimalSeparator `,`, dateFormat
        dd.mm.yyyy, headerRow 1, listSeparator `|`; unmapped columns are matched by header name.
      properties:
        preset: { type: [string, 'null'], enum: [LISAKT, null], description: 'Fills format, encoding, dateFormat and columns; fields given here override' }
        format: { type: string, enum: [CSV, XLSX, FIXED_WIDTH], description: 'From the extension when omitted; FIXED_WIDTH needs a preset' }
        encoding: { type: string, enum: [UTF-8, CP857, WINDOWS-1254], description: CSV and FIXED_WIDTH }
        delimiter: { type: string, maxLength: 1, description: 'CSV; detected from ; , or tab when omitted' }
        decimalSeparator: { type: string, enum: [',', '.'] }
        dateFormat: { type: string, enum: [dd.mm.yyyy, yyyy-mm-dd, yyyymmdd], description: 'Text dates; XLSX date cells are read as dates' }
        sheet: { type: string, description: XLSX sheet name; first sheet when omitted }
        headerRow: { type: integer, minimum: 0, description: '0 = no header (CSV / XLSX); data starts on the next row' }
        listSeparator: { type: string, maxLength: 1 }
        columns:
          type: object
          propertyNames: { $ref: '#/components/schemas/PriceImportTarget' }
          additionalProperties: { $ref: '#/components/schemas/PriceImportColumnWrite' }
    PriceImportMapping:
      type: object
      description: Effective mapping (responses) after the preset, the defaults and auto-mapping; `delimiter` and `sheet` only when set.
      required: [format, encoding, decimalSeparator, dateFormat, headerRow, listSeparator, columns]
      properties:
        preset: { type: [string, 'null'], enum: [LISAKT, null] }
        format: { type: string, enum: [CSV, XLSX, FIXED_WIDTH] }
        encoding: { type: string, enum: [UTF-8, CP857, WINDOWS-1254] }
        delimiter: { type: string, maxLength: 1 }
        decimalSeparator: { type: string, enum: [',', '.'] }
        dateFormat: { type: string, enum: [dd.mm.yyyy, yyyy-mm-dd, yyyymmdd] }
        sheet: { type: string }
        headerRow: { type: integer, minimum: 0 }
        listSeparator: { type: string, maxLength: 1 }
        columns:
          type: object
          propertyNames: { $ref: '#/components/schemas/PriceImportTarget' }
          additionalProperties: { $ref: '#/components/schemas/PriceImportColumn' }
    PriceImportPreset:
      type: object
      required: [code, name, mapping]
      properties:
        code: { type: string, enum: [LISAKT] }
        name: { type: string }
        mapping: { $ref: '#/components/schemas/PriceImportMapping' }
        notes: { type: string }
      examples:
        - code: LISAKT
          name: Legacy LISAKT price list (COBOL, fixed width, CP857)
          mapping:
            preset: LISAKT
            format: FIXED_WIDTH
            encoding: CP857
            decimalSeparator: '.'
            dateFormat: yyyymmdd
            headerRow: 0
            listSeparator: '|'
            columns:
              op: { start: 1, length: 1 }
              catalogCode: { start: 2, length: 4 }
              code: { start: 6, length: 15 }
              manufacturerCode: { start: 21, length: 30 }
              oem: { start: 51, length: 30 }
              type: { start: 81, length: 30 }
              description: { start: 111, length: 60 }
              brand: { start: 171, length: 30 }
              price: { start: 233, length: 14, scale: 4 }
              validFrom: { start: 257, length: 8 }
              packQty: { start: 265, length: 5 }
              equivalentCatalogCode: { start: 285, length: 4 }
              equivalentCode: { start: 289, length: 15 }
          notes: >-
            Record 319 bytes (OK-OP, ST-KAYIT, BAG). Ignored: MIN/MAX (201-232; per depot now), NOTE, SIRA,
            BISKONTO/BKDV. validFrom 00000000 → job validFrom. op 0 = DELETE, 1 insert, 2 update.
    PriceImportCounts:
      type: object
      required: [rows, new, price, attributes, unchanged, missing, delete, errors, warnings]
      properties:
        rows: { type: integer, description: Data rows in the file }
        new: { type: integer }
        price: { type: integer }
        attributes: { type: integer }
        unchanged: { type: integer }
        missing: { type: integer, description: Active catalog parts not in the file }
        delete: { type: integer }
        errors: { type: integer, description: Rows with at least one error }
        warnings: { type: integer }
    PriceImport:
      type: object
      required: [id, catalogId, catalogCode, fileName, fileSha256, fileSize, format, validFrom, status, counts, createdAt, expiresAt, version]
      properties:
        id: { type: integer }
        catalogId: { type: integer }
        catalogCode: { type: integer }
        fileName: { type: string }
        fileSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        fileSize: { type: integer }
        format: { type: string, enum: [CSV, XLSX, FIXED_WIDTH] }
        mapping:
          description: 'Effective mapping (after preset, defaults and auto-mapping); null when the sent mapping could not be resolved (FAILED ERR_IMPORT_FORMAT)'
          oneOf: [{ $ref: '#/components/schemas/PriceImportMapping' }, { type: 'null' }]
        validFrom: { type: string, format: date }
        status:
          type: string
          enum: [PARSING, NEEDS_MAPPING, READY, FAILED, APPLYING, APPLIED, DISCARDED, EXPIRED]
          description: |
            PARSING → NEEDS_MAPPING | READY | FAILED; NEEDS_MAPPING | READY → PARSING (updatePriceImport);
            READY → APPLYING → APPLIED (or back to READY on rollback); not applied → DISCARDED, or EXPIRED after 7 days.
            FAILED, APPLIED, DISCARDED and EXPIRED are final.
        failureCode: { type: [string, 'null'], enum: [ERR_IMPORT_FORMAT, ERR_IMPORT_TOO_MANY_ROWS, ERR_FILE_TOO_LARGE, null] }
        failureDetail: { type: [string, 'null'] }
        headers: { type: array, items: { type: string }, description: Detected header cells (CSV / XLSX) }
        sample: { type: array, maxItems: 5, items: { type: array, items: { type: string } }, description: 'First data rows, raw' }
        unmappedTargets: { type: array, items: { $ref: '#/components/schemas/PriceImportTarget' }, description: Required targets without a column (NEEDS_MAPPING) }
        counts: { $ref: '#/components/schemas/PriceImportCounts' }
        catalogVersion: { type: [integer, 'null'], format: int64, description: 'Catalog contentVersion the preview was built on' }
        duplicateOfImportId: { type: [integer, 'null'], description: An APPLIED import of the same file into this catalog }
        result:
          oneOf:
            - type: 'null'
            - type: object
              required: [partsCreated, pricesInserted, partsUpdated, partsDeactivated, rowsSkipped]
              properties:
                partsCreated: { type: integer }
                pricesInserted: { type: integer }
                partsUpdated: { type: integer }
                partsDeactivated: { type: integer }
                rowsSkipped: { type: integer, description: ERROR rows skipped with skipErrorRows }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        appliedBy: { type: [string, 'null'] }
        appliedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    PriceImportFields:
      type: object
      properties:
        stockNo: { type: string }
        description: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        manufacturerCode: { type: [string, 'null'] }
        oem: { type: array, items: { type: string } }
        altCodes: { type: array, items: { type: string } }
        price: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }] }
        validFrom: { type: [string, 'null'], format: date }
        packQty: { type: [integer, 'null'] }
        vatPct: { oneOf: [{ $ref: '#/components/schemas/Percent' }, { type: 'null' }] }
        equivalent:
          oneOf:
            - type: 'null'
            - type: object
              required: [catalogCode, stockNo]
              properties:
                catalogCode: { type: integer }
                stockNo: { type: string }
    PriceImportIssue:
      type: object
      required: [code]
      properties:
        field: { $ref: '#/components/schemas/PriceImportTarget' }
        code:
          type: string
          description: |
            Errors: REQUIRED, INVALID_NUMBER, INVALID_DATE, INVALID_PERCENT, NEGATIVE_PRICE, TOO_LONG, DUPLICATE_IN_FILE
            (same stock no twice), PRICE_EXISTS (a different price already on that validFrom), CATALOG_MISMATCH (LISAKT
            KATNO ≠ job catalog), UNKNOWN_OP. Warnings: BACKDATED (validFrom before the latest price), OP_MISMATCH
            (insert of an existing part, update of an unknown one, op 0 for an unknown part: no change), EQUIVALENT_NOT_FOUND, INACTIVE_PART (reactivated).
          enum: [REQUIRED, INVALID_NUMBER, INVALID_DATE, INVALID_PERCENT, NEGATIVE_PRICE, TOO_LONG, DUPLICATE_IN_FILE,
                 PRICE_EXISTS, CATALOG_MISMATCH, UNKNOWN_OP, BACKDATED, OP_MISMATCH, EQUIVALENT_NOT_FOUND, INACTIVE_PART]
        value: { type: [string, 'null'], description: Raw cell }
    PriceImportRow:
      type: object
      description: |
        NEW = stock no not in the catalog. PRICE = file price ≠ price valid on the row's validFrom (then a new price row
        is inserted; an equal price inserts nothing). ATTRIBUTES = a non-empty cell differs from the part.
        UNCHANGED = none of these. MISSING = active part of the catalog not in the file (rowNo null).
        DELETE = LISAKT op 0.
      required: [id, changes, errors, warnings]
      properties:
        id: { type: integer }
        rowNo: { type: [integer, 'null'], description: 'File row, header included; null for MISSING' }
        partId: { type: [integer, 'null'] }
        stockNo: { type: [string, 'null'] }
        changes: { type: array, items: { type: string, enum: [NEW, PRICE, ATTRIBUTES, MISSING, DELETE] }, description: Empty = UNCHANGED }
        file: { oneOf: [{ $ref: '#/components/schemas/PriceImportFields' }, { type: 'null' }] }
        current: { oneOf: [{ $ref: '#/components/schemas/PriceImportFields' }, { type: 'null' }], description: 'Catalog now; price = valid on the row validFrom' }
        changedFields: { type: array, items: { $ref: '#/components/schemas/PriceImportTarget' }, description: 'Targets that differ; PRICE rows list `price`' }
        priceChangePct: { type: [string, 'null'] }
        errors: { type: array, items: { $ref: '#/components/schemas/PriceImportIssue' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/PriceImportIssue' } }

    PartDepotSettings:
      type: object
      properties:
        minQty: { $ref: '#/components/schemas/Quantity' }
        maxQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        shelf: { type: string, maxLength: 20, examples: [A-04-2] }
    StockLevel:
      type: object
      required: [partId, onHand, reserved, available, belowMin, negative]
      properties:
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        catalogCode: { type: integer }
        depotId: { type: [integer, 'null'], description: Null on the total row }
        onHand: { $ref: '#/components/schemas/SignedQuantity', description: 'Σ movements; negative allowed' }
        reserved: { $ref: '#/components/schemas/Quantity', description: 'Held by drafts that will move stock OUT (v1.4, 48 h)' }
        available: { $ref: '#/components/schemas/SignedQuantity', description: onHand − reserved }
        minQty: { $ref: '#/components/schemas/Quantity' }
        maxQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        shelf: { type: string }
        belowMin: { type: boolean, description: minQty > 0 and onHand < minQty }
        negative: { type: boolean, description: onHand < 0 }
        version: { type: integer, description: 'Of the depot settings; 0 = no row yet' }
    MovementKind: { type: string, enum: [IN, OUT, ADJUST_IN, ADJUST_OUT, TRANSFER_IN, TRANSFER_OUT] }
    StockMovement:
      type: object
      required: [id, partId, depotId, kind, qty, delta, date, occurredAt, sourceType]
      properties:
        id: { type: integer }
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        depotId: { type: integer }
        kind: { $ref: '#/components/schemas/MovementKind' }
        label: { type: string, enum: [SALE, PURCHASE, SALES_RETURN, PURCHASE_RETURN, TRANSFER, COUNT, OPENING], description: Grid "Type" }
        qty: { $ref: '#/components/schemas/Quantity' }
        delta: { $ref: '#/components/schemas/SignedQuantity', description: '+qty for IN kinds, −qty for OUT kinds' }
        qtyIn: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }], description: 'qty for IN, ADJUST_IN, TRANSFER_IN; null otherwise' }
        qtyOut: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }], description: 'qty for OUT, ADJUST_OUT, TRANSFER_OUT; null otherwise' }
        unitCost: { oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }], description: 'Document lines: net / qty, 4 decimals half-up (v1.5)' }
        sourceType: { type: string, enum: [document, stock_count, transfer, legacy_import] }
        sourceId: { type: [string, 'null'] }
        sourceNo: { type: [string, 'null'], description: 'Document, count or transfer number' }
        documentId: { type: [integer, 'null'] }
        documentType: { oneOf: [{ $ref: '#/components/schemas/DocumentType' }, { type: 'null' }] }
        reversal: { type: boolean, default: false, description: 'Opposite movement written when the document was cancelled' }
        transferId: { type: [integer, 'null'] }
        countId: { type: [integer, 'null'] }
        sicilName: { type: [string, 'null'] }
        otherDepotId: { type: [integer, 'null'], description: Transfers }
        runningOnHand: { oneOf: [{ $ref: '#/components/schemas/SignedQuantity' }, { type: 'null' }] }
        date: { type: string, format: date }
        occurredAt: { type: string, format: date-time, description: 'Wall clock at insert (clock_timestamp()), not transaction start' }
    StockTransferCreate:
      type: object
      required: [fromDepotId, toDepotId, date, lines]
      properties:
        fromDepotId: { type: integer }
        toDepotId: { type: integer }
        date: { type: string, format: date }
        note: { type: string }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [partId, qty]
            properties:
              partId: { type: integer }
              qty: { $ref: '#/components/schemas/Quantity', description: '> 0' }
    StockTransfer:
      allOf:
        - $ref: '#/components/schemas/StockTransferCreate'
        - type: object
          required: [id, transferNo, movements, warnings]
          properties:
            id: { type: integer }
            transferNo: { type: string, examples: [TRF-2026-1-000051] }
            createdBy: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            movements: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
            warnings: { type: array, items: { $ref: '#/components/schemas/StockWarning' } }
    StockCountOpen:
      type: object
      required: [depotId, countDate]
      properties:
        depotId: { type: integer }
        countDate: { type: string, format: date, description: Date of the ADJUST movements; sets the SAY year }
        shelfFrom: { type: string }
        shelfTo: { type: string }
    StockCountLine:
      type: object
      required: [id, partId, stockNo, name, shelf, systemQty, added, costSource, version]
      properties:
        id: { type: integer }
        partId: { type: integer }
        stockNo: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        unit: { type: string }
        shelf: { type: string }
        systemQty: { $ref: '#/components/schemas/SignedQuantity', description: 'On hand at the count startedAt; frozen' }
        countedQty: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }], description: Null = not counted }
        difference: { oneOf: [{ $ref: '#/components/schemas/SignedQuantity' }, { type: 'null' }], description: 'countedQty − systemQty; null when not counted' }
        movedSinceOpen: { $ref: '#/components/schemas/SignedQuantity', description: 'Net movements of the part in the depot after startedAt (recount hint)' }
        onHandAfterPost: { oneOf: [{ $ref: '#/components/schemas/SignedQuantity' }, { type: 'null' }], description: 'On hand now + difference' }
        added: { type: boolean, description: Added during the count }
        unitCost:
          oneOf: [{ $ref: '#/components/schemas/Money4' }, { type: 'null' }]
          description: Last purchase cost on countDate (docs/domain-model.md); live while OPEN, snapshot after finalize
        costSource:
          type: string
          enum: [LAST_PURCHASE, LIST_PRICE, NONE]
          description: LIST_PRICE and NONE are flagged in the grid; NONE leaves value null
        value: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: difference × unitCost }
        countedBy: { type: [string, 'null'], description: User login }
        countedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, description: 'Line ETag; +1 per save' }
    StockCount:
      allOf:
        - $ref: '#/components/schemas/StockCountOpen'
        - type: object
          required: [id, countNo, year, status, startedAt, lineCount, countedCount, differenceCount, version]
          properties:
            id: { type: integer }
            countNo: { type: string, examples: [SAY-2026-1-000001] }
            year: { type: integer, description: Year of countDate }
            status: { type: string, enum: [OPEN, FINALIZED, CANCELLED] }
            startedAt:
              type: string
              format: date-time
              description: |
                Freeze instant of systemQty (clock_timestamp()). A movement committed after it but stamped before it
                (long transaction) counts as before the freeze.
            lineCount: { type: integer }
            countedCount: { type: integer, description: 'Progress "412 / 1,280"' }
            differenceCount: { type: integer, description: Counted lines with a difference }
            differenceValue: { $ref: '#/components/schemas/Money', description: 'Σ line value (signed)' }
            valueIn: { $ref: '#/components/schemas/Money', description: Σ positive values }
            valueOut: { $ref: '#/components/schemas/Money', description: Σ negative values, as a positive amount }
            unvaluedLines: { type: integer, description: Lines with a difference and costSource LIST_PRICE or NONE }
            uncounted: { type: [string, 'null'], enum: [SKIP, ZERO, null] }
            createdBy: { type: [string, 'null'] }
            finalizedAt: { type: [string, 'null'], format: date-time }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancelReason: { type: [string, 'null'] }
            version: { type: integer, description: 'Header ETag; moves on finalize and cancel only' }
    StockCountFinalized:
      type: object
      required: [count, movementCount, warnings]
      properties:
        count: { $ref: '#/components/schemas/StockCount' }
        movementCount: { type: integer, description: ADJUST movements written }
        warnings: { type: array, items: { $ref: '#/components/schemas/StockWarning' } }

    MigrationRun:
      type: object
      required: [id, runNo, dryRun, status, source, recordsRead, recordsImported, recordsRejected, startedAt]
      properties:
        id: { type: integer }
        runNo: { type: string, examples: [MIG-0007] }
        dryRun: { type: boolean }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        source: { type: string, examples: ['synthetic:seed-42'] }
        recordsRead: { type: integer }
        recordsImported: { type: integer }
        recordsRejected: { type: integer, description: Sent to quarantine }
        ledgerDifference: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        trialBalance:
          type: object
          description: Account balances equal between legacy and new ledger
          properties:
            accountsChecked: { type: integer }
            accountsEqual: { type: integer }
        files:
          type: array
          items:
            type: object
            required: [legacyFile, target, read, imported, rejected, controlRule, result]
            properties:
              legacyFile: { type: string, examples: [CARHAR.DAT] }
              target: { type: string, examples: ['journal_entry, posting'] }
              read: { type: integer }
              imported: { type: integer }
              rejected: { type: integer }
              controlRule: { type: string, examples: ['Σ DR = Σ CR'] }
              controlLeft: { type: [string, 'null'] }
              controlRight: { type: [string, 'null'] }
              result: { type: string, enum: [MATCH, QUARANTINE, MISMATCH] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    QuarantineRecord:
      type: object
      required: [id, legacyFile, recordKey, reason]
      properties:
        id: { type: integer }
        legacyFile: { type: string }
        recordKey: { type: string }
        reason: { type: string, examples: [ERR_PART_NOT_FOUND] }
        decoded: { type: [object, 'null'] }
        rawHex: { type: string }
    CopybookLayout:
      type: object
      required: [legacyFile, copybook, fields]
      properties:
        legacyFile: { type: string }
        copybook: { type: string, examples: [legacy/cobol/SICIL.cpz] }
        recordLength: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [level, name, pic, offset, length]
            properties:
              level: { type: integer }
              name: { type: string }
              pic: { type: string, examples: ['9(13)V99'] }
              offset: { type: integer }
              length: { type: integer }
              target: { type: [string, 'null'], examples: [sicils.credit_limit] }

    AuditEvent:
      type: object
      required: [id, orgId, occurredAt, action, entityType, entityId]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [integer, 'null'] }
        actorIp: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        action: { type: string, examples: [document.posted, sicil.updated] }
        entityType: { type: string }
        entityId: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
