                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: '#/components/schemas/Xlsx' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orgs/{orgId}/instruments/summary:
