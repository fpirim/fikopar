# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
version: '3.8'
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin
    networks:
      - fikopar
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pgadmin.entrypoints=web'
      - 'traefik.http.routers.pgadmin.rule=Host(`pgadmin.${domain}`)'
      - 'traefik.http.routers.pgadmin-secure.entrypoints=websecure'
      - 'traefik.http.routers.pgadmin-secure.rule=Host(`pgadmin.${domain}`)'
      - 'traefik.http.routers.pgadmin-secure.tls=true'
      - 'traefik.http.routers.pgadmin-secure.service=pgadmin'
      - 'traefik.http.services.pgadmin.loadbalancer.server.port=80'
      - 'traefik.docker.network=fikopar'

volumes:
  pgadmin-data: {}

networks:
  fikopar:
    external: true
