version: '3.8'

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    networks:
      - fikopar
    ports:
      - 80:80
      - 443:443
      - 5432:5432
      - 5005:5005
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config.yml:/config.yml:ro
      - traefik-data:/acme
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=fikopar'
      - 'traefik.http.routers.traefik.entrypoints=web'
      - 'traefik.http.routers.traefik.rule=Host(`traefik.${domain}`)'
      - 'traefik.http.routers.traefik-secure.entrypoints=websecure'
      - 'traefik.http.routers.traefik-secure.tls=true'
      - 'traefik.http.routers.traefik-secure.tls.certresolver=production'
      - 'traefik.http.routers.traefik-secure.tls.domains[0].main=${domain}'
      - 'traefik.http.routers.traefik-secure.tls.domains[0].sans=traefik.${domain},portainer.${domain},fikopar.${domain},pgadmin.${domain},np.${domain}'
      - 'traefik.http.routers.traefik-secure.rule=Host(`traefik.${domain}`)'
      - 'traefik.http.routers.traefik-secure.middlewares=traefik-auth@file'
      - 'traefik.http.routers.traefik-secure.service=api@internal'

volumes:
  traefik-data: {}

networks:
  fikopar:
    external: true
