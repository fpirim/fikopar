version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        # File paths are sanitized with filepath.Base before use in handlers.
        - G304

formatters:
  enable:
    - gofmt
    - goimports
