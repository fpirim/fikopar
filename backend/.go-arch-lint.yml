version: 3
# Layers: repository → services → handlers → router, wired in internal/app.
# Lower layers must not import higher ones; models and apierror are shared.
allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"

components:
  main: { in: cmd/server }
  app: { in: internal/app }
  config: { in: internal/config }
  db: { in: internal/db }
  migrations: { in: migrations }
  models: { in: internal/models }
  apierror: { in: internal/apierror }
  observability: { in: internal/observability }
  repository: { in: internal/repository }
  mocks: { in: internal/repository/mocks }
  services: { in: internal/services }
  middleware: { in: internal/middleware }
  handlers: { in: internal/handlers }
  export: { in: internal/export }
  pricefile: { in: internal/pricefile }
  router: { in: internal/router }
  testutil: { in: internal/testutil }

commonComponents:
  - models
  - apierror

deps:
  main:
    mayDependOn: [app, config, db, observability]
  app:
    mayDependOn: [config, repository, services, handlers, router]
  router:
    mayDependOn: [config, services, middleware, handlers]
  handlers:
    mayDependOn: [services, repository, export]
  middleware:
    mayDependOn: [services]
  services:
    mayDependOn: [config, repository, pricefile]
  mocks:
    mayDependOn: [repository]
  db:
    mayDependOn: [migrations]
  testutil:
    mayDependOn: [db]
