services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fikopar
      POSTGRES_PASSWORD: fikopar
      POSTGRES_DB: fikopar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fikopar"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://fikopar:fikopar@postgres:5432/fikopar?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRY_HOURS: 24
      UPLOAD_DIR: uploads/avatars
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@fikopar.local}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - avatar_uploads:/root/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  pgadmin:
    # Pre-registers the fikopar server (see docker/pgadmin).
    build: ./docker/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fikopar.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  avatar_uploads:
