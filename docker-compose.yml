services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fikopar
      POSTGRES_PASSWORD: fikopar
      POSTGRES_DB: fikopar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fikopar"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://fikopar_app:${APP_DB_PASSWORD:-fikopar_app}@postgres:5432/fikopar?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://fikopar:fikopar@postgres:5432/fikopar?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fikopar_app}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRY_HOURS: 24
      UPLOAD_DIR: uploads/avatars
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@fikopar.local}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - avatar_uploads:/root/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  pgadmin:
    # Pre-registers the fikopar server (see docker/pgadmin).
    build: ./docker/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fikopar.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Throwaway stack for frontend e2e against the real API (profile e2e, its own project):
  #   docker compose -p fikopar-e2e --profile e2e up -d --build --wait e2e-db e2e-api
  e2e-db:
    image: postgres:16-alpine
    profiles: [e2e]
    environment:
      POSTGRES_USER: fikopar
      POSTGRES_PASSWORD: fikopar
      POSTGRES_DB: fikopar
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fikopar"]
      interval: 2s
      timeout: 3s
      retries: 15

  e2e-api:
    build: ./backend
    profiles: [e2e]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://fikopar_app:e2e-app@e2e-db:5432/fikopar?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://fikopar:fikopar@e2e-db:5432/fikopar?sslmode=disable
      APP_DB_PASSWORD: e2e-app
      JWT_SECRET: e2e-only
      ADMIN_DEFAULT_EMAIL: admin@fikopar.local
      ADMIN_DEFAULT_PASSWORD: admin123
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${E2E_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      e2e-db:
        condition: service_healthy

volumes:
  pgdata:
  avatar_uploads:
